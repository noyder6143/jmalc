<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jmal C's IC3 Practice Lab</title>
<link rel="manifest" href="practice.webmanifest"><meta name="theme-color" content="#0f7c83"><link rel="icon" href="icons/practice-192.png"><link rel="apple-touch-icon" href="icons/practice-180.png"><meta name="apple-mobile-web-app-capable" content="yes">
<script src="config.js"></script><script src="sync.js"></script>
<style>
:root{--ink:#14202e;--muted:#5b6b7d;--bg:#eef3f6;--card:#fff;--line:#d5dee6;--teal:#0f7c83;--teal2:#0b5e64;--amber:#f2a516;--good:#1c8a4a;--bad:#c23b3b;--r:10px}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:.5em .9em;color:var(--ink)}
button:hover{border-color:var(--teal)}button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}button.pri:hover{background:var(--teal2)}
button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,.hot:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{background:linear-gradient(90deg,#0b3c49,#0f7c83);color:#fff;padding:.7rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header .logo{font-weight:800;letter-spacing:.3px;cursor:pointer}header .logo small{display:block;font-weight:400;opacity:.85;margin-left:0;margin-top:.15rem;font-size:.72rem;letter-spacing:.03em}
header nav{display:flex;gap:.3rem;flex-wrap:wrap;margin-left:auto}header nav button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);padding:.35em .7em;font-size:.88rem}
header nav button.on{background:#fff;color:var(--teal2)}
main{max-width:1060px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:1rem}
h1{font-size:1.35rem;margin:.2rem 0 .6rem}h2{font-size:1.1rem;margin:.2rem 0 .6rem}h3{font-size:1rem;margin:.6rem 0 .3rem}
.muted{color:var(--muted)}.small{font-size:.85rem}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.sp{flex:1}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.test{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:.8rem;display:flex;flex-direction:column;gap:.4rem}
.test .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--teal2);font-weight:700}
.meter{height:14px;background:#e3e9ee;border-radius:9px;position:relative;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#f2a516,#1c8a4a)}
.meter b{position:absolute;left:80%;top:-3px;bottom:-3px;width:2px;background:#14202e}
.bar{height:8px;background:#e3e9ee;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
table.t{border-collapse:collapse;width:100%;font-size:.9rem}table.t th,table.t td{border-bottom:1px solid var(--line);padding:.4rem;text-align:left;vertical-align:top}
.qhead{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}.timer{font-variant-numeric:tabular-nums;font-weight:700;background:#14202e;color:#fff;padding:.25em .6em;border-radius:6px}
.timer.low{background:var(--bad)}
.qtext{font-size:1.05rem;font-weight:600;margin:.2rem 0 .8rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;margin:.35rem 0;cursor:pointer;background:#fff}
.opt input{margin-top:.2rem;width:18px;height:18px;flex:none}.opt.ok{border-color:var(--good);background:#e8f6ee}.opt.no{border-color:var(--bad);background:#fbeaea}
.tfb{display:flex;gap:.6rem}.tfb button{flex:1;padding:.8rem;font-weight:700}.tfb button.sel{background:var(--teal);color:#fff}
.ynt td,.ynt th{padding:.45rem}.ynt label{display:inline-flex;gap:.3rem;align-items:center;margin-right:.6rem}
select.dd{padding:.3em;border-radius:6px;border:1px solid var(--teal);max-width:100%;margin:.15rem 0}
.match{display:grid;grid-template-columns:1fr 1.3fr;gap:.5rem;align-items:stretch}.slot{border:2px dashed #9fb3c2;border-radius:8px;min-height:2.6em;padding:.35rem .5rem;background:#f8fbfc}
.slot.over{border-color:var(--amber);background:#fff7e3}.term{border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;background:#eef6f7;font-weight:600}
.chip{display:inline-block;border:1px solid var(--teal);background:#fff;border-radius:16px;padding:.3rem .7rem;margin:.2rem;cursor:grab;font-size:.9rem}.chip.sel{background:var(--amber);border-color:var(--amber)}
.pool{min-height:2.6em;border:1px solid var(--line);border-radius:8px;padding:.3rem;margin:.5rem 0;background:#fff}
.ord li{display:flex;gap:.4rem;align-items:center;border:1px solid var(--line);border-radius:8px;padding:.4rem .5rem;margin:.3rem 0;background:#fff}.ord li span{flex:1}.ord button{padding:.2em .5em}
.ord li.drag{opacity:.4}
svg.mock{width:100%;max-width:560px;height:auto;display:block;margin:.4rem 0}.hot{cursor:pointer}.hot text{pointer-events:none}.hot:hover rect{stroke:#f2a516;stroke-width:3}.hot.pick rect{stroke:#f2a516;stroke-width:4}.hot.right rect{stroke:#1c8a4a;stroke-width:5}
.fb{border-radius:8px;padding:.7rem .8rem;margin-top:.8rem}.fb.ok{background:#e8f6ee;border:1px solid #a6d9bb}.fb.no{background:#fbeaea;border:1px solid #eab2b2}
.flag{background:#fff6dd;border:1px solid #f0cf73;border-radius:8px;padding:.6rem .8rem;margin-top:.6rem}.today{background:#e9f2ff;border:1px solid #b9d2f5;border-radius:8px;padding:.6rem .8rem;margin-top:.6rem}
.pal{display:flex;flex-wrap:wrap;gap:4px;margin-top:.6rem}.pal button{width:34px;height:30px;padding:0;font-size:.78rem}.pal .ans{background:#d9eef0}.pal .cur{outline:2px solid var(--teal)}.pal .flg{border-color:var(--amber);border-width:2px}
.pal .r{background:#cfeedd}.pal .w{background:#f6d2d2}
/* SIM windows */
.simwrap{border-radius:8px;overflow:hidden;border:1px solid #7b8794;box-shadow:0 4px 14px rgba(0,0,0,.15);background:#fff}
.simbar{display:flex;align-items:center;gap:.5rem;padding:.35rem .6rem;font-size:.85rem}.simbar b{flex:1}
.w10 .simbar{background:#fff;color:#111;border-bottom:1px solid #ddd}.w10 .simbar .ctl{letter-spacing:12px;color:#444}
.w7 .simbar{background:linear-gradient(#bcd6f0,#7fa8d6);color:#0b2440;border-bottom:1px solid #5d88b8}.w7 .simbar .ctl{background:#c9473d;color:#fff;border-radius:3px;padding:0 .5em}
.w7{border-radius:8px 8px 4px 4px}.simbody{padding:.9rem;min-height:150px}
.w10 .simbody{background:#f7f7f7}.w7 .simbody{background:linear-gradient(#f4f8fc,#e3ecf6)}
.simopt{display:block;width:100%;text-align:left;margin:.3rem 0;border-radius:3px;padding:.55rem .7rem}
.w10 .simopt{border:1px solid #ccc;background:#fff}.w10 .simopt:hover{background:#cce4f7;border-color:#0078d7}
.w7 .simopt{border:1px solid #9bb4d0;background:linear-gradient(#fff,#e8eff7);border-radius:4px}.w7 .simopt:hover{background:linear-gradient(#eaf4ff,#cfe3fb)}
.simtask{display:flex;align-items:center;gap:.4rem;padding:.3rem .5rem;font-size:.8rem}
.w10 .simtask{background:#1f1f1f;color:#ddd}.w7 .simtask{background:linear-gradient(#3c5f86,#1b3554);color:#e6eef8}
.orb{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9fe07a,#2f7d2a);border:1px solid #cfe}
.win{display:inline-block;width:18px;height:18px;background:linear-gradient(90deg,#0078d7 45%,transparent 45% 55%,#0078d7 55%)}
.hint{background:#fff4c2;color:#5a4500;border-radius:6px;padding:.45rem .6rem;margin-top:.5rem}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.simdone{background:#e8f6ee;border:1px solid #a6d9bb;border-radius:8px;padding:.6rem;margin-top:.5rem}
.navbtns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.navbtns .sp{flex:1}
.score{font-size:2.2rem;font-weight:800}.pass{color:var(--good)}.failc{color:var(--bad)}
.key{page-break-inside:avoid;border-bottom:1px solid var(--line);padding:.5rem 0}
.pill{display:inline-block;font-size:.72rem;border-radius:10px;padding:.1em .5em;background:#e3eef0;color:#0b5e64;margin-right:.25rem}
@media(max-width:600px){main{padding:.6rem}header{padding:.55rem .6rem}header nav{margin-left:0}header nav button{font-size:.78rem;padding:.3em .5em}.match{grid-template-columns:1fr}.qtext{font-size:1rem}.card{padding:.8rem}}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}main{max-width:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

remental", "Mirror of the Recycle Bin", "Differential"], "ans": 3, "why": "A differential copies everything changed since the last FULL backup, so restores need only the full + latest differential.", "dom": "4", "tests": ["O16-PE2 Q32", "IC3-PE2 Q26", "O13-PE2 Q33"]}, "br_cloud": {"id": "br_cloud", "type": "multi", "topic": "BR", "tt": "BR", "od": ["4.1.3"], "q": "Which TWO statements about cloud backup are true? (Choose 2.)", "opts": ["It only needs an Internet connection to reach it", "It can't store photos", "It works with no Internet at all", "Big files upload more slowly than copying to an external drive"], "ans": [0, 3], "why": "Cloud backup needs Internet, and upload speed limits big files.", "dom": "4", "tests": ["TT-BR Q3", "O16-PE2 Q33", "IC3-PE2 Q27", "O13-PE2 Q34"]}, "br_online_tf": {"id": "br_online_tf", "type": "tf", "topic": "BR", "tt": "BR", "od": ["4.1.3"], "q": "True or false: online backups can only be reached over the Internet.", "ans": true, "why": "Online (cloud) backups live on remote servers you reach through the Internet.", "dom": "4", "tests": ["TT-BR Q4", "O16-PE3 Q4", "IC3-PE3 Q4"]}, "br_local_limit": {"id": "br_local_limit", "type": "mc", "topic": "BR", "tt": "BR", "od": ["4.1.3"], "q": "If you back up only to another folder on the same desktop PC, what's a drawback?", "opts": ["It's too fast", "It uses too much Internet", "Space is limited to that PC's drive, and the backup dies with the PC", "It can't hold documents"], "ans": 2, "why": "Same-machine backups share the same storage and the same risks.", "dom": "4", "tests": ["TT-BR Q5", "O16-PE3 Q7", "IC3-PE3 Q7"]}, "br_reasons": {"id": "br_reasons", "type": "multi", "topic": "BR", "tt": "BR", "od": ["4.1.1"], "q": "Which TWO are good reasons to back up files? (Choose 2.)", "opts": ["A virus could damage them", "Backups clean the keyboard", "The hard drive could fail", "Backups make the Internet faster"], "ans": [0, 2], "why": "Malware, ransomware, drive failure, theft, and accidents all ", "opts": ["Converts AC power to DC", "Stores your photos", "Scans documents", "Forwards data packets between your home network and the Internet, and shares one connection with many devices"], "ans": 3, "why": "Most home routers also provide Wi-Fi and a hardware firewall.", "dom": "2", "tests": ["OR-D2 Q22"]}, "ob_hw_nic": {"id": "ob_hw_nic", "type": "mc", "topic": "HW", "tt": "OBJ", "od": ["2.11.2"], "q": "A desktop has no network adapter at all. What must be added before it can join any network?", "opts": ["A second keyboard", "A network interface card (NIC), wired or wireless", "A larger monitor", "A new mouse pad"], "ans": 1, "why": "The NIC is the hardware that connects a device to a network.", "dom": "2", "tests": ["OR-D2 Q23"]}, "ob_hw_bwdef": {"id": "ob_hw_bwdef", "type": "mc", "topic": "HW", "tt": "OBJ", "od": ["2.11.3"], "q": "Bandwidth is best described as…", "opts": ["How bright the screen is", "The length of an Ethernet cable", "How much data a connection can carry each second (for example, 300 Mbps)", "The number of USB ports"], "ans": 2, "why": "More bandwidth means more data at once, which helps streaming and many users sharing one connection.", "dom": "2", "tests": ["OR-D2 Q24"]}, "ob_hw_touch": {"id": "ob_hw_touch", "type": "multi", "topic": "HW", "tt": "OBJ", "od": ["2.13.2"], "q": "Which TWO are limits of touch input compared with a mouse and keyboard? (Choose 2.)", "opts": ["It's less precise for small buttons and text", "Typing long documents is slower on an on-screen keyboard", "It always needs a cable", "It can't zoom in"], "ans": [0, 1], "why": "Touch is great for tapping, swiping, and pinch-to-zoom, but a mouse is more precise and a keyboard is faster for long typing.", "dom": "2", "tests": ["OR-D2 Q25"]}, "ob_hw_tabmode": {"id": "ob_hw_tabmode", "type": "mc", "topic": "HW", "tt": "OBJ", "od": ["2.13.1"], "q": "In Windows 10, where do you quickly turn on Tablet mode?", "opts": ["Control Panel › Fonts", "Action Center (notifications icon by the clock) › Tablet mode", "Settings › Gaming", "File Explorer › View tab"], "ans": 1, "why": "Tablet mode makes Start and apps full screen and touch-friendly.", "today": "Windows 11 removed Tablet mode. A 2-in-1 switches layouts automatically when you fold or detach the keyboard.", "dom": "2", "tests": ["OR-D2 Q26"]}, "ob_hw_wifijoin": {"id": "ob_hw_wifijoin", "type": "mc", "topic": "HW", "tt": "OBJ", "od": ["2.5"], "q": "In Windows 10, how do you start joining a new Wi-Fi network?", "opts": ["Click the network icon on the taskbar, pick the network, select Connect, then type the security key", "Open Device Manager and uninstall the adapter", "Right-click the desktop › Personalize", "Open Task Manager › Networking"], "ans": 0, "why": "After connecting, reload the web page to confirm you're online.", "today": "Windows 11: Quick Settings › arrow next to Wi-Fi › pick the network › Connect.", "dom": "2", "tests": ["OR-D2 Q27"]}, "ob_hw_sysinfo": {"id": "ob_hw_sysinfo", "type": "mc", "topic": "HW", "tt": "OBJ", "od": ["2.12.1"], "q": "Where can you see your PC's processor type and installed RAM in Windows 10?", "opts": ["Settings › Personalization", "File Explorer › Downloads", "Task bar › Clock", "Right-click Start › System (or Control Panel › System and Security › System)"], "ans": 3, "why": "The System page (About) lists the processor, installed RAM, and 32-bit or 64-bit type.", "dom": "2", "tests": ["OR-D2 Q28"]}, "ob_hw_periph": {"id": "ob_hw_periph", "type": "mc", "topic": "HW", "tt": "OBJ", "od": ["2.3.1"], "q": "Which of these is a peripheral device?", "opts": ["The CPU", "A webcam plugged in by USB", "The RAM chips", "The motherboard"], "ans": 1, "why": "Peripherals connect from outside the main system: keyboards, mice, printers, webcams, speakers, monitors.", "dom": "2", "tests": ["OR-D2 Q29"]}, "ob_sa_appset": {"id": "ob_sa_appset", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.2.2"], "q": "Which change affects only ONE application, not the whole computer?", "opts": ["Changing the Office Theme in Word's Options", "Changing the Windows time zone", "Changing the screen resolution", "Turning on Airplane mode"], "ans": 0, "why": "Application settings (File › Options in Office) change that program. System settings (in Windows Settings) affect every app and often every user.", "dom": "3", "tests": ["OR-D3 Q1"]}, "ob_sa_person": {"id": "ob_sa_person", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.3.1"], "q": "Where do you change the Windows 10 theme, accent color, and lock screen picture?", "opts": ["Settings › Update & Security", "Task Manager › Details", "Control Panel › Programs", "Settings › Personalization"], "ans": 3, "why": "Personalization holds Background, Colors, Lock screen, Themes, Start, and Taskbar.", "dom": "3", "tests": ["OR-D3 Q2"]}, "ob_sa_ssaver": {"id": "ob_sa_ssaver", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.3.2"], "q": "You want the screen saver to start after 10 minutes of no activity. In Windows 10, where is that set?", "opts": ["Settings › Personalization › Lock screen › Screen saver settings › Wait: 10 minutes", "Control Panel › Mouse", "Settings › Time & Language", "Settings › Apps › Default apps"], "ans": 0, "why": "The old Screen Saver Settings dialog opens from the Lock screen page. Check 'On resume, display logon screen' for privacy.", "dom": "3", "tests": ["OR-D3 Q3"]}, "ob_sa_res": {"id": "ob_sa_res", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.3.3"], "q": "A user with low vision wants everything on screen to look bigger. Which change helps?", "opts": ["Change the desktop background", "Lower the screen resolution or raise the scale in Settings › System › Display", "Turn on File History", "Raise the screen resolution to the maximum"], "ans": 1, "why": "A lower resolution (or a higher scale %) makes text and icons larger.", "dom": "3", "tests": ["OR-D3 Q4"]}, "ob_sa_minim": {"id": "ob_sa_minim", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.3.5"], "q": "Which title-bar button hides a window to the taskbar without closing the program?", "opts": ["Minimize", "Maximize", "Restore Down", "Close (X)"], "ans": 0, "why": "Minimize keeps the app running. Click its taskbar button to bring it back.", "dom": "3", "tests": ["OR-D3 Q5"]}, "ob_sa_winctl": {"id": "ob_sa_winctl", "type": "multi", "topic": "SA", "tt": "OBJ", "od": ["3.3.5"], "q": "Which TWO statements about windows are true? (Choose 2.)", "opts": ["Minimize closes the program and loses your work", "Maximize makes a window fill the screen", "Dragging a window's edge or corner resizes it", "The X button only hides the window"], "ans": [1, 2], "why": "Restore Down returns a maximized window to its earlier size, and you can then drag an edge to resize.", "dom": "3", "tests": ["OR-D3 Q6"]}, "ob_sa_autorec": {"id": "ob_sa_autorec", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.4.2"], "q": "In Word 2016, where do you change how often AutoRecover information is saved?", "opts": ["File › Options › Save › Save AutoRecover information every __ minutes", "View › Zoom", "Home › Font dialog", "Insert › Header"], "ans": 0, "why": "A shorter interval (like 5 minutes) means less lost work after a crash.", "dom": "3", "tests": ["OR-D3 Q7"]}, "ob_sa_print": {"id": "ob_sa_print", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.4.4"], "q": "In Word 2016, where do you choose the printer, number of copies, pages, and Landscape orientation?", "opts": ["Home › Styles", "File › Print", "Review › Spelling", "Insert › Table"], "ans": 1, "why": "Print settings sit beside the print preview in File › Print (Ctrl+P).", "dom": "3", "tests": ["OR-D3 Q8"]}, "ob_sa_qatpath": {"id": "ob_sa_qatpath", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.4.1"], "q": "In Word, how can you add Spelling & Grammar to the Quick Access Toolbar?", "opts": ["Settings › Apps", "Right-click the desktop › New", "Click the Customize Quick Access Toolbar arrow and choose it (or right-click the ribbon button › Add to Quick Access Toolbar)", "Insert › Shapes"], "ans": 2, "why": "File › Options › Quick Access Toolbar also adds any command.", "dom": "3", "tests": ["OR-D3 Q9"]}, "ob_sa_fontpath": {"id": "ob_sa_fontpath", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.4.3"], "q": "In Word 2016, how do you make Palatino Linotype 12 the default font for new documents?", "opts": ["Type the font name in the search box", "Right-click the taskbar › Font", "Open the Font dialog box, pick the font and size, click Set As Default, then choose All documents", "Change the Windows theme"], "ans": 2, "why": "Set As Default updates the Normal template, so only new documents change.", "dom": "3", "tests": ["OR-D3 Q10"]}, "ob_sa_accttype": {"id": "ob_sa_accttype", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.5.1"], "q": "Children on a family PC should use apps but not install software or change settings. Which account type fits?", "opts": ["Standard user", "Domain admin", "Administrator", "Guest administrator"], "ans": 0, "why": "Standard accounts can use the PC but need an admin to approve installs and system changes.", "dom": "3", "tests": ["OR-D3 Q11"]}, "ob_sa_acctchg": {"id": "ob_sa_acctchg", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.5.2"], "q": "Where in Windows 10 do you change a user from Standard to Administrator?", "opts": ["Control Panel › Fonts", "Settings › Accounts › Family & other users › select the user › Change account type", "Task Manager › Users › End task", "Settings › Personalization › Colors"], "ans": 1, "why": "Only an administrator can change account types.", "dom": "3", "tests": ["OR-D3 Q12"]}, "ob_sa_scan": {"id": "ob_sa_scan", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.7.1"], "q": "What does scanning a paper document do?", "opts": ["Creates a digital image or PDF of it on the computer", "Deletes the original", "Sends it to the Recycle Bin", "Prints a second paper copy"], "ans": 0, "why": "Scanning converts a physical page into a digital file you can save, email, or upload.", "dom": "3", "tests": ["OR-D3 Q13"]}, "ob_sa_phonescan": {"id": "ob_sa_phonescan", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.7.1"], "q": "You don't have a scanner. What's a quick way to turn a signed form into a PDF?", "opts": ["Type the form again from memory", "Rename the paper form", "Use a phone scanning app (like the iPhone Notes app or Microsoft Lens) to take a picture and save it as a PDF", "Take a screenshot of your desktop"], "ans": 2, "why": "Phone scan apps crop and straighten the photo and save multi-page PDFs.", "dom": "3", "tests": ["OR-D3 Q14"]}, "ob_sa_filter": {"id": "ob_sa_filter", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.9.2"], "q": "In File Explorer, how do you show only files changed this week while searching?", "opts": ["Right-click › Send to › Desktop", "Open Task Manager", "Use the Search tab › Date modified › This week", "Sort the Recycle Bin"], "ans": 2, "why": "The Search tab also filters by Kind, Size, and other properties.", "dom": "3", "tests": ["OR-D3 Q15"]}, "ob_sa_orgperm": {"id": "ob_sa_orgperm", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.10.2"], "q": "Why do organizations give employees different permissions on shared folders?", "opts": ["So files take less space", "So everyone can delete anything", "So the network runs faster", "So people can reach the files they need while confidential files stay protected"], "ans": 3, "why": "Least privilege: give each person only the access their job needs.", "dom": "3", "tests": ["OR-D3 Q16"]}, "ob_sa_media": {"id": "ob_sa_media", "type": "multi", "topic": "SA", "tt": "OBJ", "od": ["3.12.2"], "q": "Which TWO are normal ways to get software onto a Windows PC? (Choose 2.)", "opts": ["Run the installer from a USB drive or DVD", "Copy the program's desktop shortcut from another PC", "Rename a .txt file to .exe", "Download it from the publisher's website or the Microsoft Store"], "ans": [0, 3], "why": "A shortcut only points to a program. You need the actual installer.", "dom": "3", "tests": ["OR-D3 Q17"]}, "ob_sa_progfiles": {"id": "ob_sa_progfiles", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.12.2"], "q": "Where are most Windows desktop programs installed by default?", "opts": ["The Recycle Bin", "C:\\Program Files (or C:\\Program Files (x86))", "The Downloads folder", "C:\\Users\\Public\\Pictures"], "ans": 1, "why": "Installers put program files under Program Files. Your own documents stay in your user folders.", "dom": "3", "tests": ["OR-D3 Q18"]}, "ob_sa_terms": {"id": "ob_sa_terms", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.13.2"], "q": "An app's title bar says '(Not Responding)' and clicks do nothing. The best way to describe this to the help desk:", "opts": ["The monitor is broken", "The Internet is down", "The application is frozen (not responding)", "The hard drive is full"], "ans": 2, "why": "Clear terms help support fix the right thing. A frozen app is closed with Task Manager › End task.", "dom": "3", "tests": ["OR-D3 Q19"]}, "ob_sa_hwsw": {"id": "ob_sa_hwsw", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.13.1", "3.13.2"], "q": "You press the power button and nothing happens: no lights, no fan, no screen. This is most likely a…", "opts": ["Software problem with your web browser", "Problem with your password", "Problem with a file extension", "Hardware or power problem, so check the power cable, outlet, and battery first"], "ans": 3, "why": "Start with the simplest physical checks. Software problems usually happen after the PC starts.", "dom": "3", "tests": ["OR-D3 Q20"]}, "ob_sa_tshoot": {"id": "ob_sa_tshoot", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.13.3"], "q": "Where do you run the Windows 10 Internet Connections troubleshooter?", "opts": ["Task Manager › Startup", "File Explorer › Quick access", "Settings › Personalization › Fonts", "Settings › Update & Security › Troubleshoot"], "ans": 3, "why": "Troubleshooters exist for Internet, printers, audio, Windows Update, and more.", "today": "Windows 11: Settings › System › Troubleshoot › Other troubleshooters.", "dom": "3", "tests": ["OR-D3 Q21"]}, "ob_sa_ipcfg": {"id": "ob_sa_ipcfg", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.13.4"], "q": "Which command shows your computer's IPv4 address in Command Prompt?", "opts": ["format", "ipconfig", "cls", "dir"], "ans": 1, "why": "You can also see it in Settings › Network & Internet › your connection › Properties.", "dom": "3", "tests": ["OR-D3 Q22"]}, "ob_sa_speed": {"id": "ob_sa_speed", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.13.5"], "q": "Where can you see the speed of your current network connection in Windows 10?", "opts": ["Settings › Personalization", "File Explorer › This PC", "Control Panel › Network and Sharing Center › click the connection › Speed", "Task Manager › Startup"], "ans": 2, "why": "The Status window shows the link speed (for example, 1.0 Gbps). Task Manager's Performance tab also shows live throughput.", "dom": "3", "tests": ["OR-D3 Q23"]}, "ob_sa_f5": {"id": "ob_sa_f5", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.13.1"], "q": "A web page stopped loading halfway. Which key reloads it in most browsers?", "opts": ["Delete", "F5", "F1", "Esc"], "ans": 1, "why": "F5 (or the circular-arrow button next to the address bar) asks the server for the page again.", "dom": "3", "tests": ["OR-D3 Q24"]}, "ob_sa_scut": {"id": "ob_sa_scut", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.8.1"], "q": "How do you put a shortcut to a file on the Windows desktop?", "opts": ["Right-click the taskbar › Properties", "Right-click the file › Send to › Desktop (create shortcut)", "Drag the file into the Recycle Bin", "Left-click the file twice slowly"], "ans": 1, "why": "The shortcut points to the original file, which stays where it is.", "dom": "3", "tests": ["OR-D3 Q25"]}, "ob_sa_fullctl": {"id": "ob_sa_fullctl", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.6.2"], "q": "To give a user Full control of a folder, where do you go?", "opts": ["File › Print", "Right-click › Send to › Desktop", "Right-click the folder › Properties › Security tab › Edit › select the user › Allow: Full control", "Settings › Personalization"], "ans": 2, "why": "Clear any Deny boxes first, because Deny overrides Allow.", "dom": "3", "tests": ["OR-D3 Q26"]}, "ob_sa_denyw": {"id": "ob_sa_denyw", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.6.2"], "q": "A coworker should be able to open Grades.xlsx but never change it. Which permission setting does that?", "opts": ["Allow Modify", "Delete the file", "Allow Full control", "Deny Write and leave Read allowed"], "ans": 3, "why": "Read lets them view it. Denying Write blocks saving changes.", "dom": "3", "tests": ["OR-D3 Q27"]}, "ob_sa_ronly": {"id": "ob_sa_ronly", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.6.2"], "q": "You check Read-only on a file's Properties › General tab. What happens?", "opts": ["The file is zipped", "People can open the file, but changes can't be saved over it with the same name", "The file is deleted", "The file becomes hidden from everyone"], "ans": 1, "why": "Read-only is a simple file attribute. Folder sharing permissions (view vs. edit) control what other people can do.", "dom": "3", "tests": ["OR-D3 Q28"]}, "ob_sa_open": {"id": "ob_sa_open", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.9.1"], "q": "Budget.xlsx is in the Money folder inside Documents. Which File Explorer path leads to it?", "opts": ["This PC › Pictures › Budget", "Recycle Bin › Money", "Network › Printers", "This PC › Documents › Money"], "ans": 3, "why": "Its full path looks like C:\\Users\\YourName\\Documents\\Money\\Budget.xlsx.", "dom": "3", "tests": ["OR-D3 Q29"]}, "ob_sa_repair": {"id": "ob_sa_repair", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.12.1"], "q": "Where do you choose Repair for a desktop program in Windows 10?", "opts": ["Settings › Personalization", "Task Manager › End task", "Control Panel › Programs › Programs and Features › select the program › Repair (or Change)", "File Explorer › View"], "ans": 2, "why": "Repair fixes broken program files without removing your data.", "dom": "3", "tests": ["OR-D3 Q30"]}, "ob_sa_radio": {"id": "ob_sa_radio", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.8.1"], "q": "In a dialog box, which control lets you pick only ONE option from a group?", "opts": ["A multi-select list", "Radio buttons", "The ribbon", "Check boxes"], "ans": 1, "why": "Radio buttons are round. Check boxes are square and let you turn several options on at once.", "dom": "3", "tests": ["OR-D3 Q31"]}, "ob_sa_check": {"id": "ob_sa_check", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.8.1"], "q": "Which control lets you turn several separate options on or off at the same time?", "opts": ["Radio buttons", "Check boxes", "The Close button", "The title bar"], "ans": 1, "why": "Each check box is independent.", "dom": "3", "tests": ["OR-D3 Q32"]}, "ob_sa_ctrl": {"id": "ob_sa_ctrl", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.6.3"], "q": "How do you select several files that are NOT next to each other in File Explorer?", "opts": ["Hold Alt and double-click", "Hold Ctrl and click each file", "Press F5", "Right-click the desktop"], "ans": 1, "why": "Ctrl+click picks separate items (multi-select). Shift+click selects a whole range.", "dom": "3", "tests": ["OR-D3 Q33"]}, "ob_sa_audio": {"id": "ob_sa_audio", "type": "multi", "topic": "SA", "tt": "OBJ", "od": ["3.6.1"], "q": "Which TWO extensions are audio files? (Choose 2.)", "opts": [".tif", ".mp3", ".wav", ".xlsx"], "ans": [1, 2], "why": ".mp3 is compressed audio. .wav is uncompressed audio. .tif is an image and .xlsx is an Excel workbook.", "dom": "3", "tests": ["OR-D3 Q34"]}, "ob_sa_video": {"id": "ob_sa_video", "type": "multi", "topic": "SA", "tt": "OBJ", "od": ["3.6.1"], "q": "Which TWO extensions are video files? (Choose 2.)", "opts": [".mp4", ".avi", ".txt", ".exe"], "ans": [0, 1], "why": ".mp4 plays almost everywhere. .avi is an older Microsoft video format.", "dom": "3", "tests": ["OR-D3 Q35"]}, "ob_sa_exe": {"id": "ob_sa_exe", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.6.1"], "q": "Which extension means a Windows program that runs when you open it (so be careful with email attachments)?", "opts": [".pdf", ".txt", ".jpg", ".exe"], "ans": 3, "why": "Never open an unexpected .exe attachment. It could install malware.", "dom": "3", "tests": ["OR-D3 Q36"]}, "ob_sa_tif": {"id": "ob_sa_tif", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.6.1", "3.7.2"], "q": "Which image format is often used for high-quality scans and archives?", "opts": [".tif", ".xls", ".wav", ".swf"], "ans": 0, "why": ".tif (TIFF) keeps full detail. PDF is best for multi-page documents.", "dom": "3", "tests": ["OR-D3 Q37"]}, "ob_sa_swf": {"id": "ob_sa_swf", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.6.1"], "q": "A .swf file was made for which technology, now retired?", "opts": ["Adobe Flash", "Windows Notepad", "Apple Music", "Microsoft Excel"], "ans": 0, "why": "Flash ended in 2020, so modern browsers won't play .swf files.", "dom": "3", "tests": ["OR-D3 Q38"]}, "ob_sa_excel": {"id": "ob_sa_excel", "type": "multi", "topic": "SA", "tt": "OBJ", "od": ["3.6.1"], "q": "Which TWO extensions open in Microsoft Excel? (Choose 2.)", "opts": [".avi", ".xls", ".doc", ".xlsx"], "ans": [1, 3], "why": ".xlsx is the current workbook format. .xls is the older Excel 97-2003 format.", "dom": "3", "tests": ["OR-D3 Q39"]}, "ob_sa_doc": {"id": "ob_sa_doc", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.6.1"], "q": "Which is the older Word 97-2003 document format?", "opts": [".txt", ".docx", ".pdf", ".doc"], "ans": 3, "why": ".docx is the current Word format (Word 2007 and newer).", "dom": "3", "tests": ["OR-D3 Q40"]}, "ob_sa_ipv6": {"id": "ob_sa_ipv6", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.11.1"], "q": "Which of these is written in IPv6 format?", "opt e storage. You pay for more space.", "dom": "6", "tests": ["OR-D6 Q2"]}, "ob_cc_office": {"id": "ob_cc_office", "type": "multi", "topic": "CC", "tt": "OBJ", "od": ["6.5.1"], "q": "Which TWO are online productivity (office) apps? (Choose 2.)", "opts": ["Windows Defender Firewall", "Google Docs", "Device Manager", "Word for the web (Microsoft 365)"], "ans": [1, 3], "why": "Google Docs, Sheets, and Slides and Microsoft 365's web apps run in a browser and let people co-edit.", "dom": "6", "tests": ["OR-D6 Q3"]}, "ob_cc_board": {"id": "ob_cc_board", "type": "mc", "topic": "CC", "tt": "OBJ", "od": ["6.5.5"], "q": "In a learning management system like Canvas or Google Classroom, what is a discussion board for?", "opts": ["Scanning for viruses", "Posting questions and replying to classmates in threaded conversations", "Changing the screen resolution", "Storing system restore points"], "ans": 1, "why": "Discussion boards keep class conversations organized by topic so everyone can read and reply.", "dom": "6", "tests": ["OR-D6 Q4"]}, "ob_cc_bizapps": {"id": "ob_cc_bizapps", "type": "multi", "topic": "CC", "tt": "OBJ", "od": ["6.5.3"], "q": "Which TWO are online, database-driven business apps for managing customers or projects? (Choose 2.)", "opts": ["Microsoft Paint", "Notepad", "Oracle CX (customer relationship management)", "Adobe Workfront (work and project management)"], "ans": [2, 3], "why": "Salesforce, Oracle, Microsoft Dynamics 365, and Workfront store business data in online databases.", "dom": "6", "tests": ["OR-D6 Q5"]}, "ob_cc_up": {"id": "ob_cc_up", "type": "mc", "topic": "CC", "tt": "OBJ", "od": ["6.3.1"], "q": "In OneDrive on the web, how do you upload a file from your PC?", "opts": ["Click Upload › Files and choose the file (or drag it into the browser window)", "Click Download", "Open Task Manager", "Right-click the desktop › Personalize"], "ans": 0, "why": "Uploading copies a file from your device to the cloud.", "dom": "6", "tests": ["OR-D6 Q6"]}, "ob_cc_do y a picture from OneDrive › Pictures to the Desktop?", "opts": ["Right-click the picture › Send to › Compressed folder", "Right-click the picture › Delete", "Open Task Manager › Pictures", "Open OneDrive › Pictures, right-click the picture › Copy, then right-click the Desktop › Paste"], "ans": 3, "why": "Copying leaves the cloud original in place.", "dom": "6", "tests": ["OR-D6 Q11"]}, "ob_cc_newfold": {"id": "ob_cc_newfold", "type": "mc", "topic": "SA", "tt": "OBJ", "od": ["3.6.4", "6.3.1"], "q": "How do you make a new folder inside OneDrive in File Explorer?", "opts": ["Press F5 twice", "Right-click the taskbar › New toolbar", "Settings › Accounts › New", "Open OneDrive, right-click an empty area › New › Folder, then type the name"], "ans": 3, "why": "Ctrl+Shift+N also makes a new folder in File Explorer.", "dom": "3", "tests": ["OR-D3 Q42"]}, "ob_sec_share": {"id": "ob_sec_share", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.1.1"], "q": "Why shouldn't coworkers share one username and password?", "opts": ["No one can tell who did what, and one leak exposes everyone's access", "Passwords expire faster", "It uses more storage", "It makes the network slower"], "ans": 0, "why": "Individual accounts give accountability and let admins remove one person's access without affecting others.", "dom": "7", "tests": ["OR-D7 Q2"]}, "ob_sec_mfa": {"id": "ob_sec_mfa", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.1.1", "7.1.2"], "q": "What does multi-factor authentication (MFA) add to a password?", "opts": ["A longer username", "A screen saver", "A second proof, like a code sent to your phone, so a stolen password alone isn't enough", "A faster sign-in with no password"], "ans": 2, "why": "Turn on MFA for email, banking, and school accounts.", "dom": "7", "tests": ["OR-D7 Q3"]}, "ob_sec_keylog": {"id": "ob_sec_keylog", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.3.2"], "q": "Why is a keylogger dangerous?", "opts": ["It secretly records what you type, including passwords and card numbers, and sends it to someone else", "It cleans the keyboard", "It speeds up typing", "It only changes the keyboard layout"], "ans": 0, "why": "Keyloggers and spyware are surveillance software. Antivirus scans and careful downloads help prevent them.", "dom": "7", "tests": ["OR-D7 Q4"]}, "ob_sec_avnames": {"id": "ob_sec_avnames", "type": "multi", "topic": "SEC", "tt": "OBJ", "od": ["7.5.2"], "q": "Which TWO are antivirus programs? (Choose 2.)", "opts": ["Microsoft Excel", "Microsoft Defender Antivirus", "Google Chrome", "Norton or Avast antivirus"], "ans": [1, 3], "why": "Windows 10 and 11 include Microsoft Defender Antivirus. Run only one real-time antivirus at a time.", "dom": "7", "tests": ["OR-D7 Q5"]}, "ob_sec_hwfw": {"id": "ob_sec_hwfw", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.6.2"], "q": "Which of these is a hardware firewall?", "opts": ["A browser extension", "Microsoft Defender Firewall in Windows", "An antivirus scan", "The firewall built into your home router"], "ans": 3, "why": "Hardware firewalls protect the whole network. Software firewalls protect one computer.", "dom": "7", "tests": ["OR-D7 Q6"]}, "ob_sec_block": {"id": "ob_sec_block", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.6.4"], "q": "You block an app in Windows Defender Firewall. What is the likely effect?", "opts": ["Your files are encrypted", "The app runs faster", "The app is uninstalled", "The app can't send or receive network traffic, so its online features stop working"], "ans": 3, "why": "Firewall rules allow or block connections for each app and network type (private or public).", "dom": "7", "tests": ["OR-D7 Q7"]}, "ob_sec_allow": {"id": "ob_sec_allow", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.6.3", "7.6.4"], "q": "Where do you let an app through Windows Defender Firewall on private networks only?", "opts": ["Windows Security › Firewall & network protection › Allow an app through firewall › Change settings › check Private only", "File Explorer › Share", "Settings › Personalization › Colors", "Task Manager › Startup"], "ans": 0, "why": "Leave Public unchecked so the app is blocked on café or library Wi-Fi.", "dom": "7", "tests": ["OR-D7 Q8"]}, "ob_sec_fwon": {"id": "ob_sec_fwon", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.6.5"], "q": "Your private-network firewall is off. How do you turn it back on?", "opts": ["Restart the router twice", "Windows Security › Firewall & network protection › Private network › switch Microsoft Defender Firewall to On", "Control Panel › Fonts", "Settings › Apps › Firewall › Uninstall"], "ans": 1, "why": "Keep the firewall on for all network types unless a technician tells you otherwise.", "dom": "7", "tests": ["OR-D7 Q9"]}, "ob_sec_qscan": {"id": "ob_sec_qscan", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.5.3", "7.5.1"], "q": "How do you run a quick virus scan in Windows 10?", "opts": ["Windows Security › Virus & threat protection › Quick scan", "Task Manager › Scan", "Settings › Personalization › Scan", "File Explorer › View › Scan"], "ans": 0, "why": "Check for protection updates on the same page so new threats are recognized.", "dom": "7", "tests": ["OR-D7 Q10"]}, "ob_sec_hist": {"id": "ob_sec_hist", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.4.4"], "q": "Why should you clear the browsing history on a shared computer?", "opts": ["So the printer works", "So the next user can't see the sites you visited or reopen your accounts", "So the monitor lasts longer", "So Windows updates faster"], "ans": 1, "why": "Also clear cookies, cached files, saved passwords, and form data, and sign out.", "dom": "7", "tests": ["OR-D7 Q11"]}, "ob_sec_wipe": {"id": "ob_sec_wipe", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.4.5"], "q": "In Microsoft Edge, where do you delete cookies, cached files, saved passwords, and form data?", "opts": ["Favorites › Add", "Settings › Privacy, search, and services › Clear browsing data › Choose what to clear", "Downloads › Open folder", "Settings › Appearance"], "ans": 1, "why": "Ctrl+Shift+Delete opens the same screen in Edge, Chrome, and Firefox.", "dom": "7", "tests": ["OR-D7 Q12"]}, "ob_sec_swpath": {"id": "ob_sec_swpath", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.1.5"], "q": "How do you switch to another user in Windows 10 without signing out?", "opts": ["Close all windows", "Press Ctrl+C", "Start › click your account picture › choose the other user", "Right-click the desktop › Personalize"], "ans": 2, "why": "Your apps stay open in the background for when you switch back.", "dom": "7", "tests": ["OR-D7 Q13"]}, "ob_sec_unlock": {"id": "ob_sec_unlock", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.1.5"], "q": "A Windows 10 PC shows the lock screen. How do you get back in?", "opts": ["Press F5", "Click or press a key to dismiss the lock screen, select your account if needed, and enter your password or PIN", "Unplug the PC", "Open Task Manager"], "ans": 1, "why": "Locking (Windows key + L) protects your open work while you step away.", "dom": "7", "tests": ["OR-D7 Q14"]}, "ob_sec_soceng": {"id": "ob_sec_soceng", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.2.1", "7.2.2"], "q": "A caller says he's from IT and needs your password to fix your account today. This is…", "opts": ["A software license check", "A normal request you should follow", "Social engineering, so refuse and report it", "A firewall update"], "ans": 2, "why": "Real IT staff never need your password. Attackers pretend to be trusted people to trick you.", "dom": "7", "tests": ["OR-D7 Q15"]}, "ob_sec_pphrase": {"id": "ob_sec_pphrase", "type": "mc", "topic": "SEC", "tt": "OBJ", "od": ["7.1.2"], "q": "Which is the best example of a passphrase?", "opts": ["Jmal2009", "qwerty", "password1", "Purple!Taxi-Sings-At-7"], "ans": 3, "why": "A passphrase strings random words with symbols and numbers: long, strong, and easy for you to remember.", "dom": "7", "tests": ["OR-D7 Q16"]}, "ob_se <script>
(function(){"use strict";

const KEY='ic3lab_v1';let S=load();

function rnd(seed){let x=0;for(const ch of seed)x=(x*31+ch.charCodeAt(0))>>>0;return()=>{x=(x*1103515245+12345)>>>0;return x/4294967296}}
function shuffle(a,seed){const r=seed?rnd(seed):Math.random;a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let RUN=null,TIMER=null;

function go(v,a){if(RUN&&!RUN.done&&v!=='run'&&!confirm('Leave this test? Your answers for this attempt will be lost.'))return;if(v!=='run'&&v!=='results'){stopTimer();RUN=null}window.scrollTo(0,0);nav(v);
 ({home,library,final:finalExam,custom,missed,history,key:answerKey,run:renderRun,results})[v](a)}

// ---------- stats
function readiness(){const pe=T.filter(t=>t.kind==='exam'),tt=T.filter(t=>t.kind==='topic');
 const pick=l=>l.map(t=>S.best[t.id+':test']||0);const p=pick(pe),q=pick(tt);const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
 return {pe:Math.round(avg(p)),tt:Math.round(avg(q)),all:Math.round(.6*avg(p)+.4*avg(q)),pePassed:p.filter(x=>x>=80).length,ttPassed:q.filter(x=>x>=80).length}}
function topicMastery(){const m={};Object.keys(TOP).forEach(k=>m[k]={c:0,n:0});Object.entries(S.stats).forEach(([id,s])=>{const b=B[id];if(b&&m[b.topic]){m[b.topic].n+=s.n;m[b.topic].c+=s.c}});return m}
function home(){const r=readiness(),m=topicMastery();const miss=Object.keys(S.missed).length;
 $('#app').innerHTML=`<div class="card"><h1>Welcome to the Practice Lab</h1><p class="muted"><b>Digital Literacy Class</b> · IC3 Computing Fundamentals</p><p class="muted">Practice for all ${T.filter(t=>t.kind==='topic').length} GMetrix topic tests and ${T.filter(t=>t.kind==='exam').length} practice exams, rewritten in original words. Every item tests the same skill and concept as its GMetrix counterpart. ${T.filter(t=>t.kind==='review').length} Objective Review sets cover every official IC3 GS5 objective, and the <b>Final Exam Review</b> is a ${FX.n}-question, ${FX.minutes}-minute multiple-choice mock exam like the real test. Use <b>Training Mode</b> to learn, then <b>Testing Mode</b> (50-minute timer) to prove it. Target: <b>80%+</b>.</p>
 <h2>Readiness meter</h2><div class="meter" title="80% target line"><i style="width:${r.all}%"></i><b></b></div>
 <div class="row small" style="margin-top:.3rem"><span><b>${r.all}%</b> overall (best Testing-mode scores)</span><span class="sp"></span><span>Practice exams ≥80%: <b>${r.pePassed}/8</b></span><span>Topic tests ≥80%: <b>${r.ttPassed}/7</b></span></div>
 <p class="small muted">${r.all>=80&&r.pePassed>=3?'✅ Looking exam-ready. Keep scores at 80%+ on two attempts in a row.':'Goal: 80%+ in Testing Mode on every topic test, then on the practice exams.'}</p></div>
 <div class="card"><h2>Mastery by topic</h2>${Object.entries(TOP).map(([k,n])=>{const x=m[k],p=x.n?Math.round(100*x.c/x.n):0;return `<div class="row small" style="margin:.35rem 0"><span style="width:210px">${esc(n)}</span><div class="bar sp"><i style="width:${p}%"></i></div><span style="width:72px;text-align:right">${x.n?p+'%':'–'} <span class="muted">(${x.n})</span></span></div>`}).join('')}</div>
 <div class="grid"><div class="test"><span class="tag">Start here</span><b>Test library</b><span class="small muted">7 topic tests, 8 practice exams, and 7 Objective Review sets.</span><button class="pri" data-g="library">Open tests</button></div>
 <div class="test"><span class="tag">Exam day practice</span><b>Final Exam Review</b><span class="small muted">${FX.n} multiple-choice questions, ${FX.minutes} minutes, drawn from all 7 domains. Best: ${S.best['final:test']==null?'–':S.best['final:test']+'%'}</span><button class="pri" data-g="final">Take the mock exam</button></div>

 $$('[data-g]').forEach(b=>b.onclick=()=>go(b.dataset.g))}

 $('#app').innerHTML=progs.map(p=>`<div class="card"><h2>${esc(p)}</h2>${['topic','exam','review'].map(k=>{const L=T.filter(t=>t.program===p&&t.kind===k);if(!L.length)return'';
  return `<h3>${({topic:'Topic tests',exam:'Practice exams',review:'Objective Review sets (multiple choice)'})[k]}</h3><div class="grid">${L.map(t=>{const bt=S.best[t.id+':test'],bn=S.best[t.id+':train'];return `<div class="test"><span class="tag">${({topic:'Topic test',exam:'Practice exam',review:'Objective Review'})[k]} · ${t.items.length} items${t.win==='w7'?' · Windows 7':''}</span><b>${esc(t.name)}</b>
  <span class="small muted">Best: Testing ${bt==null?'–':bt+'%'} · Training ${bn==null?'–':bn+'%'}</span>${t.note?`<span class="small muted">ℹ️ ${esc(t.note)}</span>`:''}
  <div class="row"><button data-t="${t.id}" data-m="train">Training</button><button class="pri" data-t="${t.id}" data-m="test">Testing (50 min)</button></div></div>`}).join('')}</div>`}).join('')}</div>`).join('');
 $$('[data-t]').forEach(b=>b.onclick=()=>{const t=T.find(x=>x.id===b.dataset.t);start({id:t.id,name:t.name,win:t.win,items:t.items.map((id,i)=>({id,src:t.id,qn:i+1})),mode:b.dataset.m,minutes:50})})}
function finalPlan(){const w=D.domw,tot=Object.values(w).reduce((a,b)=>a+b,0),keys=Object.keys(DOM);
 const raw=keys.map(k=>({k,x:FX.n*(w[k]||0)/tot}));raw.forEach(r=>{r.n=Math.floor(r.x);r.f=r.x-r.n});let left=FX.n-raw.reduce((a,r)=>a+r.n,0);
 raw.slice().sort((a,b)=>b.f-a.f).forEach(r=>{if(left>0){r.n++;left--}});const o={};raw.forEach(r=>o[r.k]=r.n);return o}
function finalPool(k){return Object.values(B).filter(b=>b.dom===k&&FX.types.includes(b.type))}
function finalExam(){const plan=finalPlan();const bt=S.best['final:test'];
 $('#app').innerHTML=`<div class="card"><h1>🎓 Final Exam Review</h1><p>A mock IC3 GS5 Computing Fundamentals exam: <b>${FX.n} multiple-choice questions</b> in <b>${FX.minutes} minutes</b>, like the real test. Questions are drawn at random from all 7 domains, in proportion to how many official objectives each domain has. Every attempt is a new mix.</p>
 <ul class="small"><li>Question types: single answer, "Choose 2 or 3", and True/False. No simulations, matching your real exam's multiple-choice format.</li><li>No hints or feedback until you submit. Flag questions to come back to them.</li><li>Target: <b>80%+</b>. Your score report breaks results down by domain, and misses go to your Missed deck.</li></ul>
 <table class="t"><tr><th>Domain</th><th>Questions</th><th>Pool</th></tr>${Object.entries(DOM).map(([k,n])=>`<tr><td>${k}. ${esc(n)}</td><td>${plan[k]}</td><td class="muted">${finalPool(k).length}</td></tr>`).join('')}</table>

  start({id:'final',name:'Final Exam Review',win:'w10',items:shuffle(items),mode:'test',minutes:FX.minutes,final:true})}}
function custom(){const types=[...new Set(Object.values(B).map(b=>b.type))];

function stopTimer(){if(TIMER){clearInterval(TIMER);TIMER=null}}
function fmt(s){s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function renderRun(){const R=RUN,it=R.items[R.i],b=B[it.id],train=R.mode==='train',chk=R.checked[R.i];
 $('#app').innerHTML=`<div class="card"><div class="qhead"><b>${esc(R.name)}</b><span class="pill">${train?'Training Mode':'Testing Mode'}</span><span class="sp"></span>
 <span class="muted small">Question ${R.i+1} of ${R.items.length}</span>${!train&&R.minutes?`<span class="timer" id="tm">${fmt(R.left)}</span>`:''}</div>
 <div class="small muted"><span class="pill">${esc(TOP[b.topic])}</span><span class="pill">${esc(TYPEN[b.type])}</span><span class="pill">Obj ${esc(b.od.join(', '))}</span></div>
 <div class="qtext" id="qt">${esc(b.q)}</div><div id="qa"></div><div id="fb" aria-live="polite"></div>
 <div class="navbtns noprint"><button id="pv" ${R.i===0?'disabled':''}>← Previous</button>${train?`<button class="pri" id="ck" ${chk?'disabled':''}>Check answer</button>`:`<button id="fl">${R.flags[R.i]?'★ Flagged':'☆ Flag for review'}</button>`}<span class="sp"></span>
 ${R.i<R.items.length-1?'<button class="pri" id="nx">Next →</button>':''}<button id="sub">${train?'Finish':'Submit test'}</button></div>
 <div class="pal noprint">${R.items.map((x,k)=>{let c='';if(R.resp[k]!==undefined)c+=' ans';if(k===R.i)c+=' cur';if(R.flags[k])c+=' flg';if(train&&R.checked[k])c+=(grade(B[x.id],R.resp[k])?' r':' w');return `<button class="${c}" data-k="${k}" aria-label="Question ${k+1}">${k+1}</button>`}).join('')}</div></div>`;
 renderQ(b,$('#qa'),R.i,{win:R.win,train,locked:train&&chk});if(train&&chk)showFb(b,R.resp[R.i]);
 $('#pv').onclick=()=>{R.i--;renderRun()};if($('#nx'))$('#nx').onclick=()=>{R.i++;renderRun()};
 if(train)$('#ck').onclick=()=>{if(R.resp[R.i]===undefined&&b.type!=='sim'){toast('Answer first, then check.');return}R.checked[R.i]=1;rec(b,R.resp[R.i]);renderRun()};
 else $('#fl').onclick=()=>{R.flags[R.i]=!R.flags[R.i];renderRun()};
 $('#sub').onclick=()=>{const un=R.items.length-Object.keys(R.resp).length;if(confirm(train?'Finish this session and see your score?':(un?un+' question(s) unanswered. ':'')+'Submit the test for scoring?'))finish()};
 $$('.pal button').forEach(x=>x.onclick=()=>{R.i=+x.dataset.k;renderRun()})}
function toast(m){const f=$('#fb');if(f)f.innerHTML=`<div class="hint">${esc(m)}</div>`}
function rec(b,resp){const ok=grade(b,resp);const s=S.stats[b.id]=S.stats[b.id]||{c:0,n:0};s.n++;if(ok){s.c++;delete S.missed[b.id]}else S.missed[b.id]=(S.missed[b.id]||0)+1;save();return ok}
function setResp(v){RUN.resp[RUN.i]=v;const pb=$$('.pal button')[RUN.i];if(pb)pb.classList.add('ans')}
// ---------- grading
function eqArr(a,b){return Array.isArray(a)&&Array.isArray(b)&&a.length===b.length&&a.every((x,i)=>x===b[i])}
function grade(b,r){if(r===undefined||r===null)return false;switch(b.type){
 case 'mc':return r===b.ans;case 'multi':return eqArr(r.slice().sort((x,y)=>x-y),b.ans);case 'tf':return r===b.ans;
 case 'yn':case 'dd':return eqArr(r,b.ans);case 'match':return r.length===b.left.length&&r.every((x,i)=>x===i);
 case 'order':return r.every((x,i)=>x===i);case 'img':return r===b.ans;case 'sim':return !!(r&&r.done&&r.mistakes===0);}return false}
function answerText(b,win){switch(b.type){case 'mc':return b.opts[b.ans];case 'multi':return b.ans.map(i=>b.opts[i]).join('; ');case 'tf':return b.ans?'True':'False';
 case 'yn':return b.rows.map((r,i)=>r+' → '+(b.ans[i]?'Yes':'No')).join(' | ');case 'dd':return b.blanks.map((o,i)=>o[b.ans[i]]).join(' · ');
 case 'match':return b.left.map((l,i)=>l+' = '+b.right[i]).join(' | ');case 'order':return b.steps.join(' › ');case 'img':return 'The '+(b.ansLabel||b.ans)+' area';
 case 'sim':{const v=b.variants[win]||b.variants.w10||Object.values(b.variants)[0];return v.map(s=>s.input?('type "'+s.a+'"'):s.opts[s.a]).join(' › ')}}}
function showFb(b,r){const ok=grade(b,r);const w=RUN?RUN.win:'w10';
 $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'✅ Correct':'❌ Not quite'}</b>${ok?'':'<br><b>Answer:</b> '+esc(answerText(b,w))}<br>${esc(b.why)}</div>
 ${b.flag?`<div class="flag">⚠️ <b>On GMetrix, expect…</b> ${esc(b.flag)}</div>`:''}${b.today?`<div class="today">📌 <b>Today's version:</b> ${esc(b.today)}</div>`:''}`;
 if(b.type==='img'){$$('.hot').forEach(g=>{if(g.dataset.r===b.ans)g.classList.add('right')})}}
// ---------- renderers
function renderQ(b,el,k,o){const r=RUN.resp[k],L=o.locked;
 if(b.type==='mc'||b.type==='multi'){const multi=b.type==='multi';el.innerHTML=(multi?`<div class="muted small">Choose ${b.ans.length}.</div>`:'')+b.opts.map((t,i)=>{
  const on=multi?(r||[]).includes(i):r===i;let cls='';if(L){const right=multi?b.ans.includes(i):i===b.ans;cls=right?' ok':(on?' no':'')}
  return `<label class="opt${cls}"><input type="${multi?'checkbox':'radio'}" name="o" value="${i}" ${on?'checked':''} ${L?'disabled':''}><span>${esc(t)}</span></label>`}).join('');
  $$('input',el).forEach(x=>x.onchange=()=>{if(multi){let v=$$('input:checked',el).map(y=>+y.value);if(v.length>b.ans.length){x.checked=false;v=$$('input:checked',el).map(y=>+y.value)}setResp(v.length?v:undefined);if(!v.length)delete RUN.resp[RUN.i]}else setResp(+x.value)})}
 else if(b.type==='tf'){el.innerHTML=`<div class="tfb">${[true,false].map(v=>`<button data-v="${v}" class="${r===v?'sel':''}" ${L?'disabled':''}>${v?'True':'False'}</button>`).join('')}</div>`;
  $$('button',el).forEach(x=>x.onclick=()=>{setResp(x.dataset.v==='true');$$('button',el).forEach(y=>y.classList.toggle('sel',y===x))})}
 else if(b.type==='yn'){const v=r||b.rows.map(()=>null);el.innerHTML=`<table class="t ynt"><tr><th>Statement</th><th>Yes</th><th>No</th></tr>${b.rows.map((t,i)=>`<tr><td>${esc(t)}${L?(v[i]===b.ans[i]?' ✅':' ❌'):''}</td>${[true,false].map(x=>`<td><input type="radio" name="y${i}" aria-label="${x?'Yes':'No'}" data-i="${i}" data-v="${x}" ${v[i]===x?'checked':''} ${L?'disabled':''}></td>`).join('')}</tr>`).join('')}</table>`;
  $$('input',el).forEach(x=>x.onchange=()=>{v[+x.dataset.i]=x.dataset.v==='true';if(v.every(z=>z!==null))setResp(v.slice());else RUN.resp[RUN.i]=undefined,delete RUN.resp[RUN.i];RUN._yn=v})}
 else if(b.type==='dd'){const v=r||b.blanks.map(()=>-1);let html=esc(b.text);b.blanks.forEach((opts,i)=>{html=html.replace('{'+i+'}',`<select class="dd" data-i="${i}" ${L?'disabled':''}><option value="-1">- choose -</option>${opts.map((t,j)=>`<option value="${j}" ${v[i]===j?'selected':''}>${esc(t)}</option>`).join('')}</select>`)});
  el.innerHTML=`<div style="line-height:2.2">${html}</div>`;$$('select',el).forEach(s=>s.onchange=()=>{v[+s.dataset.i]=+s.value;if(v.every(z=>z>=0))setResp(v.slice());else delete RUN.resp[RUN.i]})}
 else if(b.type==='match')renderMatch(b,el,r,L);
 else if(b.type==='order')renderOrder(b,el,r,L);
 else if(b.type==='img'){el.innerHTML=`<div class="muted small">Click (or tap) the right spot.</div>`+IMG[b.img];$$('.hot',el).forEach(g=>{if(r===g.dataset.r)g.classList.add('pick');const f=()=>{if(L)return;$$('.hot',el).forEach(x=>x.classList.remove('pick'));g.classList.add('pick');setResp(g.dataset.r)};g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}}})}
 else if(b.type==='sim')renderSim(b,el,o)}
function renderMatch(b,el,r,L){const n=b.left.length;let v=r?r.slice():Array(n).fill(-1);const order=shuffle([...Array(n).keys()],b.id);let sel=null;
 function draw(){el.innerHTML=`<div class="muted small">Drag each answer onto its term (or tap an answer, then tap a slot). Tap a filled slot to send it back.</div>
  <div class="pool" id="pool">${order.filter(j=>!v.includes(j)).map(j=>`<span class="chip${sel===j?' sel':''}" draggable="${!L}" data-j="${j}">${esc(b.right[j])}</span>`).join('')||'<span class="muted small">All placed.</span>'}</div>
  <div class="match">${b.left.map((t,i)=>`<div class="term">${esc(t)}</div><div class="slot" data-i="${i}">${v[i]>=0?`<span class="chip" data-back="${i}">${esc(b.right[v[i]])}</span>${L?(v[i]===i?' ✅':' ❌ '+esc(b.right[i])):''}`:''}</div>`).join('')}</div>`;
  if(L)return;
  $$('.chip[data-j]',el).forEach(c=>{c.onclick=()=>{sel=+c.dataset.j;draw()};c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.j)}});
  $$('.slot',el).forEach(s=>{const put=j=>{const i=+s.dataset.i;const prev=v.indexOf(j);if(prev>=0)v[prev]=-1;v[i]=j;sel=null;commit();draw()};
   s.onclick=e=>{if(e.target.dataset.back!==undefined&&sel===null){v[+e.target.dataset.back]=-1;commit();draw();return}if(sel!==null)put(sel)};
   s.ondragover=e=>{e.preventDefault();s.classList.add('over')};s.ondragleave=()=>s.classList.remove('over');s.ondrop=e=>{e.preventDefault();put(+e.dataTransfer.getData('text/plain'))}})}
 function commit(){if(v.every(x=>x>=0))setResp(v.slice());else delete RUN.resp[RUN.i]}draw()}
function renderOrder(b,el,r,L){let v=r?r.slice():shuffle([...b.steps.keys()],b.id+'o');if(v.every((x,i)=>x===i))v.reverse();let dragI=null;
 function draw(){el.innerHTML=`<div class="muted small">Put the steps in order: drag them, or use the ▲▼ buttons.</div><ol class="ord" style="padding-left:1.2rem">${v.map((j,i)=>`<li draggable="${!L}" data-i="${i}"><span>${esc(b.steps[j])}${L?(j===i?' ✅':' ❌'):''}</span>${L?'':`<button data-u="${i}" aria-label="Move up">▲</button><button data-d="${i}" aria-label="Move down">▼</button>`}</li>`).join('')}</ol>`;
  if(L)return;const sw=(a,c)=>{if(c<0||c>=v.length)return;[v[a],v[c]]=[v[c],v[a]];setResp(v.slice());draw()};
  $$('[data-u]',el).forEach(x=>x.onclick=()=>sw(+x.dataset.u,+x.dataset.u-1));$$('[data-d]',el).forEach(x=>x.onclick=()=>sw(+x.dataset.d,+x.dataset.d+1));
  $$('li',el).forEach(li=>{li.ondragstart=()=>{dragI=+li.dataset.i;li.classList.add('drag')};li.ondragover=e=>e.preventDefault();li.ondrop=e=>{e.preventDefault();const t=+li.dataset.i;if(dragI===null)return;const [m]=v.splice(dragI,1);v.splice(t,0,m);dragI=null;setResp(v.slice());draw()}})}
 if(!r)setResp(v.slice());draw()}
function renderSim(b,el,o){const steps=b.variants[o.win]||b.variants.w10;const win=b.variants[o.win]?o.win:'w10';let st=RUN.resp[RUN.i]||{step:0,mistakes:0,done:false};
 function draw(hint){const s=steps[st.step];
  if(st.done){el.innerHTML=`<div class="simdone">✅ Task complete${o.train?(st.mistakes?` with ${st.mistakes} wrong click(s). In Testing Mode, that counts as incorrect. Try again for a clean run.`:' with no wrong clicks!'):'.'}</div>${o.train?'<div class="row" style="margin-top:.5rem"><button id="again">↻ Redo this SIM</button><button id="steps">📝 Show steps</button></div><div id="stx"></div>':''}`;
   if(o.train){$('#again').onclick=()=>{st={step:0,mistakes:0,done:false};RUN.checked[RUN.i]=0;delete RUN.resp[RUN.i];renderRun()};$('#steps').onclick=()=>showSteps()}return}
  el.innerHTML=`<div class="muted small">${win==='w7'?'Windows 7 / Office 2013':'Windows 10 / Office 2016'} simulation · step ${st.step+1} of ${steps.length}${o.train?'':' · wrong clicks count against you'}</div>
  <div class="simwrap ${win}" id="sw"><div class="simbar"><b>${esc(s.screen)}</b><span class="ctl">${win==='w7'?'✕':'-▢✕'}</span></div><div class="simbody" id="sb"></div>
  <div class="simtask">${win==='w7'?'<span class="orb"></span>':'<span class="win"></span>'}<span>Start</span><span class="sp"></span><span>${win==='w7'?'🔈 🖧':'🔊 📶'}</span><span>4:05 PM</span></div></div>
  ${hint?`<div class="hint">💡 ${esc(hint)}</div>`:''}${o.train?'<div class="row" style="margin-top:.5rem"><button id="steps">📝 Show steps</button></div><div id="stx"></div>':''}`;
  const sb=$('#sb');
  if(s.input){sb.innerHTML=`<label>${esc(s.label)}<br><input id="si" autocomplete="off" style="padding:.45em;border:1px solid #889;border-radius:4px;width:100%;max-width:320px"></label><br><button class="simopt" id="sok" style="width:auto;margin-top:.5rem">OK / Enter</button>`;
   const f=()=>{const val=$('#si').value.trim();if(!val)return;if(val===String(s.a)||(!/[A-Z]/.test(s.a)&&val.toLowerCase()===String(s.a).toLowerCase()))adv();else wrong(s)};$('#sok').onclick=f;$('#si').onkeydown=e=>{if(e.key==='Enter')f()};}
  else{s.opts.forEach((t,i)=>{const x=document.createElement('button');x.className='simopt';x.textContent=t;x.onclick=()=>{if(i===s.a)adv();else wrong(s)};sb.appendChild(x)})}
  if(o.train)$('#steps').onclick=()=>showSteps()}
 function adv(){st.step++;if(st.step>=steps.length){st.done=true;RUN.resp[RUN.i]=st;setResp(st);if(o.train&&!RUN.checked[RUN.i]){RUN.checked[RUN.i]=1;rec(b,st);renderRun();return}}else RUN.resp[RUN.i]=st;draw()}
 function wrong(s){st.mistakes++;RUN.resp[RUN.i]=st;const w=$('#sw');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');if(o.train)draw('Hint: '+s.hint);}
 function showSteps(){$('#stx').innerHTML='<ol class="small">'+steps.map(s=>'<li>'+esc(s.screen)+': '+(s.input?'type <b>'+esc(s.a)+'</b>':'<b>'+esc(s.opts[s.a])+'</b>')+'</li>').join('')+'</ol>'}
 draw()}
// ---------- finish & results
function finish(){const R=RUN;stopTimer();R.done=true;let c=0;const by={};R.items.forEach((x,k)=>{const b=B[x.id],ok=grade(b,R.resp[k]);if(ok)c++;const t=by[b.topic]=by[b.topic]||{c:0,n:0};t.n++;if(ok)t.c++;
  if(R.mode==='test')rec(b,R.resp[k]);else if(!R.checked[k]&&R.resp[k]!==undefined)rec(b,R.resp[k])});
 const byd={};R.items.forEach((x,k)=>{const b=B[x.id],ok=grade(b,R.resp[k]);const t=byd[b.dom]=byd[b.dom]||{c:0,n:0};t.n++;if(ok)t.c++});
 const n=R.items.length,pct=Math.round(100*c/n),used=Math.round((Date.now()-R.t0)/1000);const h={date:new Date().toISOString(),test:R.id,name:R.name,mode:R.mode,c,n,pct,by,time:fmt(used)};if(R.final)h.byd=byd;
 S.history.push(h);S.history=S.history.slice(-300);if(R.id!=='custom'&&R.id!=='missed'){const k=R.id+':'+R.mode;S.best[k]=Math.max(S.best[k]||0,pct)}save();go('results',h)}
function results(h){const R=RUN;const miss=R?R.items.map((x,k)=>({x,k})).filter(o=>!grade(B[o.x.id],R.resp[o.k])):[];
 $('#app').innerHTML=`<div class="card"><h1>${esc(h.name)}: score report</h1><div class="row"><span class="score ${h.pct>=80?'pass':'failc'}">${h.pct}%</span><span>${h.c} of ${h.n} correct · ${h.mode==='test'?'Testing':'Training'} Mode · time ${h.time}</span></div>
 <p>${h.pct>=80?'✅ You hit the 80% target. Do it again in Testing Mode to lock it in.':'🎯 The target is 80%. Review the missed items below. They’re also in your Missed deck.'}</p>
 <h2>${h.byd?'By domain':'By topic'}</h2><table class="t"><tr><th>${h.byd?'Domain':'Topic'}</th><th>Score</th><th></th></tr>${Object.entries(h.byd||h.by).map(([k,v])=>{const p=Math.round(100*v.c/v.n);return `<tr><td>${esc(h.byd?k+'. '+DOM[k]:TOP[k])}</td><td>${v.c}/${v.n} (${p}%)</td><td style="width:40%"><div class="bar"><i style="width:${p}%;background:${p>=80?'#1c8a4a':'#f2a516'}"></i></div></td></tr>`}).join('')}</table>
 <div class="row noprint" style="margin-top:.8rem">${miss.length?'<button class="pri" id="rm">Retry missed (Training)</button>':''}<button id="lib">Back to tests</button><button id="pr">Print report</button></div></div>
 ${miss.length?`<div class="card"><h2>Review missed questions (${miss.length})</h2>${miss.map(o=>{const b=B[o.x.id];return `<div class="key"><b>Q${o.k+1}.</b> ${esc(b.q)}<br><span class="small"><b>Correct:</b> ${esc(answerText(b,R.win))}</span><br><span class="small muted">${esc(b.why)}</span>${b.flag?`<div class="flag small">⚠️ <b>On GMetrix, expect…</b> ${esc(b.flag)}</div>`:''}</div>`}).join('')}</div>`:''}`;
 if($('#rm'))$('#rm').onclick=()=>{const it=miss.map(o=>({id:o.x.id,src:'missed'}));const w=R.win;RUN=null;start({id:'missed',name:'Retry missed: '+h.name,win:w,items:it,mode:'train',minutes:0})};
 $('#lib').onclick=()=>{const f=R&&R.final;RUN=null;go(f?'final':'library')};$('#pr').onclick=()=>window.print()}
// ---------- answer key
function answerKey(){const where={};T.forEach(t=>t.items.forEach((id,i)=>{(where[id]=where[id]||[]).push(t.short+' Q'+(i+1))}));
 const order=Object.values(B).sort((a,b)=>a.topic.localeCompare(b.topic)||a.id.localeCompare(b.id));
 $('#app').innerHTML=`<div class="card"><div class="row noprint"><h1 class="sp">Instructor answer key</h1><button class="pri" id="pr">🖨️ Print / Save as PDF</button></div>
 <p class="small muted">${order.length} unique items · ${T.reduce((a,t)=>a+t.items.length,0)} test positions. Codes: ${T.map(t=>t.short+' = '+t.name+(t.kind==='topic'?' (topic test)':'')).join('; ')}. Original wording; not GMetrix text. A ready-made PDF (Answer_Key.pdf) ships alongside this file.</p>
 ${order.map((b,n)=>`<div class="key"><b>${n+1}. [${esc(b.id)}]</b> <span class="pill">${esc(TOP[b.topic])}</span><span class="pill">${esc(TYPEN[b.type])}</span><span class="pill">Obj ${esc(b.od.join(', '))}</span><br>${esc(b.q)}
 <br><b>Answer:</b> ${esc(answerText(b,'w10'))}${b.type==='sim'&&b.variants.w7?'<br><b>Windows 7 answer:</b> '+esc(answerText(b,'w7')):''}<br><span class="small muted">${esc(b.why)}</span>
 ${b.flag?`<div class="flag small">⚠️ <b>On GMetrix, expect…</b> ${esc(b.flag)}</div>`:''}<div class="small"><b>Appears in:</b> ${esc((where[b.id]||[]).join(', '))}</div></div>`).join('')}</div>`;$('#pr').onclick=()=>window.print()}
window.__lab={state:()=>S,run:()=>RUN,data:D,grade,go,start,finish};
go('home');
// Optional cloud accounts (sync.js on the class site). Without it, progress stays on this device.
if(window.JCSync)JCSync.attach({app:'practice',mount:'header',get:()=>S,set:v=>{S=Object.assign(blank(),v);save();if(!RUN||RUN.done){const on=$('#nav button.on');if(on&&!RUN)go(on.dataset.v)}}});
})();
</script><script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script></body></html>
