<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IC3 CF Practice Lab</title>
<style>
:root{--ink:#14202e;--muted:#5b6b7d;--bg:#eef3f6;--card:#fff;--line:#d5dee6;--teal:#0f7c83;--teal2:#0b5e64;--amber:#f2a516;--good:#1c8a4a;--bad:#c23b3b;--r:10px}
*{box-sizing:border-box}html,body{margin:0}body{font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,select,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:.5em .9em;color:var(--ink)}
button:hover{border-color:var(--teal)}button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}button.pri:hover{background:var(--teal2)}
button:disabled{opacity:.5;cursor:default}button:focus-visible,select:focus-visible,input:focus-visible,.hot:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
header{background:linear-gradient(90deg,#0b3c49,#0f7c83);color:#fff;padding:.7rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header .logo{font-weight:800;letter-spacing:.3px;cursor:pointer}header .logo small{font-weight:400;opacity:.8;margin-left:.4rem}
header nav{display:flex;gap:.3rem;flex-wrap:wrap;margin-left:auto}header nav button{background:transparent;color:#fff;border-color:rgba(255,255,255,.35);padding:.35em .7em;font-size:.88rem}
header nav button.on{background:#fff;color:var(--teal2)}
main{max-width:1060px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem;margin-bottom:1rem}
h1{font-size:1.35rem;margin:.2rem 0 .6rem}h2{font-size:1.1rem;margin:.2rem 0 .6rem}h3{font-size:1rem;margin:.6rem 0 .3rem}
.muted{color:var(--muted)}.small{font-size:.85rem}.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.sp{flex:1}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.test{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:.8rem;display:flex;flex-direction:column;gap:.4rem}
.test .tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--teal2);font-weight:700}
.meter{height:14px;background:#e3e9ee;border-radius:9px;position:relative;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#f2a516,#1c8a4a)}
.meter b{position:absolute;left:80%;top:-3px;bottom:-3px;width:2px;background:#14202e}
.bar{height:8px;background:#e3e9ee;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
table.t{border-collapse:collapse;width:100%;font-size:.9rem}table.t th,table.t td{border-bottom:1px solid var(--line);padding:.4rem;text-align:left;vertical-align:top}
.qhead{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}.timer{font-variant-numeric:tabular-nums;font-weight:700;background:#14202e;color:#fff;padding:.25em .6em;border-radius:6px}
.timer.low{background:var(--bad)}
.qtext{font-size:1.05rem;font-weight:600;margin:.2rem 0 .8rem}
.opt{display:flex;gap:.6rem;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;margin:.35rem 0;cursor:pointer;background:#fff}
.opt input{margin-top:.2rem;width:18px;height:18px;flex:none}.opt.ok{border-color:var(--good);background:#e8f6ee}.opt.no{border-color:var(--bad);background:#fbeaea}
.tfb{display:flex;gap:.6rem}.tfb button{flex:1;padding:.8rem;font-weight:700}.tfb button.sel{background:var(--teal);color:#fff}
.ynt td,.ynt th{padding:.45rem}.ynt label{display:inline-flex;gap:.3rem;align-items:center;margin-right:.6rem}
select.dd{padding:.3em;border-radius:6px;border:1px solid var(--teal);max-width:100%;margin:.15rem 0}
.match{display:grid;grid-template-columns:1fr 1.3fr;gap:.5rem;align-items:stretch}.slot{border:2px dashed #9fb3c2;border-radius:8px;min-height:2.6em;padding:.35rem .5rem;background:#f8fbfc}
.slot.over{border-color:var(--amber);background:#fff7e3}.term{border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;background:#eef6f7;font-weight:600}
.chip{display:inline-block;border:1px solid var(--teal);background:#fff;border-radius:16px;padding:.3rem .7rem;margin:.2rem;cursor:grab;font-size:.9rem}.chip.sel{background:var(--amber);border-color:var(--amber)}
.pool{min-height:2.6em;border:1px solid var(--line);border-radius:8px;padding:.3rem;margin:.5rem 0;background:#fff}
.ord li{display:flex;gap:.4rem;align-items:center;border:1px solid var(--line);border-radius:8px;padding:.4rem .5rem;margin:.3rem 0;background:#fff}.ord li span{flex:1}.ord button{padding:.2em .5em}
.ord li.drag{opacity:.4}
svg.mock{width:100%;max-width:560px;height:auto;display:block;margin:.4rem 0}.hot{cursor:pointer}.hot text{pointer-events:none}.hot:hover rect{stroke:#f2a516;stroke-width:3}.hot.pick rect{stroke:#f2a516;stroke-width:4}.hot.right rect{stroke:#1c8a4a;stroke-width:5}
.fb{border-radius:8px;padding:.7rem .8rem;margin-top:.8rem}.fb.ok{background:#e8f6ee;border:1px solid #a6d9bb}.fb.no{background:#fbeaea;border:1px solid #eab2b2}
.flag{background:#fff6dd;border:1px solid #f0cf73;border-radius:8px;padding:.6rem .8rem;margin-top:.6rem}.today{background:#e9f2ff;border:1px solid #b9d2f5;border-radius:8px;padding:.6rem .8rem;margin-top:.6rem}
.pal{display:flex;flex-wrap:wrap;gap:4px;margin-top:.6rem}.pal button{width:34px;height:30px;padding:0;font-size:.78rem}.pal .ans{background:#d9eef0}.pal .cur{outline:2px solid var(--teal)}.pal .flg{border-color:var(--amber);border-width:2px}
.pal .r{background:#cfeedd}.pal .w{background:#f6d2d2}
/* SIM windows */
.simwrap{border-radius:8px;overflow:hidden;border:1px solid #7b8794;box-shadow:0 4px 14px rgba(0,0,0,.15);background:#fff}
.simbar{display:flex;align-items:center;gap:.5rem;padding:.35rem .6rem;font-size:.85rem}.simbar b{flex:1}
.w10 .simbar{background:#fff;color:#111;border-bottom:1px solid #ddd}.w10 .simbar .ctl{letter-spacing:12px;color:#444}
.w7 .simbar{background:linear-gradient(#bcd6f0,#7fa8d6);color:#0b2440;border-bottom:1px solid #5d88b8}.w7 .simbar .ctl{background:#c9473d;color:#fff;border-radius:3px;padding:0 .5em}
.w7{border-radius:8px 8px 4px 4px}.simbody{padding:.9rem;min-height:150px}
.w10 .simbody{background:#f7f7f7}.w7 .simbody{background:linear-gradient(#f4f8fc,#e3ecf6)}
.simopt{display:block;width:100%;text-align:left;margin:.3rem 0;border-radius:3px;padding:.55rem .7rem}
.w10 .simopt{border:1px solid #ccc;background:#fff}.w10 .simopt:hover{background:#cce4f7;border-color:#0078d7}
.w7 .simopt{border:1px solid #9bb4d0;background:linear-gradient(#fff,#e8eff7);border-radius:4px}.w7 .simopt:hover{background:linear-gradient(#eaf4ff,#cfe3fb)}
.simtask{display:flex;align-items:center;gap:.4rem;padding:.3rem .5rem;font-size:.8rem}
.w10 .simtask{background:#1f1f1f;color:#ddd}.w7 .simtask{background:linear-gradient(#3c5f86,#1b3554);color:#e6eef8}
.orb{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9fe07a,#2f7d2a);border:1px solid #cfe}
.win{display:inline-block;width:18px;height:18px;background:linear-gradient(90deg,#0078d7 45%,transparent 45% 55%,#0078d7 55%)}
.hint{background:#fff4c2;color:#5a4500;border-radius:6px;padding:.45rem .6rem;margin-top:.5rem}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.simdone{background:#e8f6ee;border:1px solid #a6d9bb;border-radius:8px;padding:.6rem;margin-top:.5rem}
.navbtns{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}.navbtns .sp{flex:1}
.score{font-size:2.2rem;font-weight:800}.pass{color:var(--good)}.failc{color:var(--bad)}
.key{page-break-inside:avoid;border-bottom:1px solid var(--line);padding:.5rem 0}
.pill{display:inline-block;font-size:.72rem;border-radius:10px;padding:.1em .5em;background:#e3eef0;color:#0b5e64;margin-right:.25rem}
@media(max-width:600px){main{padding:.6rem}header{padding:.55rem .6rem}header nav{margin-left:0}header nav button{font-size:.78rem;padding:.3em .5em}.match{grid-template-columns:1fr}.qtext{font-size:1rem}.card{padding:.8rem}}
@media print{header,.noprint{display:none!important}body{background:#fff}.card{border:0;padding:0}main{max-width:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

: ["1.5.1"], "q": "True or false: the letters SMS can stand for 'Short Message Service' (texting) and also for 'System Management Server' (a Microsoft IT tool).", "ans": true, "why": "In phones it means Short Message Service. In IT, Microsoft's System Management Server also uses SMS. Context tells you which.", "tests": ["TT-MD Q13", "O16-PE3 Q38", "IC3-PE3 Q35"]}, "md_cell_needs": {"id": "md_cell_needs", "type": "multi", "topic": "MD", "tt": "MD", "od": ["1.1.2", "1.1.3"], "q": "Which THREE statements about cell phone service are accurate? (Choose 3.)", "opts": ["Calls never use any minutes", "Not every plan includes texting or data", "You need an account with a carrier", "You won't always have reception", "Every phone works on every carrier with no changes"], "ans": [1, 2, 3], "why": "Service depends on a carrier plan, plan features, and coverage.", "tests": ["TT-MD Q14", "O16-PE1 Q2", "IC3-PE1 Q2", "O13-PE1 Q1"]}, "md_sim_id": {"id": "md_sim_id", "type": "mc", "topic": "MD", "tt": "MD", "od": ["1.1.2"], "q": "What does a phone's SIM card mainly do?", "opts": ["Stores your subscriber info so the carrier recognizes your phone number", "Acts as a backup battery", "Adds extra storage for photos", "Speeds up the processor"], "ans": 0, "why": "The SIM identifies your account/number on the network.", "tests": ["TT-MD Q15", "O16-PE1 Q3", "IC3-PE1 Q3", "O13-PE1 Q2"]}, "md_net_gen": {"id": "md_net_gen", "type": "multi", "topic": "MD", "tt": "MD", "od": ["1.1.1"], "q": "Which TWO are cellular data network types? (Choose 2.)", "opts": ["Ethernet", "HDMI", "3G", "LTE (4G)"], "ans": [2, 3], "why": "3G, 4G LTE, and 5G are cellular generations. Ethernet is wired. HDMI is video.", "today": "3G networks have been shut down in the US. Today's phones use 4G LTE and 5G.", "tests": ["TT-MD Q16", "O16-PE1 Q4", "IC3-PE1 Q4", "O13-PE1 Q3"]}, "md_public_free": {"id": "md_public_free", "type": "mc", "topic": "MD", "tt": "MD", "od": ["1.1.3"], "q": "You're on a long call over the library's free Wi-Fi. Does it use up your cellular data?", "opts": ["Only on Android phones", "No. Public Wi-Fi doesn't count against your data plan", "Only if it's after 9 p.m.", "Yes, double the usual amount"], "ans": 1, "why": "Traffic over Wi-Fi doesn't use cellular data (just be careful with security on public Wi-Fi).", "tests": ["TT-MD Q17", "O16-PE1 Q5", "IC3-PE1 Q5", "O13-PE1 Q4"]}, "md_tab_apps": {"id": "md_tab_apps", "type": "mc", "topic": "MD", "tt": "MD", "od": ["1.2.2"], "q": "Which statement about apps on tablets is true?", "opts": ["Every phone and desktop app runs on every tablet", "Apps only run on tablets with SIM cards", "Tablets can't install apps", "Some apps won't install or run on a tablet"], "ans": 3, "why": "Apps must support the device's OS and screen. Some are phone-only or desktop-only.", "tests": ["TT-MD Q18", "O16-PE1 Q6", "IC3-PE1 Q6", "O13-PE1 Q5"]}, "md_wifitab_biz": {"id": "md_wifitab_biz", "type": "multi", "topic": "MD", "tt": "HW", "od": ["1.2.3"], "q": "Which TWO businesses would do fine with Wi-Fi-only tablets? (Choose 2.)", "opts": ["A delivery driver navigating city streets", "A clothing store checking stock on the sales floor", "A restaurant taking orders at the tables", "A home-health aide visiting patients"], "ans": [1, 2], "why": "If staff stay inside one building with Wi-Fi, cheaper Wi-Fi-only tablets work.", "tests": ["TT-HW Q3", "O16-PE1 Q7", "IC3-PE1 Q7", "O13-PE1 Q6"]}, "md_sell_phone": {"id": "md_sell_phone", "type": "multi", "topic": "MD", "tt": "MD", "od": ["4.3.4"], "q": "Before you sell your old phone on Facebook Marketplace, which TWO steps protect you? (Choose 2.)", "opts": ["Take out your SIM card", "Do a factory reset to erase your data", "Install a new game", "Turn the brightness all the way up"], "ans": [0, 1], "why": "Back up, sign out of accounts, factory reset, and remove the SIM so the buyer gets a clean phone.", "tests": ["TT-MD Q19", "O16-PE1 Q8", "IC3-PE1 Q8", "O13-PE1 Q7"]}, "md_save_data": {"id": "md_save_data", "type": "multi", "topic": "MD", "tt": "MD", "od": ["1.1.3"], "q": "Which THREE habits burn through your cellular data fastest? (Choose 3.)", "opts": ["Setting an alarm", "Reading a text message", "Uploading HD videos over cellular", "Leaving apps signed in and syncing in the background", "Streaming movies or music on cellular"], "ans": [2, 3, 4], "why": "Video and constant background syncing use the most data. Use Wi-Fi for big transfers.", "tests": ["TT-MD Q20", "O16-PE1 Q9", "IC3-PE1 Q9", "O13-PE1 Q8"]}, "md_online_ways": {"id": "md_online_ways", "type": "multi", "topic": "MD", "tt": "HW", "od": ["1.1.1"], "q": "Which THREE are ways a smartphone can get on the Internet? (Choose 3.)", "opts": ["A PS/2 port", "The carrier's data plan", "Wi-Fi", "A VGA cable", "Another device's hotspot"], "ans": [1, 2, 4], "why": "Phones go online over Wi-Fi, hotspots, or cellular data.", "tests": ["TT-HW Q4", "O16-PE1 Q10", "IC3-PE1 Q10", "O13-PE1 Q9"]}, "md_smart_extras": {"id": "md_smart_extras", "type": "multi", "topic": "MD", "tt": "MD", "od": ["1.3.1"], "q": "Which TWO things can a smartphone do that a basic flip phone usually can't? (Choose 2.)", "opts": ["Open and edit documents", "Make voice calls", "Store contacts", "Browse full websites"], "ans": [0, 3], "why": "Smartphones run apps for browsing and documents. Basic phones mostly call and text.", "tests": ["TT-MD Q21", "O16-PE1 Q11", "IC3-PE1 Q11", "O13-PE1 Q10"]}, "md_vm_biz": {"id": "md_vm_biz", "type": "multi", "topic": "MD", "tt": "MD", "od": ["1.4.2"], "q": "Which THREE belong in a professional voicemail you LEAVE for a business? (Choose 3.)", "opts": ["Background music", "A callback number", "Your name", "Your life story", "Why you're calling"], "ans": [1, 2, 4], "why": "Short and clear: who, why, and how to reach you.", "tests": ["TT-MD Q22", "O16-PE1 Q12", "IC3-PE1 Q12", "O13-PE1 Q12"]}, "md_video_uses": {"id": "md_video_uses", "type": "multi", "topic": "MD", "tt": "MD", "od": ["1.5.3"], "q": "Which THREE are good uses for a video-calling app? (Choose 3.)", "opts": ["A remote job interview", "A meeting with a team in another country", "Showing a customer how a device works", "Printing a contract", "Mailing a package"], "ans": [0, 1, 2], "why": "Video calls handle face-to-face talk at a distance.", "today": "Skype was shut down in May 2025. Teams, Zoom, Google Meet, FaceTime, and WhatsApp do the same job.", "tests": ["TT-MD Q23", "O16-PE1 Q13", "IC3-PE1 Q13", "O13-PE1 Q14"]}, "md_notify": {"id": "md_notify", "type": "multi", "topic": "MD", "tt": "MD", "od": ["1.6.1"], "q": "Which THREE are ways a phone can notify you? (Choose 3.)", "opts": ["A paper printout", "A sound", "An email to your landlord", "A vibration", "A flashing light or on-screen banner"], "ans": [1, 3, 4], "why": "Notifications use sounds, vibration, LED/flash, banners, and badges.", "tests": ["TT-MD Q24", "O16-PE1 Q14", "IC3-PE1 Q14", "O13-PE1 Q15"]}, "md_phone_pc": {"id": "md_phone_pc", "type": "dd", "topic": "MD", "tt": "MD", "od": ["5.1.1"], "q": "Complete the sentence.", "text": "To move photos from your phone to your PC without a cable, use {0}.", "blanks": [["a PS/2 port", "a VGA adapter", "a wireless transfer app or cloud sync (Google Photos, OneDrive, iCloud)", "the phone's flashlight"]], "ans": [2], "why": "Cloud sync or a nearby-transfer app moves files wirelessly. A USB cable also works.", "tests": ["TT-MD Q25", "O16-PE3 Q6", "IC3-PE3 Q6"]}, "md_dial9": {"id": "md_dial9", "type": "mc", "topic": "MD", "tt": null, "od": ["1.4.1"], "q": "Some office desk phones need an extra digit before an outside number. What is it on many phone systems?", "opts": ["*69", "0", "9", "#"], "ans": 2, "why": "Many business phone systems (PBX) use 9 to get an outside line.", "variant_of": "md_transfer", "tests": ["O13-PE1 Q11"]}, "md_sms_limit": {"id": "md_sms_limit", "type": "mc", "topic": "MD", "tt": null, "od": ["1.5.1"], "q": "What is one limitation of a standard SMS text?", "opts": ["It needs Wi-Fi", "It can't be sent to another phone", "It can only be read on a computer", "Each message is limited to about 160 characters"], "ans": 3, "why": "SMS is short, plain text. Longer messages get split up.", "tests": ["O13-PE1 Q13"]}, "md_roaming": {"id": "md_roaming", "type": "mc", "topic": "MD", "tt": null, "od": ["1.1.3"], "q": "Your phone shows 'Roaming' while you're out of state. What does that mean?", "opts": ["You're using free Wi-Fi", "Your SIM card was removed", "Your phone is broken", "Another carrier that partners with yours is giving you service"], "ans": 3, "why": "Roaming means a partner network is carrying your service, which may cost extra.", "tests": ["O13-PE2 Q2"]}, "hw_close_ram": {"id": "hw_close_ram", "type": "mc", "topic": "HW", "tt": "HW", "od": ["2.2.2"], "q": "Your laptop slows down with 20 browser tabs and three apps open. What frees up memory (RAM) fastest?", "opts": ["Plugging in a mouse", "Deleting photos from the hard drive", "Turning up the screen brightness", "Closing programs and tabs you aren't using"], "ans": 3, "why": "Open programs use RAM. Closing them releases it. Deleting files frees storage, not RAM.", "tests": ["TT-HW Q5", "O16-PE2 Q13", "IC3-PE2 Q13", "O13-PE2 Q14"]}, "hw_vga": {"id": "hw_vga", "type": "mc", "topic": "HW", "tt": "HW", "od": ["2.3.3"], "q": "What is a VGA port used for?", "opts": ["Connecting a monitor or projector (video)", "Connecting to the Internet", "Charging a phone", "Plugging in headphones"], "ans": 0, "why": "VGA is an older analog video connection (often blue, 15 pins).", "tests": ["TT-HW Q6", "O16-PE2 Q14", "IC3-PE2 Q14", "O13-PE2 Q15"]}, "hw_printer": {"id": "hw_printer", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.3.1"], "q": "Which TWO are common ways to connect a home printer? (Choose 2.)", "opts": ["Wi-Fi", "USB cable", "VGA cable", "HDMI cable"], "ans": [0, 1], "why": "Printers connect by USB, Wi-Fi, or Ethernet. VGA and HDMI are video.", "tests": ["TT-HW Q7", "O16-PE2 Q15", "IC3-PE2 Q15", "O13-PE2 Q16"]}, "hw_speakers": {"id": "hw_speakers", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.3.1"], "q": "Which TWO can connect external speakers to a computer? (Choose 2.)", "opts": ["Bluetooth", "An Ethernet cable", "An audio cable in the headphone/speaker jack", "A SIM card"], "ans": [0, 2], "why": "Speakers use wireless Bluetooth or a wired audio jack (or USB).", "tests": ["TT-HW Q8", "O16-PE2 Q16", "IC3-PE2 Q16", "O13-PE2 Q17"]}, "hw_join_secure": {"id": "hw_join_secure", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.5"], "q": "What TWO things do you need to join a password-protected Wi-Fi network? (Choose 2.)", "opts": ["An HDMI cable", "Administrator rights on the router", "The correct network password (security key)", "A wireless adapter that is turned on"], "ans": [2, 3], "why": "The Wi-Fi adapter must be enabled (Airplane mode off), and you must enter the right key.", "tests": ["TT-HW Q9", "O16-PE2 Q18", "IC3-PE2 Q17", "O13-PE2 Q19"]}, "hw_wired_vs_wifi": {"id": "hw_wired_vs_wifi", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.10.1"], "q": "Compared to Wi-Fi, what are TWO advantages of a wired Ethernet connection? (Choose 2.)", "opts": ["Needs no cables", "More secure", "Lets you walk around the house", "Usually faster"], "ans": [1, 3], "why": "Cables give steadier speed and are harder to snoop on. Wi-Fi gives mobility.", "tests": ["TT-HW Q10", "O16-PE2 Q22", "IC3-PE2 Q21", "O13-PE2 Q24"]}, "hw_ip": {"id": "hw_ip", "type": "mc", "topic": "HW", "tt": "SA", "od": ["3.11.1"], "q": "What is the job of an IP address?", "opts": ["It stores your passwords", "It identifies a device on a network so data reaches it", "It speeds up your processor", "It names your Wi-Fi network"], "ans": 1, "why": "Like a street address for a device: data is delivered to the right IP.", "tests": ["TT-SA Q1", "O16-PE2 Q25", "IC3-PE2 Q22", "O13-PE2 Q27"]}, "hw_gpu": {"id": "hw_gpu", "type": "mc", "topic": "HW", "tt": "SA", "od": ["3.13.1"], "q": "A game's graphics look scrambled and flicker, but other parts of the PC work fine. Which part is the most likely cause?", "opts": ["The keyboard", "The speakers", "The power button", "The graphics card (GPU) or its driver"], "ans": 3, "why": "Display corruption in graphics-heavy apps points to the GPU or its driver.", "tests": ["TT-SA Q2", "O16-PE2 Q28", "IC3-PE2 Q23", "O13-PE2 Q30"]}, "hw_power_plan": {"id": "hw_power_plan", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.6.3"], "q": "In a custom Windows 10 power plan, which THREE settings can you choose? (Choose 3.)", "opts": ["When to turn off the display", "Your desktop wallpaper", "When the PC goes to sleep", "Which websites you can visit", "Screen brightness"], "ans": [0, 2, 4], "why": "Power plans control display timeout, sleep timing, and brightness (on laptops).", "tests": ["TT-HW Q11", "O16-PE2 Q49", "IC3-PE2 Q39"]}, "hw_wired_reliable": {"id": "hw_wired_reliable", "type": "mc", "topic": "HW", "tt": "HW", "od": ["2.10.1"], "q": "Which connection is usually the MOST reliable and fastest for a desktop PC?", "opts": ["Bluetooth", "Wired Ethernet", "A phone's hotspot", "Public Wi-Fi"], "ans": 1, "why": "A wired connection avoids interference and signal drop-offs.", "tests": ["TT-HW Q12", "O16-PE3 Q3", "IC3-PE3 Q3"]}, "hw_net_match": {"id": "hw_net_match", "type": "match", "topic": "HW", "tt": "HW", "od": ["2.11.5"], "q": "Match each network type to its description.", "left": ["WAN", "PAN", "MAN", "LAN"], "right": ["Links sites across long distances (used for secure remote connections)", "Your own devices close to you, e.g. phone + earbuds", "A high-speed network covering a city or campus area", "A small area such as one home or office"], "why": "PAN < LAN < MAN < WAN, by size.", "tests": ["TT-HW Q13", "O16-PE3 Q8", "IC3-PE3 Q8"]}, "hw_battery": {"id": "hw_battery", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.6.2"], "q": "Which TWO steps help a laptop battery last longer? (Choose 2.)", "opts": ["Leave every app open", "Dim the screen", "Turn the brightness to 100%", "Close programs running in the background"], "ans": [1, 3], "why": "The screen and background apps are big power users.", "tests": ["TT-HW Q14", "O16-PE3 Q9", "IC3-PE3 Q9", "O13-PE1 Q23"]}, "hw_bw_equip": {"id": "hw_bw_equip", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.11.4"], "q": "Which TWO pieces of home equipment affect your Internet bandwidth? (Choose 2.)", "opts": ["The cable modem", "The wireless router", "The computer's mouse", "The printer's ink"], "ans": [0, 1], "why": "Old or overloaded modems and routers can bottleneck your connection.", "tests": ["TT-HW Q15", "O16-PE3 Q14", "IC3-PE3 Q12"]}, "hw_bt_nowifi": {"id": "hw_bt_nowifi", "type": "mc", "topic": "HW", "tt": "HW", "od": ["2.3.4"], "q": "Which is true about pairing Bluetooth earbuds with your phone?", "opts": ["It requires an Ethernet cable", "It requires Wi-Fi", "It only works on laptops", "It works without any Wi-Fi network"], "ans": 3, "why": "Bluetooth connects devices directly, short range, with no Wi-Fi needed.", "tests": ["TT-HW Q16", "O16-PE3 Q30", "IC3-PE3 Q27"]}, "hw_not_power": {"id": "hw_not_power", "type": "mc", "topic": "HW", "tt": "HW", "od": ["2.6.3"], "q": "Which of these is NOT something you set in Windows 10's power and sleep settings?", "opts": ["Put the PC to sleep after a period of inactivity", "Choose what the power button does", "Turn off the screen after a period of inactivity", "Mute the sound after a period of inactivity"], "ans": 3, "why": "Power settings handle screen, sleep, and buttons, not sound muting.", "tests": ["TT-HW Q17", "O16-PE3 Q31", "IC3-PE3 Q28"]}, "hw_ip_valid": {"id": "hw_ip_valid", "type": "tf", "topic": "HW", "tt": "SA", "od": ["3.11.1"], "q": "True or false: 256.5AA2.22.4344 is a valid IPv4 address.", "ans": false, "why": "IPv4 has four numbers from 0 to 255, e.g. 192.168.1.20. 256 is too big, and letters aren't allowed.", "tests": ["TT-SA Q3", "O16-PE3 Q33", "IC3-PE3 Q30"]}, "hw_wifi_fail": {"id": "hw_wifi_fail", "type": "mc", "topic": "HW", "tt": "MD", "od": ["2.5"], "q": "Tasha can see her home network but her laptop won't connect to it, even with the right password. What is the most likely cause?", "opts": ["The laptop's wireless adapter is turned off or disabled", "The monitor is unplugged", "The printer is out of paper", "Her Internet bandwidth is too high"], "ans": 0, "why": "If the adapter is disabled (or Airplane mode is on), the laptop can't connect.", "flag": "a version of this question where the marked answer is 'the bandwidth is too high,' even though 'wireless card turned off' is also offered. The real-world cause is a disabled or broken adapter. On the GMetrix test, the site's key expects the bandwidth answer.", "tests": ["TT-MD Q26", "O16-PE3 Q36", "IC3-PE3 Q33"]}, "hw_eth_laptop": {"id": "hw_eth_laptop", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.4"], "q": "What can you plug a laptop's Ethernet cable into? (Choose 2.)", "opts": ["A router", "A VGA monitor", "A wall jack on the office LAN", "A headphone jack"], "ans": [0, 2], "why": "Ethernet connects to network gear: routers, switches, LAN jacks.", "tests": ["TT-HW Q18", "O16-PE3 Q43", "IC3-PE3 Q40"]}, "hw_img_cpu": {"id": "hw_img_cpu", "type": "img", "topic": "HW", "tt": "HW", "od": ["2.12.1"], "q": "Click the CPU socket on this motherboard.", "img": "motherboard", "ans": "cpu", "why": "The CPU sits in a large square socket, usually near the upper middle of the board, beside the RAM slots.", "ansLabel": "CPU socket (large square, upper middle)", "tests": ["TT-HW Q19", "O16-PE3 Q45", "IC3-PE3 Q41"]}, "hw_del_space": {"id": "hw_del_space", "type": "mc", "topic": "HW", "tt": "HW", "od": ["2.2.6"], "q": "Your PC says 'Low disk space.' What frees up storage?", "opts": ["Turning on Bluetooth", "Closing browser tabs", "Restarting the router", "Deleting files you no longer need"], "ans": 3, "why": "Deleting files (and emptying the Recycle Bin) frees drive space.", "tests": ["TT-HW Q20", "O16-PE1 Q15", "IC3-PE1 Q15", "O13-PE1 Q16"]}, "hw_video_space": {"id": "hw_video_space", "type": "mc", "topic": "HW", "tt": "HW", "od": ["2.2.6"], "q": "Which type of file usually takes up the MOST storage?", "opts": ["Text documents", "Videos", "Contacts", "Emails without attachments"], "ans": 1, "why": "Video files are much larger than text or photos.", "tests": ["TT-HW Q21", "O16-PE1 Q16", "IC3-PE1 Q16", "O13-PE1 Q17"]}, "hw_hdmi": {"id": "hw_hdmi", "type": "mc", "topic": "HW", "tt": "HW", "od": ["2.3.3"], "q": "You want to show a movie from your laptop on your TV, with sound. Which cable is best?", "opts": ["USB-to-PS/2", "HDMI", "VGA", "Ethernet"], "ans": 1, "why": "HDMI carries digital video AND audio.", "tests": ["TT-HW Q22", "O16-PE1 Q17", "IC3-PE1 Q17", "O13-PE1 Q19"]}, "hw_keyboard": {"id": "hw_keyboard", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.3.1"], "q": "Which THREE are ways to connect a keyboard to a desktop? (Choose 3.)", "opts": ["USB", "Bluetooth", "A keyboard (PS/2) port", "HDMI", "A SIM slot"], "ans": [0, 1, 2], "why": "Keyboards use USB, Bluetooth/wireless, or the older PS/2 port.", "tests": ["TT-HW Q23", "O16-PE1 Q18", "IC3-PE1 Q18", "O13-PE1 Q20"]}, "hw_eth_switch": {"id": "hw_eth_switch", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.4"], "q": "An Ethernet cable from a desktop can connect to which TWO? (Choose 2.)", "opts": ["A phone's charging port", "A projector's VGA port", "A network switch", "Another computer"], "ans": [2, 3], "why": "Ethernet links network devices: switches, routers, or another PC.", "tests": ["TT-HW Q24", "O16-PE1 Q19", "IC3-PE1 Q19", "O13-PE1 Q21"]}, "hw_wifi_vs_cell": {"id": "hw_wifi_vs_cell", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.10.1"], "q": "Compared with cellular data, what are TWO advantages of Wi-Fi? (Choose 2.)", "opts": ["It's usually faster", "It's usually cheaper (no data charges)", "It works everywhere in the country", "It never needs a password"], "ans": [0, 1], "why": "Home/office Wi-Fi is typically cheaper and faster. Cellular reaches more places.", "tests": ["TT-HW Q25", "O16-PE1 Q23", "IC3-PE1 Q22", "O13-PE1 Q26"]}, "hw_isp": {"id": "hw_isp", "type": "mc", "topic": "HW", "tt": "HW", "od": ["2.10.2"], "q": "You have a new Wi-Fi router at home. What else do you need to actually reach the Internet?", "opts": ["A SIM card in the router", "A service plan from an Internet Service Provider (ISP)", "A printer", "A second router"], "ans": 1, "why": "The router makes the home network. The ISP (e.g., Spectrum, Verizon Fios) provides the Internet.", "tests": ["TT-HW Q26", "O16-PE1 Q24", "IC3-PE1 Q23", "O13-PE1 Q27"]}, "hw_speed": {"id": "hw_speed", "type": "multi", "topic": "HW", "tt": "HW", "od": ["2.11.4"], "q": "Which THREE things affect how fast the Internet feels on your computer? (Choose 3.)", "opts": ["The font you use", "Your computer's own hardware", "How many devices share your router", "Your ISP plan's speed", "The color of your mouse"], "ans": [1, 2, 3], "why": "Plan bandwidth, shared connections, and device hardware all matter.", "tests": ["TT-HW Q27", "O16-PE1 Q46", "IC3-PE1 Q36"]}, "hw_img_net": {"id": "hw_img_net", "type": "img", "topic": "HW", "tt": "HW", "od": ["2.5"], "q": "Click the taskbar icon you would use to see available Wi-Fi networks.", "img": "taskbar", "ans": "net", "why": "The network icon near the clock opens the list of available networks.", "ansLabel": "network (Wi-Fi) icon near the clock", "tests": ["TT-HW Q28", "IC3-PE1 Q48"]}, "hw_ram_sysinfo": {"id": "hw_ram_sysinfo", "type": "mc", "topic": "HW", "tt": "HW", "od": ["2.12.1"], "q": "Where can you quickly see how much RAM is installed in Windows?", "opts": ["Windows Media Player", "System Information (or Settings › System › About)", "Paint", "The Recycle Bin"], "ans": 1, "why": "System Information (msinfo32) and the System/About page show installed RAM and the processor.", "tests": ["TT-HW Q29", "IC3-PE2 Q46"]}, "hw_surface": {"id": "hw_surfa <script>
(function(){"use strict";
const D=JSON.parse(document.getElementById('data').textContent);const B=D.bank,T=D.tests,TOP=D.topics,IMG=D.imgs;
const KEY='ic3lab_v1';let S=load();
function blank(){return{history:[],missed:{},best:{},stats:{}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return Object.assign(blank(),s)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=(s,r)=>(r||document).querySelector(s),$$=(s,r)=>[...(r||document).querySelectorAll(s)];
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rnd(seed){let x=0;for(const ch of seed)x=(x*31+ch.charCodeAt(0))>>>0;return()=>{x=(x*1103515245+12345)>>>0;return x/4294967296}}
function shuffle(a,seed){const r=seed?rnd(seed):Math.random;a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let RUN=null,TIMER=null;
function nav(v){$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
function go(v,a){if(RUN&&!RUN.done&&v!=='run'&&!confirm('Leave this test? Your answers for this attempt will be lost.'))return;if(v!=='run'&&v!=='results'){stopTimer();RUN=null}window.scrollTo(0,0);nav(v);
 ({home,library,custom,missed,history,key:answerKey,run:renderRun,results})[v](a)}
$$('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));$('#logo').onclick=()=>go('home');
// ---------- stats
function readiness(){const pe=T.filter(t=>t.kind==='exam'),tt=T.filter(t=>t.kind==='topic');
 const pick=l=>l.map(t=>S.best[t.id+':test']||0);const p=pick(pe),q=pick(tt);const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
 return {pe:Math.round(avg(p)),tt:Math.round(avg(q)),all:Math.round(.6*avg(p)+.4*avg(q)),pePassed:p.filter(x=>x>=80).length,ttPassed:q.filter(x=>x>=80).length}}
function topicMastery(){const m={};Object.keys(TOP).forEach(k=>m[k]={c:0,n:0});Object.entries(S.stats).forEach(([id,s])=>{const b=B[id];if(b&&m[b.topic]){m[b.topic].n+=s.n;m[b.topic].c+=s.c}});return m}
function home(){const r=readiness(),m=topicMastery();const miss=Object.keys(S.missed).length;
 $('#app').innerHTML=`<div class="card"><h1>Welcome to the Practice Lab</h1><p class="muted">Practice for all ${T.filter(t=>t.kind==='topic').length} GMetrix topic tests and ${T.filter(t=>t.kind==='exam').length} practice exams, rewritten in original words. Every item tests the same skill and concept as its GMetrix counterpart. Use <b>Training Mode</b> to learn, then <b>Testing Mode</b> (50-minute timer) to prove it. Target: <b>80%+</b>.</p>
 <h2>Readiness meter</h2><div class="meter" title="80% target line"><i style="width:${r.all}%"></i><b></b></div>
 <div class="row small" style="margin-top:.3rem"><span><b>${r.all}%</b> overall (best Testing-mode scores)</span><span class="sp"></span><span>Practice exams ≥80%: <b>${r.pePassed}/8</b></span><span>Topic tests ≥80%: <b>${r.ttPassed}/7</b></span></div>
 <p class="small muted">${r.all>=80&&r.pePassed>=3?'✅ Looking exam-ready. Keep scores at 80%+ on two attempts in a row.':'Goal: 80%+ in Testing Mode on every topic test, then on the practice exams.'}</p></div>
 <div class="card"><h2>Mastery by topic</h2>${Object.entries(TOP).map(([k,n])=>{const x=m[k],p=x.n?Math.round(100*x.c/x.n):0;return `<div class="row small" style="margin:.35rem 0"><span style="width:210px">${esc(n)}</span><div class="bar sp"><i style="width:${p}%"></i></div><span style="width:72px;text-align:right">${x.n?p+'%':'–'} <span class="muted">(${x.n})</span></span></div>`}).join('')}</div>
 <div class="grid"><div class="test"><span class="tag">Start here</span><b>Test library</b><span class="small muted">7 topic tests and 8 practice exams, laid out like GMetrix.</span><button class="pri" data-g="library">Open tests</button></div>
 <div class="test"><span class="tag">Build your own</span><b>Custom quiz</b><span class="small muted">Pick topics, question types, and how many questions.</span><button data-g="custom">Build a quiz</button></div>
 <div class="test"><span class="tag">Fix weak spots</span><b>Missed deck (${miss})</b><span class="small muted">Every item you've missed, until you get it right.</span><button data-g="missed">Retry missed</button></div></div>`;
 $$('[data-g]').forEach(b=>b.onclick=()=>go(b.dataset.g))}
function library(){const progs=[...new Set(T.map(t=>t.program))];
 $('#app').innerHTML=progs.map(p=>`<div class="card"><h2>${esc(p)}</h2>${['topic','exam'].map(k=>{const L=T.filter(t=>t.program===p&&t.kind===k);if(!L.length)return'';
  return `<h3>${k==='topic'?'Topic tests':'Practice exams'}</h3><div class="grid">${L.map(t=>{const bt=S.best[t.id+':test'],bn=S.best[t.id+':train'];return `<div class="test"><span class="tag">${k==='topic'?'Topic test':'Practice exam'} · ${t.items.length} items${t.win==='w7'?' · Windows 7':''}</span><b>${esc(t.name)}</b>

 <div class="row noprint" style="margin-top:.8rem">${miss.length?'<button class="pri" id="rm">Retry missed (Training)</button>':''}<button id="lib">Back to tests</button><button id="pr">Print report</button></div></div>
 ${miss.length?`<div class="card"><h2>Review missed questions (${miss.length})</h2>${miss.map(o=>{const b=B[o.x.id];return `<div class="key"><b>Q${o.k+1}.</b> ${esc(b.q)}<br><span class="small"><b>Correct:</b> ${esc(answerText(b,R.win))}</span><br><span class="small muted">${esc(b.why)}</span>${b.flag?`<div class="flag small">⚠️ <b>On GMetrix, expect…</b> ${esc(b.flag)}</div>`:''}</div>`}).join('')}</div>`:''}`;
 if($('#rm'))$('#rm').onclick=()=>{const it=miss.map(o=>({id:o.x.id,src:'missed'}));const w=R.win;RUN=null;start({id:'missed',name:'Retry missed: '+h.name,win:w,items:it,mode:'train',minutes:0})};
 $('#lib').onclick=()=>{RUN=null;go('library')};$('#pr').onclick=()=>window.print()}
// ---------- answer key
function answerKey(){const where={};T.forEach(t=>t.items.forEach((id,i)=>{(where[id]=where[id]||[]).push(t.short+' Q'+(i+1))}));
 const order=Object.values(B).sort((a,b)=>a.topic.localeCompare(b.topic)||a.id.localeCompare(b.id));
 $('#app').innerHTML=`<div class="card"><div class="row noprint"><h1 class="sp">Instructor answer key</h1><button class="pri" id="pr">🖨️ Print / Save as PDF</button></div>
 <p class="small muted">${order.length} unique items · ${T.reduce((a,t)=>a+t.items.length,0)} test positions. Codes: ${T.map(t=>t.short+' = '+t.name+(t.kind==='topic'?' (topic test)':'')).join('; ')}. Original wording; not GMetrix text. A ready-made PDF (Answer_Key.pdf) ships alongside this file.</p>
 ${order.map((b,n)=>`<div class="key"><b>${n+1}. [${esc(b.id)}]</b> <span class="pill">${esc(TOP[b.topic])}</span><span class="pill">${esc(TYPEN[b.type])}</span><span class="pill">Obj ${esc(b.od.join(', '))}</span><br>${esc(b.q)}
 <br><b>Answer:</b> ${esc(answerText(b,'w10'))}${b.type==='sim'&&b.variants.w7?'<br><b>Windows 7 answer:</b> '+esc(answerText(b,'w7')):''}<br><span class="small muted">${esc(b.why)}</span>
 ${b.flag?`<div class="flag small">⚠️ <b>On GMetrix, expect…</b> ${esc(b.flag)}</div>`:''}<div class="small"><b>Appears in:</b> ${esc((where[b.id]||[]).join(', '))}</div></div>`).join('')}</div>`;$('#pr').onclick=()=>window.print()}
window.__lab={state:()=>S,run:()=>RUN,data:D,grade,go,start,finish};
go('home');
})();
