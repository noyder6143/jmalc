 e.onclick=()=>sim(L,P,k);e.onkeydown=ev=>{if(ev.key==='Enter')e.click()};g.appendChild(e)});P.appendChild(g)}
function stepText(st){return st.type==='input'?`In <b>${esc(st.label)}</b>, type <b>${esc(st.a)}</b>.`:`${esc(st.screen)}: choose <b>${esc(st.opts[st.a])}</b>.`}
function sim(L,P,k,j){j=j||0;const s=L.sims[k];
 if(j>=s.steps.length){const first=once('sims',L.id+':'+k,25,'sim');if(Object.keys(S.sims).length>=15)badge('sim');
  P.innerHTML=`<div class="card"><h3>🎉 Sim complete: ${esc(s.title)}</h3>${first?'':'<p class="muted">(Replay. XP was already earned.)</p>'}<ol class="steps">${s.steps.map(x=>'<li>'+stepText(x)+'</li>').join('')}</ol>
  ${s.today?`<div class="today">📌 <b>Today's version:</b> ${esc(s.today)}</div>`:''}<div class="row" style="margin-top:.8rem"><button id="again">↻ Again</button><button class="primary" id="list">More sims</button></div></div>`;
  $('#again').onclick=()=>sim(L,P,k,0);$('#list').onclick=()=>simList(L,P);return}
 const st=s.steps[j];
 P.innerHTML=`<div class="card"><div class="row"><b class="sp">🖱️ ${esc(s.title)}</b><span class="muted">Step ${j+1}/${s.steps.length}</span></div><p><b>Task:</b> ${esc(s.prompt)}</p>
 <div class="win" id="win"><div class="bar"><b>${esc(st.screen)}</b><span>- ☐ ✕</span></div><div class="body"><p style="margin-top:0"><b>${esc(st.q)}</b></p><div id="opts"></div><div id="hint"></div></div></div>
 <div class="row" style="margin-top:.8rem"><button class="ghost" id="wt">📝 Show walkthrough</button><span class="sp"></span><button class="ghost" id="quit">Exit sim</button></div><div id="wtx"></div></div>`;
 const O=$('#opts'),W=$('#win');function wrong(){W.classList.remove('shake');void W.offsetWidth;W.classList.add('shake');$('#hint').innerHTML=`<div class="hint">💡 Hint: ${esc(st.hint)}</div>`}
 if(st.type==='input'){O.innerHTML=`<label>${esc(st.label)}<br><input id="inp" autocomplete="off"></label> <button class="primary" id="ok" style="margin-top:.5rem">Enter</button>`;
  const f=()=>{const v=$('#inp').value.trim();if(v.toLowerCase()===String(st.a).toLowerCase())sim(L,P,k,j+1);else wrong()};$('#ok').onclick=f;$('#inp').onkeydown=e=>{if(e.key==='Enter')f()};$('#inp').focus()}
 else st.opts.forEach((o,x)=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>{if(x===st.a)sim(L,P,k,j+1);else{b.classList.add('wrong');wrong()}};O.appendChild(b)});
 $('#wt').onclick=()=>{$('#wtx').innerHTML='<ol class="steps">'+s.steps.map(x=>'<li>'+stepText(x)+'</li>').join('')+'</ol>'};$('#quit').onclick=()=>simList(L,P)}
function gameList(L,P){P.innerHTML='';L.games.forEach((g,k)=>{const done=S.games[L.id+':'+k];const e=h(`<div class="card row"><div class="sp"><b>${g.type==='match'?'🔗':g.type==='scam'?'🕵️':'🗂️'} ${esc(g.title)}</b> ${done?'✅':''}<div class="muted">${g.type==='match'?'Match each term to its meaning: tap one then the other, or drag.':g.type==='scam'?'Read each message. Scam or legit?':'Sort each item into the right bin.'}</div></div><button class="primary">Play</button></div>`).firstChild;
 e.querySelector('button').onclick=()=>g.type==='match'?match(L,P,k):sortg(L,P,k);P.appendChild(e)})}
function match(L,P,k){const g=L.games[k];const pairs=g.pairs.map((p,i)=>({t:p[0],d:p[1],i}));let left=shuffle(pairs),right=shuffle(pairs),sel=null,got=0,miss=0;
 P.innerHTML=`<div class="card"><div class="row"><b class="sp">🔗 ${esc(g.title)}</b><span id="ms" class="muted"></span></div><div class="match"><div id="L"></div><div id="R"></div></div><div class="row" style="margin-top:.6rem"><button class="ghost" id="bk">← Games</button></div></div>`;
 const Lc=$('#L'),Rc=$('#R');$('#bk').onclick=()=>gameList(L,P);
 function upd(){$('#ms').textContent=got+'/'+pairs.length+' matched · '+miss+' misses'}upd();
 function tryPair(li,ri){const lb=Lc.querySelector(`[data-i="${li}"]`),rb=Rc.querySelector(`[data-i="${ri}"]`);
  if(li===ri){[lb,rb].forEach(b=>{b.classList.remove('sel');b.classList.add('done');b.disabled=true;b.draggable=false});got++;upd();
   if(got===pairs.length){const f=once('games',L.id+':'+k,30,'match');setTimeout(()=>{P.insertAdjacentHTML('afterbegin',`<div class="fb ok">🎉 All matched with ${miss} miss${miss===1?'':'es'}!</div>`)},50)}}
  else{miss++;upd();[lb,rb].forEach(b=>{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad','sel'),500)})}sel=null}
 left.forEach(p=>{const b=document.createElement('button');b.textContent=p.t;b.dataset.i=p.i;b.draggable=true;
  b.onclick=()=>{if(b.disabled)return;Lc.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));sel=p.i;b.classList.add('sel')};
  b.ondragstart=e=>{e.dataTransfer.setData('text/plain',String(p.i));sel=p.i};Lc.appendChild(b)});
 right.forEach(p=>{const b=document.createElement('button');b.textContent=p.d;b.dataset.i=p.i;
  b.onclick=()=>{if(b.disabled)return;if(sel===null){toast('Pick a term on the left first');return}b.classList.add('sel');tryPair(sel,p.i)};
  b.ondragover=e=>{if(!b.disabled){e.preventDefault();b.classList.add('over')}};b.ondragleave=()=>b.classList.remove('over');
  b.ondrop=e=>{e.preventDefault();b.classList.remove('over');const li=+e.dataTransfer.getData('text/plain');tryPair(li,p.i)};Rc.appendChild(b)})}
function sortg(L,P,k){const g=L.games[k];const items=shuffle(g.items);let i=0,ok=0;
 function draw(){if(i>=items.length){const pass=g.type==='scam'?ok>=Math.min(7,items.length):ok>=Math.ceil(items.length*.6);if(pass)once('games',L.id+':'+k,20,g.type==='scam'?'scam buster':'sort');if(g.type==='scam'&&ok>=Math.min(7,items.length))badge('scam');
  P.innerHTML=`<div class="card"><h3>${ok}/${items.length} correct ${ok===items.length?'🔥':''}</h3><p>${pass?'Nice work!':'Try again. Read each explanation.'}</p><div class="row"><button id="ag">↻ Play again</button><button class="primary" id="bk">Games</button></div></div>`;
  $('#ag').onclick=()=>sortg(L,P,k);$('#bk').onclick=()=>gameList(L,P);return}
 const it=items[i];P.innerHTML=`<div class="card"><div class="row"><b class="sp">${g.type==='scam'?'🕵️':'🗂️'} ${esc(g.title)}</b><span class="muted">${i+1}/${items.length} · ${ok} right</span></div>
 <div class="${g.type==='scam'?'scamtxt':''}" style="margin:.8rem 0;font-size:1.05rem">${esc(it[0])}</div><div class="bins">${g.bins.map((b,x)=>`<button data-x="${x}">${esc(b)}</button>`).join('')}</div><div id="fb" aria-live="polite"></div></div>`;
 P.querySelectorAll('.bins button').forEach(b=>b.onclick=()=>{const x=+b.dataset.x,r=x===it[1];if(r)ok++;P.querySelectorAll('.bins button').forEach(z=>z.disabled=true);
  $('#fb').innerHTML=`<div class="fb ${r?'ok':'no'}">${r?'✅ Correct!':'❌ Not quite. Answer: '+esc(g.bins[it[1]])}<br>${esc(it[2])}</div><button class="primary" id="nx" style="margin-top:.6rem">Next →</button>`;$('#nx').onclick=()=>{i++;draw()};$('#nx').focus()})}draw()}
function runQuiz(P,pool,n,title,onDone){const qs=shuffle(pool).slice(0,Math.min(n,pool.length)).map(q=>{const order=shuffle(q.c.map((c,i)=>i));return Object.assign({},q,{order})});let i=0,ok=0,missed=[];
 function draw(){if(i>=qs.length){const pct=Math.round(100*ok/qs.length);onDone(pct);
  P.innerHTML=`<div class="card"><h2>${pct>=80?'🏆':'💪'} ${title}: ${ok}/${qs.length} (${pct}%)</h2><p>${pct>=80?'80%+! You hit the GMetrix target. Now prove it in Testing Mode.':'Goal is 80%+. Review the misses below, then go again.'}</p>
  ${missed.length?'<h3>Review</h3>'+missed.map(q=>`<div class="fb no"><b>${esc(q.q)}</b><br>✔ ${esc(q.c[q.a])}<br><span>${esc(q.why)}</span></div>`).join(''):''}
  <div class="row" style="margin-top:.8rem"><button class="primary" id="ag">↻ New quiz</button></div></div>`;$('#ag').onclick=()=>runQuiz(P,pool,n,title,onDone);return}
 const q=qs[i];P.innerHTML=`<div class="card"><div class="row"><b class="sp">❓ ${esc(title)}</b><span class="muted">Q ${i+1}/${qs.length} · ${ok} right</span></div><h3>${esc(q.q)}</h3><div id="op"></div><div id="fb" aria-live="polite"></div></div>`;
 const O=$('#op');q.order.forEach(ci=>{const b=document.createElement('button');b.className='opt';b.textContent=q.c[ci];b.onclick=()=>{const r=ci===q.a;
  O.querySelectorAll('button').forEach(z=>{z.disabled=true;if(+z.dataset.ci===q.a)z.classList.add('right')});if(!r){b.classList.add('wrong');missed.push(q)}else{ok++;const key=q._k;if(key&&!S.qok[key]){S.qok[key]=1;addXP(10,'correct')}}
  $('#fb').innerHTML=`<div class="fb ${r?'ok':'no'}">${r?'✅ Correct!':'❌ Answer: '+esc(q.c[q.a])}<br>${esc(q.why)}</div><button class="primary" id="nx" style="margin-top:.6rem">${i<qs.length-1?'Next →':'See score'}</button>`;$('#nx').onclick=()=>{i++;draw()};$('#nx').focus()};b.dataset.ci=ci;O.appendChild(b)})}draw()}
function quiz(L,P){L.quiz.forEach((q,i)=>q._k=L.id+':'+i);P.innerHTML=`<div class="card"><h3>❓ ${esc(L.name)} Quiz</h3><p>10 random questions from a pool of ${L.quiz.length}. Instant feedback. Best score: <b>${S.quiz[L.id]==null?'–':S.quiz[L.id]+'%'}</b>. Get 80%+ for the 🏅.</p><button class="primary" id="go">Start</button></div>`;
 $('#go').onclick=()=>runQuiz(P,L.quiz,10,L.name+' Quiz',pct=>{S.quiz[L.id]=Math.max(S.quiz[L.id]||0,pct);save();if(pct>=80)badge('lvl_'+L.id)})}
function mission(L,P){const m=S.mission[L.id]=S.mission[L.id]||[];P.innerHTML=`<div class="card"><h3>🎯 Your GMetrix Mission: ${esc(L.gm)}</h3><p class="muted">Sign in to GMetrix yourself and check each step off when you finish it. Order matters: Training Mode first, then Testing Mode, 80%+ before moving on.</p>
 ${L.mission.map((t,i)=>`<label class="chk"><input type="checkbox" data-i="${i}" ${m[i]?'checked':''}><span>${esc(t)}</span></label>`).join('')}
 <p class="muted" style="font-size:.85rem">Training Mode = hints and feedback, no timer. Testing Mode = timed, no help, like the real exam.</p></div>`;
 P.querySelectorAll('input').forEach(c=>c.onchange=()=>{const i=+c.dataset.i;m[i]=c.checked;save();if(c.checked){once('mission',L.id+':'+i,15,'mission');badge('mission')}})}
function bossView(){const app=$('#app');const pool=[];D.levels.forEach(L=>L.quiz.forEach((q,i)=>{q._k=L.id+':'+i;pool.push(q)}));const m=S.mission.boss=S.mission.boss||[];
 app.innerHTML=`<div class="row"><button class="ghost" id="back">← Map</button><h2 class="sp" style="margin:0">${D.boss.icon} ${esc(D.boss.name)}</h2></div>
 <div class="card"><h3>🎯 Boss Mission (GMetrix Practice Exams)</h3>${D.boss.mission.map((t,i)=>`<label class="chk"><input type="checkbox" data-i="${i}" ${m[i]?'checked':''}><span>${esc(t)}</span></label>`).join('')}
 <p class="muted" style="font-size:.85rem">📌 Today's version: Certiport retired the GS5 simulated exam on Dec 31, 2025. GS5 is now offered as a selected-response (multiple-choice-style) exam, and GS6 is the newest version. GMetrix practice still includes click-through sims. They're great practice either way.</p></div>
 <div id="bp" class="card"><h3>🐉 Quest Boss Battle</h3><p>20 random questions from all 7 levels (${pool.length} in the pool). Beat 80% to slay the dragon.</p><button class="primary" id="fight">Fight!</button></div>`;
 $('#back').onclick=()=>go('map');app.querySelectorAll('input').forEach(c=>c.onchange=()=>{m[+c.dataset.i]=c.checked;save();if(c.checked){once('mission','boss:'+c.dataset.i,15,'mission');badge('mission')}});
 $('#fight').onclick=()=>runQuiz($('#bp'),pool,20,'Boss Battle',pct=>{S.boss=Math.max(S.boss||0,pct);save();if(pct>=80)badge('boss')})}
function badgeView(){const app=$('#app');const [r,nx]=rank();app.innerHTML=`<div class="row"><button class="ghost" id="back">← Map</button><h2 class="sp" style="margin:0">🏅 Badges & Rank</h2></div>
 <div class="card"><p>Rank: <b>${r[1]}</b> · ${S.xp} XP${nx?' · next: '+nx[1]+' at '+nx[0]+' XP':''} · 🔥 streak ${streak()} day(s)</p>
 <p class="muted">XP: lesson +5 · correct answer +10 (first time) · sim +25 · match +30 · sort/scam +20 · mission step +15</p>
 ${BADGES.map(b=>`<span class="badge ${S.badges.includes(b.id)?'':'off'}"><b>${b.icon}</b>${esc(b.name)}<small class="muted">${esc(b.how)}</small></span>`).join('')}</div>`;$('#back').onclick=()=>go('map')}
$('#home').onclick=()=>go('map');$('#home').onkeydown=e=>{if(e.key==='Enter')go('map')};
hdr();go('map');
window.__quest={state:()=>S};
})();
</script></body></html>
