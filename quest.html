<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jmal C's IC3 Quest</title>
<link rel="manifest" href="quest.webmanifest"><meta name="theme-color" content="#0f1530"><link rel="icon" href="icons/quest-192.png"><link rel="apple-touch-icon" href="icons/quest-180.png"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0f1530;--panel:#1a2250;--panel2:#232d66;--ink:#f3f5ff;--muted:#aab3e0;--acc:#ffcc33;--good:#2ecc71;--bad:#ff5c6c;--blue:#4da3ff;--r:16px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#2a3a8a,transparent),var(--bg);color:var(--ink);min-height:100vh;line-height:1.45}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:.6em 1em;background:var(--panel2);color:var(--ink)}
button:hover{filter:brightness(1.15)}button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.primary{background:var(--acc);color:#1a1a1a;font-weight:700}button.ghost{background:transparent;border:1px solid #4a56a0}
header{position:sticky;top:0;z-index:5;background:rgba(15,21,48,.92);backdrop-filter:blur(6px);border-bottom:1px solid #2c3878;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center}
header h1{font-size:1.05rem;margin:0;cursor:pointer}header h1 span{color:var(--acc)}
.htitle{display:flex;flex-direction:column;gap:.1rem}
.classline{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);opacity:.95}
.hstat{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-left:auto;font-size:.9rem}
.pill{background:var(--panel);border-radius:999px;padding:.25em .7em;white-space:nowrap}
.xpbar{width:120px;height:10px;background:#0b1026;border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),#ff8a3d)}
main{max-width:1100px;margin:0 auto;padding:1rem}
.card{background:var(--panel);border-radius:var(--r);padding:1rem 1.2rem;box-shadow:0 6px 20px rgba(0,0,0,.25);margin-bottom:1rem}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.lvl{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));border-radius:var(--r);padding:1rem;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.lvl:hover{transform:translateY(-3px);border-color:var(--acc)}.lvl .ic{font-size:2.2rem}.lvl h3{margin:.3rem 0 .2rem;font-size:1.05rem}.lvl small{color:var(--muted)}
.lvl .next{position:absolute;top:.6rem;right:.6rem;background:var(--acc);color:#111;font-size:.72rem;font-weight:700;padding:.15em .5em;border-radius:8px}
.prog{height:8px;background:#0b1026;border-radius:8px;overflow:hidden;margin-top:.6rem}.prog i{display:block;height:100%;background:var(--good)}
.boss{background:linear-gradient(135deg,#5a1a3a,#2a1250);border:2px dashed #ff7aa8}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0 1rem}.tabs button{padding:.5em .8em}.tabs button.on{background:var(--acc);color:#111;font-weight:700}
.lesson{min-height:220px}.lesson h3{margin-top:0}.ex{background:#13406a;border-left:5px solid var(--blue);padding:.6rem .8rem;border-radius:8px;margin-top:.8rem}
.today{background:#3d3410;border-left:5px solid var(--acc);padding:.6rem .8rem;border-radius:8px;margin-top:.6rem}
.od{color:var(--muted);font-size:.78rem;margin-top:.6rem}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}.sp{flex:1}
.flip{perspective:1000px;height:260px;cursor:pointer;max-width:560px;margin:0 auto}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:1.2rem;overflow:auto}
.front{background:linear-gradient(135deg,#3a49b8,#2a347e);font-size:1.7rem;font-weight:800}.back{background:#f8f8ff;color:#1a1f40;transform:rotateY(180deg);font-size:1rem}.back em{display:block;margin-top:.6rem;color:#3a49b8}
.opt{display:block;width:100%;text-align:left;margin:.4rem 0;background:var(--panel2);border:2px solid transparent}
.opt.right{background:#1e5b3a;border-color:var(--good)}.opt.wrong{background:#5b1e2a;border-color:var(--bad)}
.fb{margin-top:.6rem;padding:.6rem .8rem;border-radius:10px}.fb.ok{background:#1e5b3a}.fb.no{background:#5b1e2a}
.win{background:#e9edf5;color:#1b1f2a;border-radius:10px;overflow:hidden;border:1px solid #9aa}
.win .bar{background:#1f6fd1;color:#fff;padding:.4rem .7rem;font-size:.85rem;display:flex;gap:.5rem}.win .bar b{flex:1}
.win .body{padding:1rem}.win .opt{background:#fff;color:#1b1f2a;border:1px solid #c5cbd8}.win .opt:hover{background:#dbe8ff}
.win input{font:inherit;padding:.5em;border:1px solid #889;border-radius:8px;width:100%;max-width:340px}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hint{background:#fff4c2;color:#5a4500;padding:.5rem .7rem;border-radius:8px;margin-top:.6rem}
.match{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}.match button{width:100%;text-align:left;margin:.25rem 0;min-height:2.6em}
.match .sel{outline:3px solid var(--acc)}.match .done{background:#1e5b3a;opacity:.75;cursor:default}.match .bad{background:#5b1e2a}.match .over{outline:3px dashed var(--acc)}
.bins{display:flex;gap:.6rem;flex-wrap:wrap}.bins button{flex:1;min-width:140px;font-weight:700;padding:1em}
.scamtxt{background:#0b1026;border-radius:12px;padding:1rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92rem}
.badge{display:inline-flex;flex-direction:column;align-items:center;width:110px;text-align:center;margin:.4rem;padding:.6rem;border-radius:12px;background:var(--panel2);font-size:.8rem}.badge b{font-size:2rem}.badge.off{opacity:.3;filter:grayscale(1)}
.chk{display:flex;gap:.6rem;align-items:flex-start;padding:.5rem;border-radius:10px;background:var(--panel2);margin:.4rem 0}.chk input{width:22px;height:22px;flex:none;margin-top:.15rem}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--acc);color:#111;font-weight:700;padding:.6rem 1rem;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.muted{color:var(--muted)}a{color:var(--blue)}
.steps li{margin:.25rem 0}
@media (max-width:600px){header{padding:.5rem .7rem}.hstat{margin-left:0;font-size:.8rem}.xpbar{width:70px}.front{font-size:1.3rem}.flip{height:300px}.match button{font-size:.82rem;padding:.5em .6em}main{padding:.7rem}.card>.row>.sp{flex-basis:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

<script type="application/json" id="data">{"levels": [{"id": "mobile", "n": 1, "name": "Mobile Devices", "icon": "📱", "gm": "Mobile Devices", "od": "1", "tagline": "Your phone is a computer in your pocket. Let's learn how it really works.", "lessons": [{"t": "How your phone gets online", "b": "Phones have several ways to connect:<ul><li><b>Cellular<\/b> (4G LTE / 5G): carrier towers, works almost anywhere<\/li><li><b>Wi-Fi<\/b>: a nearby router (home, library, school)<\/li><li><b>Bluetooth<\/b>: short-range, for earbuds, speakers, car<\/li><li><b>NFC<\/b>: tap-to-pay (OMNY, Apple Pay, Google Pay)<\/li><li><b>Hotspot<\/b>: share your phone's data with a laptop<\/li><\/ul>", "od": ["1.1.1"], "ex": "Riding the 4 train: cellular. At the Bronx Library Center: free Wi-Fi. Tapping OMNY: NFC.", "today": null}, {"t": "What a cellular connection needs", "b": "To use a cell network you need a <b>SIM or eSIM<\/b>, an account and plan with a <b>carrier<\/b>, <b>coverage<\/b> where you are, and a phone that works on that carrier's network (an <b>unlocked<\/b> phone works on more carriers). The big three networks are Verizon, AT&T, and T-Mobile. Brands like Metro, Cricket, Boost, Mint, and Visible run on their networks.", "od": ["1.1.2"], "ex": "Prepaid = pay first, no credit check. Postpaid = monthly bill, may need a credit check. 'Unlimited' data can slow down (throttle) after a limit.", "today": "Lifeline is a federal discount on phone or Internet service for eligible low-income households."}, {"t": "Cell phones: powers and limits", "b": "<b>Can:<\/b> call, text, take photos, use GPS, run apps, browse, pay.<br><b>Limits:<\/b> battery life, small screen and keyboard, data caps cost money, no signal in dead zones (some subway tunnels, basements), and some desktop software doesn't exist on phones.", "od": ["1.1.3", "1.3.1"], "ex": "Writing a 2-page cover letter on a phone? Possible, but a laptop is way easier.", "today": null}, {"t": "Cellular-enabled tablets", "b": "A tablet with a SIM/eSIM can get online anywhere with coverage, but it usually <b>can't make regular phone calls<\/b> (you'd use a VoIP app like WhatsApp instead).<br><b>Wi-Fi-only tablet:<\/b> cheaper, no monthly bill, only works near Wi-Fi.<br><b>Cellular tablet:<\/b> works almost anywhere, but costs more and needs a data plan. Tablets get apps from the same stores as phones.", "od": ["1.2.1", "1.2.2", "1.2.3"], "ex": null, "today": null}, {"t": "Apps on smartphones", "b": "iPhone (<b>iOS<\/b>) apps come from the <b>App Store<\/b>; <b>Android<\/b> apps come from <b>Google Play<\/b>. Install: open the store, search, tap Get/Install, and sign in with your Apple ID or Google account. Stick to official stores, check app <b>permissions<\/b> (camera, location, contacts), and keep apps updated.", "od": ["1.3.2", "1.2.2"], "ex": "A flashlight app asking for your contacts? Red flag. Deny it.", "today": null}, {"t": "Hardwired phones", "b": "A landline or desk phone uses a physical line (copper, or a VoIP desk phone plugged into the network).<br><b>Pros:<\/b> steady call quality, and 911 knows the fixed address. Common at front desks and offices.<br><b>Cons:<\/b> not portable; you can only use it where it's plugged in.", "od": ["1.4.1"], "ex": null, "today": null}, {"t": "Voicemail like a pro", "b": "<b>Your greeting:<\/b> your name, 'please leave a message,' and when you'll call back. Keep it short and clear, with no music or jokes.<br><b>Leaving a message:<\/b> be <b>clear, concise, and use an appropriate tone<\/b>. Say your name, your number twice (slowly), the reason, and thank you.", "od": ["1.4.2"], "ex": "A hiring manager calls back. A professional greeting already makes a good first impression.", "today": null}, {"t": "SMS vs. MMS", "b": "<b>SMS<\/b> = plain text only, up to 160 characters, over the cell network. It works without Internet, but you need cell service and a texting plan.<br><b>MMS<\/b> = texts with pictures, video, audio, or group texts. Bigger, and may use data.", "od": ["1.5.1"], "ex": "Texting a photo of your pay stub to a caseworker = MMS.", "today": "RCS (Android 'chat features,' and on iPhone since iOS 18) adds typing dots and high-quality photos over data."}, {"t": "Chat apps (IM clients)", "b": "An <b>instant messaging client<\/b> is an app for real-time chat: WhatsApp, iMessage, Messenger, Teams, Slack, Google Chat. Extras: online status, group chats, file sharing, voice and video calls.<br><b>Needs:<\/b> an Internet connection (Wi-Fi or data), an account, and usually the <b>same app on both ends<\/b>.", "od": ["1.5.2", "1.5.3"], "ex": null, "today": "Skype (the workbook's example) shut down in May 2025. WhatsApp, Teams, and Google Meet took its place."}, {"t": "Phone notifications", "b": "Ways to create alerts on a phone: app notifications, <b>calendar appointments with reminders<\/b>, and <b>alarms/timers<\/b>.<br>iPhone: <b>Settings › Notifications › [app]<\/b>: Allow, Lock Screen, Banners, Sounds.<br>Android: <b>Settings › Notifications<\/b>, plus <b>Do Not Disturb<\/b> with exceptions (the old name was 'priority interruptions'). iPhone uses <b>Focus<\/b>.", "od": ["1.6.1", "1.6.2"], "ex": "Class or job interview? Turn on Focus/DND and let only family through.", "today": null}, {"t": "Notifications in Outlook", "b": "Outlook can alert you on a computer too. In Outlook 2016: <b>File › Options › Mail › Message arrival<\/b>: play a sound, briefly change the mouse pointer, show an envelope icon, <b>display a Desktop Alert<\/b>.<br>Meeting reminders: <b>File › Options › Calendar › Default reminders<\/b> (e.g., 15 minutes), or set the <b>Reminder<\/b> drop-down on any appointment.", "od": ["1.6.3"], "ex": "Set a 1-day reminder for your job interview appointment.", "today": null}, {"t": "⚡ Power-Up 1: GMetrix focus", "b": "<ul><li><b>What a cell phone needs<\/b>: A carrier account/plan (with data for Internet) and reception.<\/li><li><b>SIM card<\/b>: The SIM identifies the subscriber/phone on the carrier network. GSM phones need one (eSIM = built-in).<\/li><li><b>3G/4G LTE/5G<\/b>: Generations of cellular data; higher = faster.<\/li><li><b>Public Wi-Fi saves data<\/b>: Using Wi-Fi doesn't use your cellular data allowance.<\/li><\/ul>", "od": ["1.1.1", "1.1.2", "1.2.3"], "ex": null, "today": null, "gm": ["MD1", "MD2", "MD3", "MD4"], "power": true}, {"t": "⚡ Power-Up 2: GMetrix focus", "b": "<ul><li><b>Before selling a phone<\/b>: Back up, sign out, remove the SIM, and factory reset.<\/li><li><b>Saving cellular data<\/b>: Avoid streaming video and music on cellular; use Wi-Fi; turn off auto-play and updates on data.<\/li><li><b>Smartphone vs. basic phone<\/b>: Smartphones run apps and full browsers; basic phones mainly call and text.<\/li><li><b>Business voicemail content<\/b>: Name/company, say you can't take the call, ask for name/number/message, when you'll return calls.<\/li><\/ul>", "od": ["1.1.2", "1.1.3", "1.3.1", "1.4.2", "4.3.4"], "ex": null, "today": null, "gm": ["MD5", "MD6", "MD7", "MD8"], "power": true}, {"t": "⚡ Power-Up 3: GMetrix focus", "b": "<ul><li><b>Out-of-office voicemail<\/b>: Say you're away, the return date, and who to contact meanwhile.<\/li><li><b>Video calling uses<\/b>: Remote interviews, meetings, and family calls. (Skype then; Teams/Meet/WhatsApp now.)<\/li><li><b>Notification types<\/b>: Sound, vibration, banner/pop-up, badge, LED light.<\/li><li><b>Businesses using cellular tablets<\/b>: Field workers (delivery, inspections, sales) who need Internet away from Wi-Fi.<\/li><\/ul>", "od": ["1.2.1", "1.2.3", "1.4.2", "1.5.3", "1.6.1"], "ex": null, "today": null, "gm": ["MD9", "MD10", "MD11", "MD12"], "power": true}, {"t": "⚡ Power-Up 4: GMetrix focus", "b": "<ul><li><b>Cellular tablet downsides & upside<\/b>: Downsides: higher cost and a data plan. Upside: wider access.<\/li><li><b>What a smartphone can't do well<\/b>: It can't host a large database or website; that needs servers.<\/li><li><b>Smartphone vs. laptop<\/b>: Phones: small screen and keyboard, limited software and storage. Laptops: full apps.<\/li><li><b>Why mobile browsing fails<\/b>: No data plan or data used up, weak signal, roaming limits, or Airplane mode.<\/li><\/ul>", "od": ["1.1.3", "1.2.3", "1.3.1", "2.1"], "ex": null, "today": null, "gm": ["MD13", "MD14", "MD15", "MD16"], "power": true}, {"t": "⚡ Power-Up 5: GMetrix focus", "b": "<ul><li><b>Cell vs. landline<\/b>: Cell = mobile, needs a signal and battery. Landline = fixed and reliable.<\/li><li><b>Transfer a call on a desk phone<\/b>: Press Transfer › dial the extension › (announce) › Transfer again / hang up.<\/li><li><b>SMS vs. MMS<\/b>: SMS = Short Message Service, text only, 160 characters. MMS adds media.<\/li><li><b>Gmail chat abilities<\/b>: Google Chat (in Gmail) offers 1:1 and group chat, file sharing, and video meetings.<\/li><\/ul>", "od": ["1.4.1", "1.5.1", "1.5.3"], "ex": null, "today": null, "gm": ["MD17", "MD18", "MD19", "MD20"], "power": true}, {"t": "⚡ Power-Up 6: GMetrix focus", "b": "<ul><li><b>Phone to PC transfer<\/b>: USB cable, or the cloud (Google Photos/OneDrive/iCloud).<\/li><li><b>Texting needs a cellular account<\/b>: SMS needs carrier service; IM apps need Internet.<\/li><li><b>Chat service limits<\/b>: Both people usually need the same service and an Internet connection.<\/li><li><b>Wi-Fi adapter disabled<\/b>: If Wi-Fi is off or Airplane mode is on, you can't join any network.<\/li><\/ul>", "od": ["1.1.1", "1.3.1", "1.5.2", "2.5", "5.1.1"], "ex": null, "today": null, "gm": ["MD21", "MD22", "MD23", "MD24"], "power": true}], "sims": [{"title": "iPhone: tune your Messages alerts", "od": ["1.6.2"], "prompt": "On the iPhone, make Messages notifications show on the Lock Screen and repeat twice.", "steps": [{"screen": "iPhone Home Screen", "q": "Where do you start?", "opts": ["Settings", "Messages app", "Phone app", "App Store"], "a": 0, "hint": "Notification rules live in Settings."}, {"screen": "Settings", "q": "Which menu next?", "opts": ["General", "Notifications", "Privacy", "Screen Time"], "a": 1, "hint": "Look for Notifications."}, {"screen": "Notifications", "q": "Pick the app.", "opts": ["Mail", "Messages", "Photos", "Calendar"], "a": 1, "hint": "We're changing Messages."}, {"screen": "Messages", "q": "Make sure alerts are on. What do you turn on?", "opts": ["Allow Notifications", "Low Power Mode", "Airplane Mode", "Hide Alerts"], "a": 0, "hint": "Allow Notifications must be on (green)."}, {"screen": "Messages › Alerts", "q": "Which alert location do you check?", "opts": ["Lock Screen", "Wallpaper", "Siri", "Home Screen layout"], "a": 0, "hint": "The task says Lock Screen."}, {"screen": "Messages › Customize Notifications › Repeat Alerts", "q": "How many repeats?", "opts": ["Never", "Once", "Twice", "10 Times"], "a": 2, "hint": "The task says twice."}], "gm": null, "today": null}, {"title": "Record a voicemail greeting", "od": ["1.4.2"], "prompt": "Set a custom voicemail greeting on the iPhone.", "steps": [{"screen": "iPhone Home Screen", "q": "Open which app?", "opts": ["Phone", "Settings", "Voice Memos", "Messages"], "a": 0, "hint": "Voicemail lives in the Phone app."}, {"screen": "Phone", "q": "Which tab (bottom-right)?", "opts": ["Favorites", "Recents", "Contacts", "Voicemail"], "a": 3, "hint": "Voicemail is the last tab."}, {"screen": "Voicemail", "q": "What do you tap (top-left)?", "opts": ["Greeting", "Edit", "Delete", "Speaker"], "a": 0, "hint": "Greeting sets what callers hear."}, {"screen": "Greeting", "q": "Choose…", "opts": ["Default", "Custom"], "a": 1, "hint": "Custom lets you record your own."}, {"screen": "Greeting › Custom", "q": "Next?", "opts": ["Record, then Stop, then Save", "Cancel", "Play only"], "a": 0, "hint": "Record, stop, then save it."}], "gm": null, "today": null}, {"title": "Outlook: turn on Desktop Alerts", "od": ["1.6.3"], "prompt": "In Outlook 2016, set new messages to display a Desktop Alert.", "steps": [{"screen": "Outlook 2016", "q": "Which tab first?", "opts": ["Home", "File", "View", "Send / Receive"], "a": 1, "hint": "Options are under File."}, {"screen": "File (Backstage)", "q": "Then…", "opts": ["Info", "Open & Export", "Options", "Print"], "a": 2, "hint": "Options opens the settings window."}, {"screen": "Outlook Options", "q": "Which category?", "opts": ["General", "Mail", "Calendar", "People"], "a": 1, "hint": "New-message alerts are Mail settings."}, {"screen": "Mail › Message arrival", "q": "Which check box?", "opts": ["Display a Desktop Alert", "Always check spelling", "Use Unicode", "Save copies in Sent Items"], "a": 0, "hint": "Desktop Alert is the pop-up for new mail."}, {"screen": "Outlook Options", "q": "Finish with…", "opts": ["OK", "Cancel", "Reset"], "a": 0, "hint": "Click OK to save."}], "gm": null, "today": null}], "games": [{"type": "match", "title": "Mobile Match-Up", "od": ["1.1.1", "1.5.1", "1.5.3", "1.6.2"], "pairs": [["SMS", "Plain text, 160 characters"], ["MMS", "Texts with photos, video, or groups"], ["VoIP", "Calls over the Internet"], ["Hotspot", "Share phone data with a laptop"], ["eSIM", "Built-in digital SIM"], ["Do Not Disturb / Focus", "Silence alerts with exceptions"], ["IM client", "Chat app like WhatsApp or Teams"], ["NFC", "Tap-to-pay connection"]]}, {"type": "sort", "title": "Needs Internet or not?", "od": ["1.5.1", "1.5.2"], "bins": ["Works with just cell service", "Needs Wi-Fi or data"], "items": [["Plain SMS text to your mom", 0, "SMS rides the cell network, no Internet needed."], ["WhatsApp message", 1, "IM apps need Wi-Fi or data."], ["Regular phone call", 0, "Voice calls use the carrier's voice network."], ["FaceTime / Google Meet video call", 1, "Video calls run over the Internet."], ["Teams chat with your boss", 1, "Teams is an Internet app."], ["Downloading an app from Google Play", 1, "App stores need Internet."]]}], "quiz": [{"q": "A tablet with a cellular plan can get online without Wi-Fi, but usually can't…", "c": ["Run apps", "Make regular phone calls", "Use GPS", "Take photos"], "a": 1, "why": "Cellular tablets use data, not the carrier's voice service. Use a VoIP app to call.", "od": ["1.2.1"], "gm": []}, {"q": "Which is required to use a cellular network?", "c": ["A SIM/eSIM and a carrier plan", "A router", "An Ethernet cable", "A VPN"], "a": 0, "why": "Cellular service needs a SIM/eSIM, a carrier account, and coverage.", "od": ["1.1.2"], "gm": []}, {"q": "A text with a photo attached is sent as…", "c": ["SMS", "MMS", "VGA", "HDMI"], "a": 1, "why": "MMS = multimedia. SMS is plain text only.", "od": ["1.5.1"], "gm": []}, {"q": "What do WhatsApp, Teams, and iMessage need that plain SMS doesn't?", "c": ["A printer", "An Internet connection (Wi-Fi or data)", "A landline", "A USB cable"], "a": 1, "why": "IM clients run over the Internet.", "od": ["1.5.2"], "gm": []}, {"q": "Best voicemail message to an employer?", "c": ["'Hey it's me call back'", "Name, number said twice, reason, thank you", "A 3-minute story", "Just your number once, fast"], "a": 1, "why": "Clear, concise, appropriate tone.", "od": ["1.4.2"], "gm": []}, {"q": "One advantage of a hardwired desk phone:", "c": ["Fits in a pocket", "Fixed address for 911 and steady call quality", "Runs apps", "Needs no wiring"], "a": 1, "why": "Landlines are tied to a location.", "od": ["1.4.1"], "gm": []}, {"q": "Where do you change Messages alerts on an iPhone?", "c": ["Settings › Notifications › Messages", "Phone › Contacts", "Camera › Settings", "App Store › Updates"], "a": 0, "why": "Settings › Notifications › [app].", "od": ["1.6.2"], "gm": []}, {"q": "Which feature silences alerts but still lets chosen contacts through?", "c": ["Airplane Mode", "Do Not Disturb / Focus with exceptions", "Hotspot", "Low Power Mode"], "a": 1, "why": "DND/Focus allows exceptions (called 'priority' on older Android).", "od": ["1.6.1", "1.6.2"], "gm": []}, {"q": "In Outlook 2016, where do you turn on Desktop Alerts for new mail?", "c": ["File › Options › Mail", "Home › New Email", "View › Reading Pane", "File › Print"], "a": 0, "why": "File › Options › Mail › Message arrival.", "od": ["1.6.3"], "gm": []}, {"q": "Apple's mobile operating system is…", "c": ["Android", "iOS", "Linux", "ChromeOS"], "a": 1, "why": "iOS runs iPhones; iPadOS runs iPads.", "od": ["1.3.2"], "gm": []}, {"q": "Which is a real limitation of smartphones?", "c": ["Battery life and small screens", "They can't use GPS", "They can't take photos", "They can't browse"], "a": 0, "why": "Phones can do a lot, but battery, screen size, and data caps limit them.", "od": ["1.1.3", "1.3.1"], "gm": []}, {"q": "Where do Android tablets get apps?", "c": ["Google Play Store", "Windows Update", "Device Manager", "Control Panel"], "a": 0, "why": "Tablets use the same stores as phones.", "od": ["1.2.2"], "gm": []}, {"q": "Main benefit of a Wi-Fi-only tablet vs. a cellular tablet?", "c": ["Cheaper, no monthly data bill", "Works anywhere without Wi-Fi", "Makes regular calls", "Has more RAM"], "a": 0, "why": "Cellular tablets work anywhere with coverage but cost more.", "od": ["1.2.3"], "gm": []}, {"q": "What does a SIM card do?", "c": ["Identifies your phone/account on the carrier network", "Stores your wallpaper", "Adds Wi-Fi", "Charges the battery"], "a": 0, "why": "GSM phones need one; eSIM is built in.", "od": ["1.1.2"], "gm": ["MD2"]}, {"q": "Before selling your phone you should…", "c": ["Back up, sign out, remove the SIM, and factory reset", "Just turn it off", "Delete one app", "Change the ringtone"], "a": 0, "why": "Protect your data.", "od": ["4.3.4"], "gm": ["MD5"]}, {"q": "Best way to save cellular data?", "c": ["Stream video on Wi-Fi, not cellular", "Stream more", "Turn off Wi-Fi", "Leave auto-play on"], "a": 0, "why": "Video eats data.", "od": ["1.1.3"], "gm": ["MD6", "MD4"]}, {"q": "A good out-of-office voicemail includes…", "c": ["That you're away, your return date, and a backup contact", "Your home address", "A long joke", "Nothing"], "a": 0, "why": "Short and helpful.", "od": ["1.4.2"], "gm": ["MD9"]}, {"q": "Which is a notification type?", "c": ["Vibration", "Defragmentation", "Compression", "Formatting"], "a": 0, "why": "Sound, vibration, banner, badge, LED.", "od": ["1.6.1"], "gm": ["MD11"]}, {"q": "Your phone shows full bars but web pages won't load. Possible cause?", "c": ["Your data is off or used up, or you're roaming", "Too much RAM", "The wallpaper", "The SIM is too new"], "a": 0, "why": "Check data settings.", "od": ["1.1.3"], "gm": ["MD16"]}, {"q": "Hosting a large company database on a smartphone is…", "c": ["Not practical; that needs servers", "Ideal", "Required", "How email works"], "a": 0, "why": "Phones aren't servers.", "od": ["1.3.1"], "gm": ["MD14"]}, {"q": "To transfer a caller on a desk phone you press…", "c": ["Transfer, dial the extension, then Transfer again", "Mute", "Redial", "Speaker"], "a": 0, "why": "Some phones say 'Xfer.'", "od": ["1.4.1"], "gm": ["MD18"]}, {"q": "Moving phone photos to a PC can be done by…", "c": ["USB cable or a cloud service", "VGA cable", "PS/2", "Infrared only"], "a": 0, "why": "Or Google Photos/iCloud/OneDrive.", "od": ["5.1.1"], "gm": ["MD21"]}, {"q": "Google Chat inside Gmail lets you…", "c": ["Chat 1:1 or in groups and share files", "Format drives", "Install drivers", "Change BIOS"], "a": 0, "why": "It's an IM client.", "od": ["1.5.3"], "gm": ["MD20"]}, {"q": "4G LTE and 5G are…", "c": ["Generations of cellular data networks", "File types", "Printer ports", "Antivirus brands"], "a": 0, "why": "Higher generation = faster.", "od": ["1.1.1"], "gm": ["MD3"]}], "cards": [{"f": "Android", "b": "Google's mobile operating system, built on Linux and open source. Used by Samsung, Google Pixel, Motorola, and many other brands.", "ex": "Apps come from the Google Play Store."}, {"f": "iOS", "b": "Apple's operating system for the iPhone. (iPads use iPadOS, which is closely related.)", "ex": "Apps come from the Apple App Store."}, {"f": "Cellular Data", "b": "Internet access through your phone carrier's cell network. It usually counts against your plan's data.", "ex": "Streaming video on the train with no Wi-Fi uses cellular data."}, {"f": "Cellular Network", "b": "A network of cell towers, each covering an area called a 'cell,' that carriers use for calls, texts, and mobile data.", "ex": "Your call is handed from tower to tower as the bus moves across the borough."}, {"f": "SMS", "b": "Short Message Service. Plain text messages of up to 160 characters sent over the cellular network.", "ex": "Regular texts without pictures."}, {"f": "MMS", "b": "Multimedia Messaging Service. Text messages that include pictures, video, audio, or group texts.", "ex": "Sending a photo of your pay stub by text uses MMS."}, {"f": "Text Messaging", "b": "Sending short written messages between phones or devices (SMS, MMS, iMessage, RCS).", "ex": ""}, {"f": "VoIP", "b": "Voice over Internet Protocol. Making phone or video calls over the Internet instead of the regular phone network.", "ex": "WhatsApp calls, Google Voice, Microsoft Teams calls."}, {"f": "Hotspot", "b": "Using a phone's cellular data to share an Internet connection with other devices over Wi-Fi.", "ex": "Bonus term"}, {"f": "Bluetooth", "b": "Short-range wireless technology for connecting nearby devices like earbuds, speakers, and keyboards.", "ex": "Bonus term"}, {"f": "Wireless", "b": "Connecting without cables. Includes Wi-Fi, Bluetooth, and cellular.", "ex": ""}, {"f": "SIM card", "b": "Small chip that identifies your phone line on the carrier's network. eSIM is a built-in digital version.", "ex": "Switching carriers? You may get a new SIM or eSIM QR code."}, {"f": "NFC", "b": "Near Field Communication: very short-range tap connection.", "ex": "Tapping your phone on an OMNY reader."}, {"f": "Notification", "b": "An alert from an app: sound, vibration, banner, badge, or lock-screen message.", "ex": "Your MTA app buzzing about a delay."}, {"f": "Do Not Disturb / Focus", "b": "Mode that silences calls and alerts (iOS calls it Focus).", "ex": "Turn it on during class or a job interview."}, {"f": "Voicemail greeting", "b": "The recording callers hear when you don't answer.", "ex": "Record a professional one before job hunting."}], "mission": ["Finish this level's Learn cards and score 80%+ on the Quest quiz here.", "GMetrix › Computing Fundamentals (Office 2016) › Mobile Devices › Training Mode. Use the hints and read every explanation. Retake until you hit 80%+.", "GMetrix › Mobile Devices › Testing Mode (timed, no help). Pass with 80%+ (stretch goal: 85%) before you move on.", "Missed some? Open the GMetrix Study Guide for this topic, redo the matching Quest sims and Power-Ups, then retest."]}, {"id": "hardware", "n": 2, "name": "Hardware Devices", "icon": "🖥️", "gm": "Hardware Devices", "od": "2", "tagline": "The stuff you can touch, plus how it all gets online.", "lessons": [{"t": "Types of computers", "b": "<b>Desktop:<\/b> tower + monitor (or all-in-one). Powerful and upgradeable, but stays put.<br><b>Laptop:<\/b> built-in screen, keyboard, and battery. Portable.<br><b>Server:<\/b> a computer (or program) that <b>accepts requests from other computers on a network<\/b> and serves data back, like websites, email, or shared files.", "od": ["2.1"], "ex": "When you open indeed.com, a server sends you the page.", "today": null}, {"t": "Memory (RAM) = your desk", "b": "RAM is short-term working space. It's <b>volatile<\/b>: it's wiped when power is off.<br><b>Uses up RAM:<\/b> lots of open apps and browser tabs, big games, video editing. <b>Frees RAM:<\/b> closing apps and tabs, restarting.<br>Not enough RAM → slow, freezing, apps crash when multitasking. Adding RAM fixes that.", "od": ["2.2.1", "2.2.2", "2.2.3"], "ex": "25 Chrome tabs open and the laptop freezes? That's a RAM problem.", "today": null}, {"t": "Storage = your file cabinet", "b": "Storage keeps files with no power (<b>non-volatile<\/b>). Typical devices: internal hard drive (HDD) or solid-state drive (SSD), USB flash drives, external drives, SD cards, CDs/DVDs, and the cloud.<br><b>Uses up space:<\/b> photos, videos, apps, downloads, updates. <b>Frees space:<\/b> deleting, uninstalling, moving files to the cloud or an external drive.<br>Full storage → you can't save, install, or update.", "od": ["2.2.4", "2.2.5", "2.2.6", "2.2.7"], "ex": "'Storage Full' when you try to take a photo? Back up and delete old videos.", "today": null}, {"t": "Peripherals for every device", "b": "Peripherals add input, output, or storage: keyboard, mouse, webcam, microphone, speakers/headset, printer, scanner, external monitor, external drive, game controller. Phones and tablets use them too, through Bluetooth or USB-C (earbuds, keyboards, car audio).", "od": ["2.3.1"], "ex": null, "today": null}, {"t": "Ports: what plugs in where", "b": "<ul><li><b>USB-A / USB-C<\/b>: data + power (drives, mice, phones, printers)<\/li><li><b>HDMI<\/b>: digital video <b>and<\/b> audio<\/li><li><b>DVI<\/b> (white): digital video. <b>VGA<\/b> (blue, 15-pin): older analog video only<\/li><li><b>Ethernet (RJ-45)<\/b>: wired network<\/li><li><b>3.5 mm audio<\/b>: green = headphones/speakers out, pink = mic in<\/li><li>Old-school: <b>PS/2<\/b> (round; purple = keyboard, green = mouse), <b>serial<\/b> (9-pin), <b>parallel<\/b> (25-pin, old printers)<\/li><\/ul>", "od": ["2.3.2", "2.3.3"], "ex": null, "today": "USB-C is now the standard on most phones (iPhone 15 and later) and many laptops."}, {"t": "Wireless connections", "b": "<b>Bluetooth<\/b>: short range (about 30 ft), pairs earbuds, speakers, keyboards. <b>Wi-Fi<\/b>: connects to a network/Internet. <b>Infrared (IR)<\/b>: needs a clear line of sight, like a TV remote or some older printers.", "od": ["2.3.4"], "ex": null, "today": null}, {"t": "Ethernet ports", "b": "An Ethernet port (RJ-45) gives a <b>wired<\/b> network connection. It's usually the fastest and most stable. Plug the cable into the computer and the router or wall jack, and it connects automatically.", "od": ["2.4"], "ex": "Gamers and office desktops often use Ethernet to avoid lag.", "today": null}, {"t": "Joining a Wi-Fi network", "b": "Click the <b>network icon<\/b> in the taskbar, pick the network name, click <b>Connect<\/b>, and type the <b>security key<\/b> (passwords are case-sensitive).<br>Windows asks if your PC should be <b>discoverable<\/b>: <b>Yes<\/b> on trusted home/work networks, <b>No<\/b> on public Wi-Fi.<br>'2.4' networks reach farther but are slower; '5' (GHz) networks are faster but have shorter range.", "od": ["2.5"], "ex": null, "today": null}, {"t": "Power options", "b": "<b>Shut down<\/b>: fully off. <b>Restart<\/b>: off and back on (it fixes a lot!). <b>Sleep<\/b>: low power, wakes fast, work stays in RAM. <b>Hibernate<\/b>: saves your work to the drive, then powers off completely.<br>Windows 10: <b>Settings › System › Power & sleep<\/b> (screen-off and sleep timers). <b>Control Panel › Power Options<\/b>: plans like Balanced or Power saver.", "od": ["2.6.1", "2.6.3", "2.6.4"], "ex": null, "today": "Windows 11: Settings › System › Power & battery."}, {"t": "Battery life killers", "b": "Bright screen, lots of apps running (especially in the background), Wi-Fi/Bluetooth/GPS searching, video and games, very hot or cold temperatures, and an <b>old battery<\/b>. Helpers: <b>Battery saver<\/b>, lower brightness, and the Power saver plan.", "od": ["2.6.2"], "ex": null, "today": null}, {"t": "Drivers", "b": "A <b>driver<\/b> is software that lets the operating system talk to hardware (printer, graphics card, webcam). It must match your OS and version. Get drivers from Windows Update or the maker's site. <b>Device Manager<\/b> shows problem devices with a yellow ⚠.", "od": ["2.7"], "ex": null, "today": null}, {"t": "Platforms: Mac, Windows, Linux, iOS, Android", "b": "<b>Windows<\/b>: most PCs and offices. <b>macOS<\/b>: Apple computers. <b>Linux<\/b>: free, open source, runs most servers. <b>iOS<\/b>: iPhone. <b>Android<\/b>: Google's mobile OS (Samsung, Pixel), built on Linux. Apps are made for a platform: a Windows .exe won't run on an iPhone.", "od": ["2.8.1"], "ex": null, "today": null}, {"t": "Why won't it play/run?", "b": "<b>Media compatibility:<\/b> the device doesn't support the file format or codec, a plug-in is missing, or the app is outdated. Try another player (like VLC) or convert the file to .mp4.<br><b>Device limits:<\/b> low RAM, a slow processor, little storage, an old OS, or a weak graphics chip can make apps slow or impossible to install.", "od": ["2.9.1", "2.9.2"], "ex": null, "today": "Adobe Flash (.swf) has been dead since 2020. No modern browser plays it."}, {"t": "Cellular vs. Wi-Fi vs. wired", "b": "<b>Cellular<\/b>: anywhere with coverage, uses your data plan. <b>Wi-Fi<\/b>: wireless within range of a router. <b>Wired<\/b>: cable, fastest and steadiest.<br><b>ISP<\/b> (Internet Service Provider: Spectrum, Verizon Fios, Optimum) = home/business Internet. <b>Cellular provider<\/b> (Verizon Wireless, AT&T, T-Mobile) = mobile service. Some companies do both.", "od": ["2.10.1", "2.10.2"], "ex": null, "today": null}, {"t": "What it takes to get online", "b": "ISP service → <b>modem<\/b> (translates the ISP's signal into digital data) → <b>router<\/b> (moves data between your network and the Internet, and usually broadcasts Wi-Fi) → your device's <b>network interface card (NIC)<\/b>, the wired or Wi-Fi adapter inside it. Cellular needs a SIM plus a plan instead.", "od": ["2.11.1", "2.11.2"], "ex": "Many ISPs give you one 'gateway' box that's a modem + router.", "today": null}, {"t": "Bandwidth & speed", "b": "<b>Bandwidth<\/b> = how much data the connection can move per second (Mbps). You buy it from your ISP.<br>Speed is affected by your plan, Wi-Fi signal (distance, walls), how many people are online, old routers or adapters, background downloads, and malware. Test it at fast.com or speedtest.net.", "od": ["2.11.3", "2.11.4"], "ex": "Everyone streaming at 9 pm = slower Wi-Fi for all.", "today": null}, {"t": "Business networks", "b": "<b>LAN<\/b>: local area network (one office or building). <b>WLAN<\/b>: wireless LAN. <b>WAN<\/b>: connects locations far apart (the Internet is the biggest WAN). <b>Intranet<\/b>: a private company website. <b>Guest Wi-Fi<\/b>: kept separate from staff devices. Remote workers connect through a <b>VPN<\/b>.", "od": ["2.11.5"], "ex": null, "today": null}, {"t": "Reading a computer's specs", "b": "<b>CPU<\/b> (processor): the 'brain.' More cores and GHz = faster. <b>RAM<\/b>: 8 GB is a common minimum. <b>Storage type<\/b>: <b>SSD<\/b> is fast and silent, <b>HDD<\/b> is cheaper per GB but slower. <b>Size<\/b>: GB/TB. <b>Video card (GPU)<\/b>: integrated is fine for school work; dedicated is for gaming and video editing.", "od": ["2.12.1"], "ex": "Laptop shopping on a budget: an SSD + 8 GB RAM beats a big slow HDD.", "today": null}, {"t": "Touchscreens", "b": "<b>Touch:<\/b> natural, takes less space and fewer peripherals, great for tapping and swiping. But it's <b>less precise<\/b>, gets fingerprints, and typing is slower.<br><b>Keyboard + mouse:<\/b> precise and fast for typing, but needs more stuff. A <b>2-in-1<\/b> gives you both.", "od": ["2.13.1", "2.13.2"], "ex": null, "today": null}, {"t": "⚡ Power-Up 1: GMetrix focus", "b": "<ul><li><b>Tablet vs. laptop limits<\/b>: Tablets: smaller screens, touch typing, fewer ports, limited desktop software. Laptops: full OS and keyboard.<\/li><li><b>Why a business picks Wi-Fi-only tablets<\/b>: Lower cost, no data plans, and they're used where Wi-Fi exists (store, office, clinic).<\/li><li><b>How smartphones get online<\/b>: Wi-Fi, a hotspot, or the carrier's cellular data.<\/li><li><b>Freeing drive space<\/b>: Deleting or moving files frees storage.<\/li><\/ul>", "od": ["1.1.1", "1.2.1", "1.2.3", "2.13.2", "2.2.6"], "ex": null, "today": null, "gm": ["HD1", "HD2", "HD3", "HD4"], "power": true}, {"t": "⚡ Power-Up 2: GMetrix focus", "b": "<ul><li><b>What uses the most storage<\/b>: Video files (then photos, games, apps).<\/li><li><b>Laptop to TV<\/b>: Use an HDMI cable (video + audio).<\/li><li><b>Keyboard connections<\/b>: USB, Bluetooth (wireless), or old PS/2.<\/li><li><b>What Ethernet connects to<\/b>: A router, a network switch, a wall jack (LAN), or directly to another PC.<\/li><\/ul>", "od": ["2.2.6", "2.3.2", "2.3.3", "2.3.4", "2.4"], "ex": null, "today": null, "gm": ["HD5", "HD6", "HD7", "HD8"], "power": true}, {"t": "⚡ Power-Up 3: GMetrix focus", "b": "<ul><li><b>Join a Wi-Fi network and refresh the page<\/b>: Network icon › pick network › Connect › key › Next › then click Reload in the browser.<\/li><li><b>When to update drivers<\/b>: For pointing devices and displays, and after an OS upgrade or a switch from 32-bit to 64-bit Windows.<\/li><li><b>Open-source vs. proprietary<\/b>: Open source: Linux, Android. Proprietary: Windows, iOS, macOS.<\/li><li><b>Wi-Fi vs. cellular cost/speed<\/b>: Wi-Fi is usually cheaper (no data charges) and often faster.<\/li><\/ul>", "od": ["2.10.1", "2.5", "2.7", "2.8.1"], "ex": null, "today": null, "gm": ["HD9", "HD10", "HD11", "HD12"], "power": true}, {"t": "⚡ Power-Up 4: GMetrix focus", "b": "<ul><li><b>Home Wi-Fi needs an ISP<\/b>: A router alone isn't Internet. You need ISP service (plus a modem).<\/li><li><b>Hotspot<\/b>: A phone can share its cellular data with other devices over Wi-Fi.<\/li><li><b>Closing apps frees RAM<\/b>: Closing programs frees memory.<\/li><li><b>VGA<\/b>: A display (video) connector.<\/li><\/ul>", "od": ["1.1.1", "2.10.2", "2.11.1", "2.2.2", "2.3.3"], "ex": null, "today": null, "gm": ["HD13", "HD14", "HD15", "HD16"], "power": true}, {"t": "⚡ Power-Up 5: GMetrix focus", "b": "<ul><li><b>Printer connections<\/b>: USB, Ethernet (network), or Wi-Fi.<\/li><li><b>Speaker connections<\/b>: 3.5 mm audio cable, USB, or Bluetooth.<\/li><li><b>Joining a secure Wi-Fi network<\/b>: The Wi-Fi adapter must be on (not Airplane mode) and you need the password/key.<\/li><li><b>View system info (RAM/CPU) in Control Panel<\/b>: Control Panel › System and Security › System → Processor and Installed memory (RAM).<\/li><\/ul>", "od": ["2.12.1", "2.3.1", "2.3.3", "2.3.4", "2.5"], "ex": null, "today": null, "gm": ["HD17", "HD18", "HD19", "HD20"], "power": true}, {"t": "⚡ Power-Up 6: GMetrix focus", "b": "<ul><li><b>Power plan settings<\/b>: Power plans control when the display turns off, when the PC sleeps, and brightness.<\/li><li><b>Internet speed factors<\/b>: Plan bandwidth, Wi-Fi signal, number of users, and equipment.<\/li><li><b>Available-networks icon<\/b>: The network icon on the taskbar shows available Wi-Fi networks.<\/li><li><b>Wired advantages<\/b>: More reliable, usually faster, and more secure than wireless.<\/li><\/ul>", "od": ["2.10.1", "2.11.4", "2.5", "2.6.1", "2.6.3", "7.4.1"], "ex": null, "today": null, "gm": ["HD21", "HD22", "HD23", "HD24"], "power": true}, {"t": "⚡ Power-Up 7: GMetrix focus", "b": "<ul><li><b>Network types<\/b>: LAN, WLAN, WAN, cellular, matched to their uses.<\/li><li><b>Battery saving<\/b>: Lower brightness, Battery saver, close apps, turn off unused radios.<\/li><li><b>Bandwidth and the modem/router<\/b>: An old or slow modem or router can bottleneck bandwidth.<\/li><li><b>Mac app compatibility<\/b>: Windows .exe programs don't run natively on a Mac. Get the Mac version or a web app.<\/li><\/ul>", "od": ["2.10.1", "2.11.3", "2.11.4", "2.11.5", "2.6.2", "2.8.1", "2.9.2"], "ex": null, "today": null, "gm": ["HD25", "HD26", "HD27", "HD28"], "power": true}, {"t": "⚡ Power-Up 8: GMetrix focus", "b": "<ul><li><b>Web vs. desktop apps<\/b>: Web apps run in a browser on any OS; desktop apps are installed for one OS.<\/li><li><b>Bluetooth needs no Wi-Fi<\/b>: Bluetooth pairing works directly between devices without Wi-Fi or Internet.<\/li><li><b>RAM in System Information<\/b>: System Information (msinfo32) shows installed physical memory (RAM).<\/li><li><b>Windows 10 power settings<\/b>: Settings › System › Power & sleep.<\/li><\/ul>", "od": ["2.12.1", "2.2.1", "2.3.4", "2.6.3", "6.4.1"], "ex": null, "today": null, "gm": ["HD29", "HD30", "HD31", "HD32"], "power": true}, {"t": "⚡ Power-Up 9: GMetrix focus", "b": "<ul><li><b>Linux runs everywhere<\/b>: Linux runs servers, desktops, and devices, not just phones.<\/li><li><b>CPU socket<\/b>: The CPU plugs into a socket on the motherboard.<\/li><li><b>Turn on Tablet mode<\/b>: Action Center (notification icon) › Tablet mode tile.<\/li><li><b>Surface isn't just a tablet<\/b>: Microsoft Surface devices are 2-in-1s (laptop + tablet) running full Windows.<\/li><\/ul>", "od": ["2.1", "2.12.1", "2.13.1", "2.8.1"], "ex": null, "today": null, "gm": ["HD33", "HD34", "HD35", "HD36"], "power": true}], "sims": [{"title": "Connect to LearnKey 2.4 (the classic!)", "od": ["2.5"], "prompt": "From the Windows 10 Network screen, connect to the LearnKey 2.4 network with the password Pa$$w0rd. Allow your PC to be discoverable.", "steps": [{"screen": "Windows 10 desktop", "q": "Where do you click to see Wi-Fi networks?", "opts": ["Network icon in the taskbar", "Start › Paint", "Recycle Bin", "Clock"], "a": 0, "hint": "The Wi-Fi/network icon is near the clock."}, {"screen": "Available networks", "q": "Which network?", "opts": ["LearnKey 5", "LearnKey 2.4", "Guest-Open", "Linksys"], "a": 1, "hint": "Read the task: LearnKey 2.4."}, {"screen": "LearnKey 2.4", "q": "Then…", "opts": ["Connect", "Disconnect", "Properties", "Forget"], "a": 0, "hint": "Click Connect."}, {"type": "input", "screen": "Enter the network security key", "q": "Type the password exactly.", "label": "Network security key", "a": "Pa$$w0rd", "hint": "Capital P, two dollar signs, and a zero: Pa$$w0rd"}, {"screen": "Enter the network security key", "q": "Now click…", "opts": ["Next", "Cancel"], "a": 0, "hint": "Next submits the key."}, {"screen": "Network discovery", "q": "Do you want to allow your PC to be discoverable by other PCs and devices on this network?", "opts": ["Yes", "No"], "a": 0, "hint": "The task says allow, so click Yes."} a TV", "A printer"], "a": 0, "why": "Laptop + tablet.", "od": ["2.13.1"], "gm": ["HD36"]}, {"q": "Where in Control Panel do you see installed RAM and processor?", "c": ["System and Security › System", "Programs › Default Programs", "Appearance › Fonts", "Sound"], "a": 0, "why": "System page.", "od": ["2.12.1"], "gm": ["HD20", "HD31"]}, {"q": "Why might a business choose Wi-Fi-only tablets?", "c": ["Cheaper, with no data plans, used where Wi-Fi exists", "They make phone calls", "They have more ports", "They don't need power"], "a": 0, "why": "Cost savings.", "od": ["1.2.3"], "gm": ["HD2"]}, {"q": "An old router can…", "c": ["Bottleneck your Internet speed", "Increase RAM", "Fix viruses", "Charge phones"], "a": 0, "why": "Equipment affects bandwidth.", "od": ["2.11.4"], "gm": ["HD27"]}, {"q": "Linux is used only on phones. True?", "c": ["False: it runs servers, desktops, and devices", "True"], "a": 0, "why": "Most web servers run Linux.", "od": ["2.8.1"], "gm": ["HD33"]}], "cards": [{"f": "Hardware", "b": "The physical parts of a computer or device you can touch.", "ex": "Keyboard, screen, RAM chips, hard drive."}, {"f": "PC", "b": "Personal Computer. Often used to mean a computer running Windows (as opposed to a Mac).", "ex": ""}, {"f": "Laptop", "b": "A portable computer with a built-in screen, keyboard, touchpad, and battery.", "ex": "A Chromebook is a type of laptop."}, {"f": "Peripherals", "b": "External devices you connect to a computer to add input, output, or storage.", "ex": "Keyboard, mouse, printer, webcam, external drive, speakers."}, {"f": "Memory", "b": "Usually means RAM: the computer's short-term working space. It is volatile, so it's erased when power is off. More RAM lets you run more programs at once. (Long-term storage is the drive.)", "ex": "8 GB of RAM is a common minimum for a Windows PC today."}, {"f": "Driver", "b": "Software that lets the operating system talk to a piece of hardware, like a printer or graphics card.", "ex": "A new printer may need its driver installed before it will print."}, {"f": "Firmware", "b": "Software stored permanently on a hardware device that controls its basic functions (for example, BIOS/UEFI on a PC or the software inside a router).", "ex": "Routers get firmware updates to fix security holes."}, {"f": "HDMI", "b": "High-Definition Multimedia Interface. A digital port and cable that carries HD video AND audio together.", "ex": "Connect a laptop to a TV with one HDMI cable."}, {"f": "VGA", "b": "Video Graphics Array. An older analog video-only port (usually blue, 15 pins) for monitors and projectors. It does not carry audio.", "ex": "Old classroom projectors may still use VGA."}, {"f": "USB", "b": "Universal Serial Bus. The standard port for connecting and charging devices. USB-A is the older rectangle; USB-C is the newer small oval that plugs in either way.", "ex": "Flash drives, keyboards, phone chargers."}, {"f": "Ethernet", "b": "The standard for wired networks. Uses network cables with RJ-45 plugs (they look like a wide phone plug).", "ex": "Plugging a desktop straight into the router with a cable is an Ethernet connection."}, {"f": "Modem", "b": "The device that connects your home to your Internet Service Provider (ISP). It converts the ISP's signal (cable, DSL, fiber) into digital data your devices can use.", "ex": "Many ISPs give you one box that is a modem + router combo."}, {"f": "Router", "b": "A device that directs data between networks, such as your home network and the Internet. Most home routers also create the Wi-Fi network.", "ex": ""}, {"f": "Wi-Fi", "b": "Wireless networking technology that connects devices to a router using radio waves.", "ex": "Free Wi-Fi at NYPL, BPL, and Queens Public Library branches."}, {"f": "Bandwidth", "b": "In networking, the maximum amount of data a connection can move in a set amount of time, usually measured in Mbps or Gbps. More bandwidth = more data at once.", "ex": "A 300 Mbps home plan can stream on more devices at once than a 25 Mbps plan."}, {"f": "IPv4", "b": "Internet Protocol version 4. Uses 32-bit addresses, which allows about 4.3 billion addresses. That's not enough for today's devices.", "ex": "Still the most common type you'll see on a home network."}, {"f": "IPv6", "b": "Internet Protocol version 6. Uses 128-bit addresses, which allows a practically unlimited number. It was created because IPv4 addresses ran out.", "ex": "Many phones and ISPs already use IPv6."}, {"f": "Linux", "b": "A free, open-source operating system that anyone can use and change. Comes in many versions (distributions) such as Ubuntu. Runs most web servers.", "ex": "Android is built on Linux."}, {"f": "OS", "b": "Operating System. The main software that manages all the hardware and software on a device and lets you use it.", "ex": "Windows, macOS, Linux, iOS, Android, ChromeOS."}, {"f": "Open Source", "b": "Software whose code is public, so anyone can use, study, change, and share it (Linux, Android).", "ex": "Bonus term"}, {"f": "CPU", "b": "Central Processing Unit: the 'brain' that runs instructions. Sits in a socket on the motherboard.", "ex": "Intel Core i5, AMD Ryzen 5."}, {"f": "GPU", "b": "Graphics Processing Unit: draws images and video.", "ex": "Gamers and video editors want a strong GPU."}, {"f": "RAM", "b": "Short-term working memory; wiped when power is off.", "ex": "More RAM = more apps open smoothly."}, {"f": "SSD vs HDD", "b": "SSD = fast flash storage, no moving parts. HDD = spinning platters, cheaper per GB.", "ex": "Most new laptops ship with an SSD."}, {"f": "NIC", "b": "Network Interface Card: the hardware that connects a device to a network (wired or Wi-Fi).", "ex": "No NIC, no network."}, {"f": "Switch", "b": "Connects many wired devices inside one network.", "ex": "The box in an office closet with lots of Ethernet cables."}, {"f": "ISP", "b": "Internet Service Provider: the company that sells you Internet.", "ex": "Spectrum, Verizon Fios, Optimum."}, {"f": "Tablet mode", "b": "Windows 10 touch-friendly layout (removed in Windows 11).", "ex": "Action Center › Tablet mode."}], "mission": ["Finish this level's Learn cards and score 80%+ on the Quest quiz here.", "GMetrix › Computing Fundamentals (Office 2016) › Hardware Devices › Training Mode. Use the hints and read every explanation. Retake until you hit 80%+.", "GMetrix › Hardware Devices › Testing Mode (timed, no help). Pass with 80%+ (stretch goal: 85%) before you move on.", "Missed some? Open the GMetrix Study Guide for this topic, redo the matching Quest sims and Power-Ups, then retest."]}, {"id": "software", "n": 3, "name": "Computer Software Architecture", "icon": "⚙️", "gm": "Computer Software Architecture", "od": "3", "tagline": "Settings, files, accounts, installs, and fixing stuff. The biggest level, worth it!", "lessons": [{"t": "Keep your OS updated", "b": "Updates patch security holes and add features. Windows 10: <b>Settings › Update & Security › Windows Update › Check for updates<\/b>, then restart. An OS that no longer gets updates is a security risk.", "od": ["3.1"], "ex": null, "today": "Windows 10 support ended Oct 14, 2025. Windows 11 puts Windows Update at the top level of Settings."}, {"t": "System vs. app settings", "b": "<b>System settings<\/b> change the whole computer (display, Wi-Fi, time zone, sometimes for every user). <b>Application settings<\/b> change one app (Chrome's homepage, Word's default font). Before you change something, ask: who and what will this affect?", "od": ["3.2.1", "3.2.2"], "ex": null, "today": null}, {"t": "Make the desktop yours", "b": "<b>Settings › Personalization<\/b>: <b>Background<\/b> (picture, solid color, slideshow), Colors, Lock screen, Themes. Right-clicking the desktop › <b>Personalize<\/b> gets you there fast.", "od": ["3.3.1", "3.3.4"], "ex": null, "today": null}, {"t": "Screen saver & resolution", "b": "Screen saver: <b>Personalization › Lock screen › Screen saver settings<\/b> → pick one and set the <b>Wait<\/b> minutes.<br>Resolution: <b>Settings › System › Display › Display resolution<\/b>, then click <b>Keep changes<\/b>. Bigger text: change <b>Scale<\/b> to 125%+.", "od": ["3.3.2", "3.3.3"], "ex": "Helping a relative with low vision? Bump up the scale.", "today": null}, {"t": "Window control", "b": "The top-right buttons are <b>Minimize<\/b> (_), <b>Maximize/Restore<\/b> (□), and <b>Close<\/b> (X). <b>Resize<\/b> by dragging an edge or corner. <b>Snap<\/b>: Windows key + ←/→. <b>Alt+Tab<\/b> switches apps.", "od": ["3.3.5"], "ex": null, "today": null}, {"t": "Office options, part 1", "b": "<b>Quick Access Toolbar (QAT)<\/b>: the little toolbar at the very top. Click its ▾ arrow and pick a command, or right-click any ribbon button › <b>Add to Quick Access Toolbar<\/b>.<br><b>AutoSave frequency<\/b>: <b>File › Options › Save › Save AutoRecover information every __ minutes<\/b>.", "od": ["3.4.1", "3.4.2"], "ex": null, "today": "Microsoft 365 also has an AutoSave on/off switch for files saved in OneDrive. The exam's 2016 version means AutoRecover minutes."}, {"t": "Office options, part 2", "b": "<b>Default font size (Word)<\/b>: Home › Font dialog launcher (or Ctrl+D) › choose a size › <b>Set As Default<\/b> › All documents. (Excel: File › Options › General › Font size.)<br><b>Print settings<\/b>: <b>File › Print<\/b>: printer, copies, pages, one-/two-sided, orientation, paper size, margins, scaling.", "od": ["3.4.3", "3.4.4"], "ex": "Printing just page 2 of your resume? Under Pages, type 2.", "today": null}, {"t": "User accounts", "b": "<b>Administrator<\/b> = can install software and change settings for everyone. <b>Standard<\/b> = everyday use. Add one: <b>Settings › Accounts › Family & other users › Add someone else<\/b>. Change type: select the account › <b>Change account type<\/b>. Your picture and sign-in options: <b>Accounts › Your info / Sign-in options<\/b>.", "od": ["3.5.1", "3.5.2"], "ex": null, "today": null}, {"t": "File extensions decoder", "b": "The letters after the dot tell Windows what opens the file. Turn them on in File Explorer: <b>View › File name extensions<\/b>.<ul><li>.doc/.docx Word · .xls/.xlsx Excel · .txt plain text · .pdf looks the same everywhere<\/li><li>.jpg photos (24-bit color) · .tif high-quality scans<\/li><li>.mp3 compressed audio · .wav uncompressed audio · .mp4 video · .avi older video<\/li><li>.exe program/installer · .zip compressed · .swf Adobe Flash<\/li><\/ul>", "od": ["3.6.1"], "ex": null, "today": null}, {"t": "Permissions on files", "b": "<b>Read-only<\/b> = people can open the file but can't save changes over it (Properties › General › Read-only). Network and cloud permissions: <b>Read/View<\/b> vs. <b>Write/Edit<\/b> vs. <b>Full control<\/b>. No permission = you can't open it at all.", "od": ["3.6.2"], "ex": null, "today": null}, {"t": "Move, copy, delete, rename, new folder", "b": "New folder: right-click › New › Folder (Ctrl+Shift+N). <b>Rename<\/b>: F2. <b>Copy<\/b>: Ctrl+C → Ctrl+V (two copies). <b>Move<\/b>: Ctrl+X → Ctrl+V (one copy, new place). <b>Delete<\/b>: Del key → Recycle Bin (you can restore it from there).", "od": ["3.6.3", "3.6.4"], "ex": "Name files clearly: Lastname_Resume_2026.pdf", "today": null}, {"t": "Scanning documents", "b": "Scanning turns paper into a digital file: a flatbed scanner (Windows Scan app) or a phone (iPhone Notes/Files › Scan Documents, Google Drive › Scan, Adobe Scan). Best formats: <b>PDF<\/b> for documents (multi-page, readable anywhere), <b>TIFF<\/b> for archive-quality images, <b>JPG<\/b> for quick photos.", "od": ["3.7.1", "3.7.2"], "ex": "Upload your ID and pay stubs to a NYC housing application as PDFs.", "today": null}, {"t": "Menus & controls", "b": "<b>Context menu<\/b> = the menu you get when you <b>right-click<\/b>. It shows options for that exact thing. <b>Radio buttons<\/b> (○) = pick ONE. <b>Check boxes<\/b> (☐) = pick any. <b>Drop-down<\/b> = click ▾, choose from a list. Multi-select files: Ctrl+click (pick each) or Shift+click (a range).", "od": ["3.8.1"], "ex": null, "today": null}, {"t": "Finding files", "b": "Type in the <b>Start search<\/b> box or File Explorer's <b>search box<\/b> (top-right). Narrow results by type (*.pdf, kind:picture), <b>Date modified<\/b>, size, or 'current folder' vs. subfolders. Lost a download? Downloads go to the <b>Downloads<\/b> folder by default (the browser can change this).", "od": ["3.9.1", "3.9.2", "3.9.3"], "ex": null, "today": null}, {"t": "Admin rights & permissions", "b": "Admins install software and change system settings; standard users can't (they see a <b>UAC<\/b> prompt asking for an admin password). Why organizations care: protect confidential files (HR, payroll), prevent accidental changes, stop malware installs, and track who did what. That's 'least privilege.'", "od": ["3.10.1", "3.10.2"], "ex": null, "today": null}, {"t": "IP addresses", "b": "An IP address is a device's address on a network. <b>IPv4<\/b>: four numbers 0-255 with dots (192.168.1.25). <b>IPv6<\/b>: eight groups of hexadecimal digits with colons (2001:db8::8a2e:370:7334).<br>Find yours: <b>Settings › Network & Internet › Status › View your network properties<\/b>, or type <b>ipconfig<\/b> in Command Prompt.", "od": ["3.11.1", "3.13.4"], "ex": null, "today": null}, {"t": "Install, uninstall, update, repair", "b": "<b>Install:<\/b> from the official site or Microsoft Store (downloads usually land in Downloads as .exe/.msi), or from local media (DVD, USB) by running setup.exe. <b>Uninstall/Repair:<\/b> <b>Settings › Apps › Apps & features<\/b> › select › Uninstall or Modify. Classic path: <b>Control Panel › Programs and Features<\/b>. Programs install to <b>C:\\Program Files<\/b> by default.", "od": ["3.12.1", "3.12.2"], "ex": null, "today": "Windows 11: Settings › Apps › Installed apps › ⋯ › Uninstall."}, {"t": "Troubleshooting 101", "b": "1) What happened, any error, what changed? 2) Restart, check power, cables, Wi-Fi. 3) Write down the exact error and search it. 4) Change one thing at a time. 5) Ask for help with details.<br>Frozen app: <b>Ctrl+Shift+Esc<\/b> › Task Manager › <b>End task<\/b>.<br>Hardware clues: no power, noises, a device not detected. Software clues: one app crashes, an error after an update.", "od": ["3.13.1"], "ex": null, "today": null}, {"t": "Say it like a tech", "b": "Use clear words: <b>frozen/unresponsive<\/b>, <b>crashed<\/b>, <b>error code<\/b>, <b>won't boot<\/b>, <b>blue screen<\/b>, <b>no connectivity<\/b>, <b>slow/lagging<\/b>, <b>not detected<\/b>. Example: 'Since this morning's update, Word crashes when I open .docx files; restarting didn't help.'", "od": ["3.13.2"], "ex": null, "today": null}, {"t": "Let Windows troubleshoot", "b": "Windows has built-in <b>troubleshooting wizards<\/b>: <b>Settings › Update & Security › Troubleshoot › Additional troubleshooters<\/b> → Internet Connections, Printer, Playing Audio, Windows Update… → <b>Run the troubleshooter<\/b>. Follow the steps.", "od": ["3.13.3"], "ex": null, "today": "Windows 11: Settings › System › Troubleshoot › Other troubleshooters (newer builds hand off to the Get Help app)."}, {"t": "Check your connection speed", "b": "Link speed to the router: <b>Control Panel › Network and Sharing Center<\/b> › click your connection › <b>Speed<\/b>. Task Manager › Performance shows live traffic. For your real Internet speed, run fast.com or speedtest.net.", "od": ["3.13.5"], "ex": null, "today": null}, {"t": "⚡ Power-Up 1: GMetrix focus", "b": "<ul><li><b>Set Office default font (Palatino Linotype, 12)<\/b>: Excel: File › Options › General › 'Use this as the default font' = Palatino Linotype, Font size 12 › OK (restart Excel). Word: Font dialog › Set As Default.<\/li><li><b>Copy/paste a .docx into a folder<\/b>: Select file › Ctrl+C (or right-click › Copy) › open the folder › Ctrl+V.<\/li><li><b>Deny Write permission for a user<\/b>: Right-click file › Properties › Security › Edit › select user › check Deny for Write › OK › Yes.<\/li><li><b>Open a file by path (This PC\\Documents)<\/b>: File Explorer › This PC › Documents › double-click the .xlsx (or type the path in the address bar).<\/li><\/ul>", "od": ["3.10.2", "3.4.3", "3.6.2", "3.6.3", "3.9.1"], "ex": null, "today": null, "gm": ["SA1", "SA2", "SA3", "SA4"], "power": true}, {"t": "⚡ Power-Up 2: GMetrix focus", "b": "<ul><li><b>Repair a program<\/b>: Control Panel › Programs › Programs and Features › select program › Repair (or Change › Repair).<\/li><li><b>End a frozen task<\/b>: Ctrl+Shift+Esc › select app › End task.<\/li><li><b>Reload a web page<\/b>: Click the circular-arrow Reload button or press F5.<\/li><li><b>Create a desktop shortcut<\/b>: Right-click the file or app › Send to › Desktop (create shortcut).<\/li><\/ul>", "od": ["3.12.1", "3.13.1", "3.3.1", "3.8.1"], "ex": null, "today": null, "gm": ["SA5", "SA6", "SA7", "SA8"], "power": true}, {"t": "⚡ Power-Up 3: GMetrix focus", "b": "<ul><li><b>Give a user Full control<\/b>: File/folder Properties › Security › Edit › select user › Allow Full control › OK.<\/li><li><b>Uninstall a program<\/b>: Settings › Apps › select › Uninstall (or Programs and Features).<\/li><li><b>Add Spelling to the Quick Access Toolbar<\/b>: File › Options › Quick Access Toolbar › Spelling & Grammar › Add › OK (or right-click the ribbon button).<\/li><li><b>Copy a file from OneDrive\\Pictures to the Desktop<\/b>: File Explorer › OneDrive › Pictures › right-click file › Copy › Desktop › Paste.<\/li><\/ul>", "od": ["3.10.2", "3.12.1", "3.4.1", "3.6.2", "3.6.3", "6.3.2"], "ex": null, "today": null, "gm": ["SA9", "SA10", "SA11", "SA12"], "power": true}, {"t": "⚡ Power-Up 4: GMetrix focus", "b": "<ul><li><b>Set an image as the desktop background<\/b>: Right-click the picture › Set as desktop background (or Settings › Personalization › Background › Browse).<\/li><li><b>Check for Windows updates<\/b>: Settings › Update & Security › Windows Update › Check for updates.<\/li><li><b>Choose a sound output device (e.g., Digital Optical)<\/b>: Settings › System › Sound › 'Choose your output device' drop-down › pick the device.<\/li><li><b>What an IP address does<\/b>: It identifies a device on a network so data reaches the right place.<\/li><\/ul>", "od": ["2.3.3", "3.1", "3.11.1", "3.2.1", "3.3.4"], "ex": null, "today": null, "gm": ["SA13", "SA14", "SA15", "SA16"], "power": true}, {"t": "⚡ Power-Up 5: GMetrix focus", "b": "<ul><li><b>Valid vs. invalid IP<\/b>: Each IPv4 number must be 0-255, so 256.x.x.x is invalid.<\/li><li><b>Game keeps freezing<\/b>: Graphics-heavy games that freeze often point to the graphics card or its driver (update the driver, check overheating).<\/li><li><b>Default download location<\/b>: The Downloads folder.<\/li><li><b>Why zip<\/b>: Smaller files, many files in one package.<\/li><\/ul>", "od": ["2.12.1", "3.11.1", "3.13.1", "3.9.3", "5.2.1"], "ex": null, "today": null, "gm": ["SA17", "SA18", "SA19", "SA20"], "power": true}, {"t": "⚡ Power-Up 6: GMetrix focus", "b": "<ul><li><b>The clipboard<\/b>: A temporary holding spot for what you Copy or Cut, until you Paste.<\/li><li><b>Where to edit permissions<\/b>: Properties › Security tab › Edit.<\/li><li><b>Why change the default font<\/b>: So every new document starts with your preferred or required font without changing it each time.<\/li><li><b>File Explorer address bar<\/b>: Shows the current location (path) and lets you type a path to jump there.<\/li><\/ul>", "od": ["3.4.3", "3.6.2", "3.6.3", "3.9.1"], "ex": null, "today": null, "gm": ["SA21", "SA22", "SA23", "SA24"], "power": true}, {"t": "⚡ Power-Up 7: GMetrix focus", "b": "<ul><li><b>Repair vs. reinstall<\/b>: Repair fixes missing or damaged program files and keeps your settings (try it first). Reinstall = uninstall + install fresh.<\/li><li><b>Admin rights to install<\/b>: Installing software for the computer usually needs an administrator account (a UAC prompt).<\/li><li><b>Quick Access Toolbar facts<\/b>: Each Office app has its own QAT. You can add or remove commands and show it above or below the ribbon. It's for shortcuts, not new features.<\/li><li><b>Windows path format<\/b>: Drive letter, colon, backslashes: C:\\Users\\Jmal\\Documents\\Budget.xlsx<\/li><\/ul>", "od": ["3.10.1", "3.12.1", "3.4.1", "3.9.1"], "ex": null, "today": null, "gm": ["SA25", "SA26", "SA27", "SA28"], "power": true}, {"t": "⚡ Power-Up 8: GMetrix focus", "b": "<ul><li><b>NTFS permission types<\/b>: Full control, Modify, Read & execute, List folder contents, Read, Write (each can be Allow or Deny).<\/li><li><b>File Properties fields<\/b>: Type, location, size, size on disk, created, modified, and accessed dates, and attributes (Read-only, Hidden).<\/li><li><b>Browser reload icon<\/b>: The circular arrow next to the address bar reloads (refreshes) the page.<\/li><li><b>Best format for scans<\/b>: PDF.<\/li><\/ul>", "od": ["3.13.1", "3.6.1", "3.6.2", "3.7.2"], "ex": null, "today": null, "gm": ["SA29", "SA30", "SA31", "SA32"], "power": true}, {"t": "⚡ Power-Up 9: GMetrix focus", "b": "<ul><li><b>Where Windows Update lives<\/b>: Settings › Update & Security › Windows Update.<\/li><\/ul>", "od": ["3.1"], "ex": null, "today": null, "gm": ["SA33"], "power": true}], "sims": [{"title": "Screen saver: Bubbles, 10 minutes", "od": ["3.3.2"], "prompt": "Set the screen saver to Bubbles with a 10-minute wait.", "steps": [{"screen": "Desktop (right-click)", "q": "Choose…", "opts": ["Personalize", "Display settings", "New › Folder", "Refresh"], "a": 0, "hint": "Personalize opens Personalization."}, {"screen": "Personalization", "q": "Left pane?", "opts": ["Background", "Colors", "Lock screen", "Fonts"], "a": 2, "hint": "Screen saver settings hide under Lock screen."}, {"screen": "Lock screen", "q": "Scroll down and click…", "opts": ["Screen saver settings", "Screen timeout settings", "Browse"], "a": 0, "hint": "Screen saver settings."}, {"screen": "Screen Saver Settings", "q": "Screen saver drop-down:", "opts": ["(None)", "3D Text", "Bubbles", "Ribbons"], "a": 2, "hint": "Bubbles."}, {"
