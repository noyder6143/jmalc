le per app.", "od": ["3.4.1"], "gm": ["SA27"]}, {"q": "Fastest way to put a shortcut to a file on the desktop?", "c": ["Right-click › Send to › Desktop (create shortcut)", "Move the file to the Recycle Bin", "Rename it", "Zip it"], "a": 0, "why": "Send to.", "od": ["3.8.1"], "gm": ["SA8"]}, {"q": "Which does File Properties (General) show?", "c": ["Size, location, and created/modified dates", "Your Wi-Fi password", "Your RAM", "Battery health"], "a": 0, "why": "Plus attributes like Read-only.", "od": ["3.6.1"], "gm": ["SA30"]}, {"q": "Why set a default font in Office?", "c": ["So every new file starts with the font you need", "To make files smaller", "To add virus protection", "To print faster"], "a": 0, "why": "No reformatting each time.", "od": ["3.4.3"], "gm": ["SA23", "SA1"]}, {"q": "Where do you pick a different speaker or optical output?", "c": ["Settings › System › Sound", "Settings › Apps", "Device Manager › Batteries", "Control Panel › Fonts"], "a": 0, "why": "Choose your output device.", "od": ["3.2.1"], "gm": ["SA15"]}, {"q": "The circular arrow next to the browser's address bar…", "c": ["Reloads the page", "Closes the tab", "Bookmarks the page", "Prints"], "a": 0, "why": "F5 does the same.", "od": ["3.13.1"], "gm": ["SA31", "SA7"]}], "cards": [{"f": ".avi", "b": "Audio Video Interleave. An older Microsoft video file format that holds video and sound together.", "ex": "Old camcorder clips are often .avi. Some phones won't play them without a different app."}, {"f": ".doc", "b": "The older Microsoft Word document format (Word 97-2003).", "ex": "If someone with very old Word can't open your file, save it as .doc."}, {"f": ".docx", "b": "The current Microsoft Word document format (Word 2007 and newer). Smaller and more modern than .doc.", "ex": "Most resumes you upload to job sites are .docx or .pdf."}, {"f": ".exe", "b": "An executable file: a Windows program that runs or installs software when you open it.", "ex": "Never open an .exe that came in an email you weren't expecting. It could be malware."}, {"f": ".jpg", "b": "JPEG image. A compressed photo format that supports 24-bit color (about 16.7 million colors). It shrinks files by dropping some detail (lossy).", "ex": "Phone photos you text or post are usually .jpg."}, {"f": ".mp3", "b": "A compressed audio file. Small enough to store thousands of songs.", "ex": "Podcasts and downloaded songs are often .mp3."}, {"f": ".mp4", "b": "A very common video file format (video + audio) that plays on almost any device.", "ex": "Videos you record on most phones or download are usually .mp4."}, {"f": ".pdf", "b": "Portable Document Format. Looks exactly the same on any device, so it's great for forms and resumes.", "ex": "Save your resume as a PDF so the formatting doesn't move around."}, {"f": ".swf", "b": "Shockwave Flash file: Adobe Flash animation or game. Flash was shut down at the end of 2020, so browsers no longer play .swf files.", "ex": "Still on the exam: .swf = Adobe Flash."}, {"f": ".tif", "b": "Tagged Image File Format (.tif or .tiff). A high-quality image format, often used for scanning and printing. Files are large.", "ex": "Scanners often offer TIFF for archive-quality copies."}, {"f": ".txt", "b": "A plain text file. Just letters and numbers, no bold, colors, or pictures.", "ex": "Notepad saves .txt files."}, {"f": ".wav", "b": "An uncompressed audio file. High quality but much larger than .mp3.", "ex": "Voice recordings for editing are often .wav."}, {"f": ".xls", "b": "The older Microsoft Excel spreadsheet format (Excel 97-2003).", "ex": "Older budget templates may still be .xls."}, {"f": ".xlsx", "b": "The current Microsoft Excel spreadsheet format (Excel 2007 and newer).", "ex": "A shift schedule or budget made in Excel today is .xlsx."}, {"f": "Keyboard Shortcut", "b": "A combination of keys that runs a command without using the mouse.", "ex": "Ctrl+C copy, Ctrl+V paste, Ctrl+Z undo, Windows+L lock."}, {"f": "Check Box", "b": "A small square option in a menu or form. You can select as many check boxes as you want.", "ex": "'Select all that apply' questions use check boxes."}, {"f": "Drop-Down Menu", "b": "A list that opens when you click it, letting you choose one option.", "ex": "Choosing your state on a job application form."}, {"f": "Radio Button", "b": "A small round option in a group. You can pick only ONE choice from the group.", "ex": "Choosing 'Full-time' OR 'Part-time' on an application."}, {"f": "Mouse", "b": "A handheld pointing device used to move the pointer and click on the screen.", "ex": ""}, {"f": "Permissions", "b": "Settings that control who can view, change, or delete a file or folder, or what an app is allowed to use (camera, location, contacts).", "ex": "Read-only vs. Read/Write; 'Allow this app to use your location?'"}, {"f": "Scanning", "b": "Turning a paper document or photo into a digital file using a scanner or a phone camera app. (Also: an antivirus 'scan' checks files for malware.)", "ex": "Scan your ID and pay stubs to upload for a housing application."}, {"f": "Troubleshooting", "b": "A step-by-step process for figuring out what's wrong and fixing it.", "ex": "Restart, check connections, read the error, search for it, test one change at a time."}, {"f": "IPv4 Address", "b": "An address written as four decimal numbers from 0 to 255, separated by dots.", "ex": "Example: 192.168.1.25"}, {"f": "IPv6 Address", "b": "An address written as eight groups of four hexadecimal digits (0-9, a-f), separated by colons. Groups of zeros can be shortened with ::.", "ex": "Example: 2001:0db8:85a3:0000:0000:8a2e:0370:7334"}, {"f": "Plug-in", "b": "A small piece of software that adds a feature to an application, like a browser.", "ex": "Bonus term"}, {"f": "Clipboard", "b": "Temporary holding spot for what you copy or cut.", "ex": "Ctrl+C puts it there, Ctrl+V pastes it."}, {"f": "Quick Access Toolbar", "b": "Small customizable toolbar in Office apps (above/below the ribbon).", "ex": "Add Spelling so it's one click."}, {"f": "Task Manager", "b": "Shows running apps and lets you end frozen ones (Ctrl+Shift+Esc).", "ex": "Ending a 'Not responding' browser."}, {"f": "File path", "b": "The address of a file, e.g. C:\\Users\\Ana\\Documents\\Resume.docx.", "ex": "Typing it into File Explorer's address bar."}, {"f": "Repair (program)", "b": "Fixes a program's broken files without removing your settings.", "ex": "Office acting weird? Quick Repair first."}, {"f": "Windows Update", "b": "Downloads security fixes and features for Windows.", "ex": "Settings › Update & Security › Check for updates."}, {"f": "NTFS permissions", "b": "Allow/Deny rules on files: Full control, Modify, Read & execute, List folder contents, Read, Write.", "ex": "Deny Write = they can look but not change."}], "mission": ["Finish this level's Learn cards and score 80%+ on the Quest quiz here.", "GMetrix › Computing Fundamentals (Office 2016) › Computer Software Architecture › Training Mode. Use the hints and read every explanation. Retake until you hit 80%+.", "GMetrix › Computer Software Architecture › Testing Mode (timed, no help). Pass with 80%+ (stretch goal: 85%) before you move on.", "Missed some? Open the GMetrix Study Guide for this topic, redo the matching Quest sims and Power-Ups, then retest."]}, {"id": "backup", "n": 4, "name": "Backup & Restore", "icon": "💾", "gm": "Backup & Restore", "od": "4", "tagline": "Phones get lost. Drives die. Ransomware happens. Backups save the day.", "lessons": [{"t": "Why back up?", "b": "A backup is an extra copy kept somewhere else. You need it because hardware fails, phones get lost or stolen, files get deleted by accident, and <b>ransomware<\/b> locks files.", "od": ["4.1.1"], "ex": "Years of family photos on one phone = one drop from gone.", "today": null}, {"t": "Where backups can live", "b": "<ul><li><b>Cloud<\/b> (OneDrive, Google, iCloud): off-site, reach it anywhere. Needs Internet; more space costs money.<\/li><li><b>Network share<\/b>: central for an office. Needs the network, and it's not off-site.<\/li><li><b>Portable hard drive<\/b>: big and cheap. Can be lost, dropped, or fail.<\/li><li><b>USB flash drive<\/b>: tiny and handy. Small capacity, easy to lose.<\/li><li><b>CD/DVD<\/b>: cheap, but small, slow, and outdated.<\/li><li><b>Same computer<\/b>: fast, but if the PC dies, the backup dies too.<\/li><\/ul>", "od": ["4.1.2", "4.1.3"], "ex": null, "today": null}, {"t": "The 3-2-1 rule", "b": "Keep <b>3<\/b> copies, on <b>2<\/b> different types of storage, with <b>1<\/b> off-site (like the cloud). Automatic and regular beats 'when I remember.'", "od": ["4.1.2"], "ex": null, "today": null}, {"t": "Backup tools", "b": "Windows 10 has <b>File History<\/b> (personal files, automatic, to an external or network drive) and <b>Backup and Restore (Windows 7)<\/b> in Control Panel (scheduled backups and system images). OneDrive can back up your Desktop, Documents, and Pictures. Phones: <b>iCloud Backup<\/b> / <b>Google One backup<\/b>.", "od": ["4.2.1"], "ex": null, "today": null}, {"t": "Scheduled backups (Windows Backup)", "b": "<b>Control Panel › System and Security › Backup and Restore (Windows 7) › Set up backup<\/b> → choose the drive → 'Let Windows choose' or 'Let me choose' → <b>Change schedule<\/b> (e.g., Weekly, Sunday, 7 PM) → <b>Save settings and run backup<\/b>.", "od": ["4.2.2"], "ex": null, "today": null}, {"t": "File History", "b": "<b>Settings › Update & Security › Backup › Add a drive<\/b> → pick the drive → <b>Automatically back up my files<\/b> = On. <b>More options<\/b>: how often, and which folders. Restore: <b>More options › Restore files from a current backup<\/b>.", "od": ["4.2.3"], "ex": null, "today": "Windows 11: File History is in Control Panel; the new 'Windows Backup' app backs up to OneDrive."}, {"t": "System Restore points", "b": "<b>System Restore<\/b> rolls Windows <b>system settings, drivers, and programs<\/b> back to an earlier <b>restore point<\/b>. It doesn't touch your personal files.<br>Create one: search <b>Create a restore point<\/b> › System Protection tab › <b>Create<\/b> › name it.<br>Restore: same tab › <b>System Restore<\/b> › Next › pick a point › Finish.", "od": ["4.3.1", "4.3.2", "4.3.3"], "ex": "Make a restore point before installing a sketchy driver.", "today": null}, {"t": "Factory reset", "b": "Resets a device to how it came from the factory. <b>PC:<\/b> Settings › Update & Security › Recovery › <b>Reset this PC<\/b> → <b>Keep my files<\/b> (removes apps and settings) or <b>Remove everything<\/b> (full wipe). <b>iPhone:<\/b> Settings › General › Transfer or Reset › Erase All Content and Settings. <b>Android:<\/b> Settings › System › Reset options. <b>Back up first!<\/b>", "od": ["4.3.4"], "ex": "Selling or donating a phone? Back up, sign out of iCloud/Google, then reset.", "today": null}, {"t": "Reformatting a drive", "b": "Formatting <b>erases everything<\/b> on a drive and sets up a fresh file system (NTFS, exFAT, FAT32). Flash drive: File Explorer › This PC › right-click the USB drive › <b>Format<\/b> › choose a file system and volume label › Quick Format › <b>Start<\/b> › OK to the warning.", "od": ["4.3.5", "4.3.6"], "ex": null, "today": null}, {"t": "⚡ Power-Up 1: GMetrix focus", "b": "<ul><li><b>Restoring deleted files from a backup<\/b>: If you deleted photos, restore them from your backup (File History › Restore, or your cloud's recycle bin/version history).<\/li><li><b>Downsides of local-only backups<\/b>: A backup kept only at home can be stolen or destroyed with the PC, and you can't reach it while traveling.<\/li><li><b>Incremental vs. full backups<\/b>: Full = copies everything (slow to create, fast to restore). Incremental = copies only what changed since the last backup (fast to create, slower to restore because you need the full backup + every increment).<\/li><li><b>External hard drive facts<\/b>: External drives are cheap, high-capacity, and portable, but they can be lost, dropped, or fail. Keep one copy off-site too.<\/li><\/ul>", "od": ["4.1.1", "4.1.2", "4.1.3", "4.2.3"], "ex": null, "today": null, "gm": ["BR1", "BR2", "BR3", "BR4"], "power": true}, {"t": "⚡ Power-Up 2: GMetrix focus", "b": "<ul><li><b>Best backup combo<\/b>: A strong plan pairs a cloud service (like OneDrive) with an external hard drive: local and off-site.<\/li><li><b>What to back up<\/b>: Always back up personal data files (documents, photos, videos). Apps can be reinstalled; your files can't.<\/li><li><b>Cloud backup limits<\/b>: Online backups need Internet, and big files take a long time to upload or restore over a slow connection.<\/li><li><b>System Restore to the latest restore point<\/b>: Right-click Start › System › System protection › System Restore › Next › pick the newest point › Next › Finish.<\/li><\/ul>", "od": ["4.1.1", "4.1.2", "4.1.3", "4.3.3", "6.1.2"], "ex": null, "today": null, "gm": ["BR5", "BR6", "BR7", "BR8"], "power": true}, {"t": "⚡ Power-Up 3: GMetrix focus", "b": "<ul><li><b>Restoring an iPhone<\/b>: Restore an iPhone from an iCloud backup (during setup) or from a computer backup (iTunes, now the Apple Devices app, on Windows; Finder on Mac).<\/li><li><b>System Restore facts<\/b>: System Restore rolls back system files, settings, drivers, and programs to a restore point. It doesn't delete personal files, and restore points are created automatically before big changes or manually.<\/li><li><b>Reasons to back up<\/b>: Viruses/ransomware, drive failure, theft, accidents.<\/li><li><b>What makes a backup secure<\/b>: Redundant (more than one copy) and off-site (somewhere else, like the cloud).<\/li><\/ul>", "od": ["4.1.1", "4.1.2", "4.2.1", "4.3.1", "4.3.4"], "ex": null, "today": null, "gm": ["BR9", "BR10", "BR11", "BR12"], "power": true}, {"t": "⚡ Power-Up 4: GMetrix focus", "b": "<ul><li><b>System Restore step order<\/b>: Control Panel › System › System Protection tab › System Restore… › choose a point › Finish.<\/li><\/ul>", "od": ["4.3.3"], "ex": null, "today": null, "g copies only changes. A restore needs the full backup plus every increment.", "od": ["4.1.2"], "gm": ["BR3"]}, {"q": "Which backup type takes longest to create but restores fastest?", "c": ["Full", "Incremental", "Differential-lite", "Cache"], "a": 0, "why": "A full backup has everything in one set.", "od": ["4.1.2"], "gm": ["BR3"]}, {"q": "Your only backup is a drive next to your PC. The biggest risk?", "c": ["A theft or fire takes both, and you can't reach it while traveling", "It's too fast", "It uses Internet", "It encrypts files"], "a": 0, "why": "Keep one copy off-site.", "od": ["4.1.3"], "gm": ["BR2", "BR12"]}, {"q": "Which pair makes the strongest home backup plan?", "c": ["OneDrive + an external hard drive", "Two folders on the same C: drive", "A sticky note + a DVD", "Email drafts"], "a": 0, "why": "Local + off-site = redundant.", "od": ["4.1.2"], "gm": ["BR5", "BR12"]}, {"q": "Which files matter MOST to back up?", "c": ["Personal documents, photos, and videos", "Windows system fonts", "Temporary internet files", "Program installers you can re-download"], "a": 0, "why": "Your data can't be re-downloaded.", "od": ["4.1.1"], "gm": ["BR6"]}, {"q": "A downside of cloud backup?", "c": ["Needs Internet, and big files upload slowly", "It's never off-site", "It can't hold photos", "It requires a DVD"], "a": 0, "why": "Speed depends on your connection.", "od": ["4.1.3"], "gm": ["BR7"]}, {"q": "How do you bring an iPhone's data back after a reset?", "c": ["Restore from an iCloud or computer backup", "Reinstall Windows", "Format the SIM", "Use System Restore"], "a": 0, "why": "Choose the backup during setup.", "od": ["4.3.4"], "gm": ["BR9"]}, {"q": "Correct order to reach System Restore?", "c": ["Control Panel › System › System Protection › System Restore", "Settings › Apps › Restore", "Task Manager › Restore", "File Explorer › Restore"], "a": 0, "why": "Or right-click Start › System › System protection.", "od": ["4.3.3"], "gm": ["BR13", "BR8"]}], "cards": [{"f": "Backup", "b": "An extra copy of your files kept somewhere else (external drive or cloud) so you can restore them if the originals are lost.", "ex": "Bonus term"}, {"f": "Full backup", "b": "Copies everything. Slowest to make, fastest to restore.", "ex": "A weekly full backup."}, {"f": "Incremental backup", "b": "Copies only what changed since the last backup. Fast to make, slower to restore.", "ex": "Nightly incrementals after a weekly full."}, {"f": "Restore point", "b": "A snapshot of Windows system settings you can roll back to. Doesn't touch personal files.", "ex": "Made automatically before installing drivers."}, {"f": "System Restore", "b": "Rolls Windows back to a restore point.", "ex": "Fix a bad driver install."}, {"f": "File History", "b": "Windows 10 tool that keeps copies of your files on another drive.", "ex": "Restore last Tuesday's version of an essay."}, {"f": "Reset this PC", "b": "Reinstalls Windows. Choose Keep my files or Remove everything.", "ex": "Last resort before selling a PC."}, {"f": "Off-site backup", "b": "A copy stored somewhere else (cloud or another building).", "ex": "Survives a fire or burglary."}], "mission": ["Finish this level's Learn cards and score 80%+ on the Quest quiz here.", "GMetrix › Computing Fundamentals (Office 2016) › Backup & Restore › Training Mode. Use the hints and read every explanation. Retake until you hit 80%+.", "GMetrix › Backup & Restore › Testing Mode (timed, no help). Pass with 80%+ (stretch goal: 85%) before you move on.", "Missed some? Open the GMetrix Study Guide for this topic, redo the matching Quest sims and Power-Ups, then retest."]}, {"id": "sharing", "n": 5, "name": "File Sharing", "icon": "📤", "gm": "File Sharing", "od": "5", "tagline": "Get the right file to the right person, safely.", "lessons": [{"t": "5 ways to move a file", "b": "<b>Email attachment<\/b>, <b>cloud storage<\/b> (OneDrive, Google Drive, Dropbox), <b>network share<\/b> (a shared folder on an office server, like \\\\server\\shared), <b>portable drive<\/b> (USB or external), or <b>CD/DVD<\/b>.", "od": ["5.1.1"], "ex": null, "today": null}, {"t": "Pros and limits", "b": "<b>Email:<\/b> easy, but there's a size limit (around 20-25 MB) and it sends a copy. <b>Cloud:<\/b> big files, a link, live updates; needs Internet and an account. <b>Network share:<\/b> fast inside an office, only on that network. <b>USB:<\/b> no Internet needed, but you have to hand it over and it's easy to lose. <b>CD/DVD:<\/b> small, slow, and most new PCs have no drive.", "od": ["5.1.2"], "ex": null, "today": null}, {"t": "Security check", "b": "<b>Email<\/b> can go to the wrong person and be forwarded. <b>Cloud links<\/b> set to 'Anyone with the link' can spread, so share with specific people instead. <b>USB drives<\/b> get lost and can carry malware. <b>Network shares<\/b> are protected by permissions. Sensitive stuff (SSN, IDs) should go only through secure, approved channels.", "od": ["5.1.3"], "ex": "A caseworker asks for your documents? Use their official upload portal, not a random email.", "today": null}, {"t": "Copying to a share, the cloud, or a USB", "b": "Copy-paste or drag in File Explorer: to a <b>USB drive<\/b> (This PC › USB Drive), to a <b>network share<\/b> (Network, or type \\\\server\\share in the address bar; a 'mapped drive' looks like Z:), or to your <b>OneDrive<\/b> folder (it syncs to the cloud). Copy them back the same way.", "od": ["5.1.4"], "ex": null, "today": null}, {"t": "Make a share link", "b": "Google Drive: right-click › <b>Share<\/b> › <b>Copy link<\/b>. Set General access to <b>Restricted<\/b> (only people added) or <b>Anyone with the link<\/b>. OneDrive: select › <b>Share<\/b> › <b>Copy link<\/b> (choose 'can view' or 'can edit').<br><b>Shared link<\/b> = one file. <b>Shared folder<\/b> = ongoing access to everything inside. <b>Public<\/b> = anyone online.", "od": ["5.1.5"], "ex": null, "today": null}, {"t": "Why zip?", "b": "Zipping (compressing) makes files <b>smaller<\/b> and <b>bundles many into one<\/b> .zip file. It's easier to email or upload, and it keeps folders together.", "od": ["5.2.1"], "ex": null, "today": null}, {"t": "When to zip first", "b": "Zip when sending <b>lots of files<\/b> (10 scanned pages), a <b>whole folder<\/b>, or a file that's <b>too big<\/b> for email. Photos and videos don't shrink much (they're already compressed). Huge files? Share a cloud link instead.", "od": ["5.2.2"], "ex": null, "today": null}, {"t": "Zip & unzip", "b": "<b>Compress:<\/b> right-click the file or folder › <b>Send to › Compressed (zipped) folder<\/b>. <b>Extract:<\/b> right-click the .zip › <b>Extract All<\/b> › Extract. The zipped-folder icon has a zipper.", "od": ["5.2.3"], "ex": null, "today": "Windows 11: right-click › Compress to ZIP file."}, {"t": "⚡ Power-Up 1: GMetrix focus", "b": "<ul><li><b>Attach a file to an email<\/b>: New message › Attach (paperclip) › browse › select › Send.<\/li><li><b>Extract a zipped folder<\/b>: Right-click the .zip › Extract All › choose destination › Extract.<\/li><li><b>Share a folder with the Homegroup (view and edit)<\/b>: Right-click folder › Share with › Homegroup (view and edit). (Removed in later Windows 10 versions.)<\/li><li><b>Compress a folder<\/b>: Right-click › Send to › Compressed (zipped) folder.<\/li><\/ul>", "od": ["5.1.1", "5.1.4", "5.2.3"], "ex": null, "today": null, "gm": ["FS1", "FS2", "FS3", "FS4"], "power": true}, {"t": "⚡ Power-Up 2: GMetrix focus", "b": "<ul><li><b>Huge files → cloud link<\/b>: Files too big for email go by cloud link (OneDrive, Google Drive, Dropbox).<\/li><li><b>Gmail attachment limit<\/b>: Gmail attachments max out at 25 MB. Bigger files get sent as a Google Drive link.<\/li><li><b>Compress before emailing<\/b>: Zipping many files makes one smaller attachment.<\/li><li><b>Zip keeps sets organized<\/b>: A zip keeps a group of files (and folders) together as one package.<\/li><\/ul>", "od": ["5.1.2", "5.1.5", "5.2.1", "5.2.2"], "ex": null, "today": null, "gm": ["FS5", "FS6", "FS7", "FS8"], "power": true}, {"t": "⚡ Power-Up 3: GMetrix focus", "b": "<ul><li><b>Sharing with coworkers via Dropbox<\/b>: A shared Dropbox (or OneDrive/Drive) folder gives a team the same files.<\/li><li><b>90 MB file to a coworker<\/b>: Too big for email, so use a network share or a cloud link.<\/li><li><b>Very large files need compression or another method<\/b>: Compression helps very large transfers; huge ones still need a link or share.<\/li><li><b>Compression isn't encryption<\/b>: Zipping makes files smaller. It doesn't encrypt (secure) them, and it isn't indexing.<\/li><\/ul>", "od": ["5.1.1", "5.1.2", "5.2.1", "5.2.2", "6.5.2"], "ex": null, "today": null, "gm": ["FS9", "FS10", "FS11", "FS12"], "power": true}, {"t": "⚡ Power-Up 4: GMetrix focus", "b": "<ul><li><b>Extract before editing<\/b>: Open zipped files after extracting them. Editing inside the zip doesn't save properly.<\/li><\/ul>", "od": ["5.2.3"], "ex": null, "today": null, "gm": ["FS13"], "power": true}], "sims": [{"title": "Zip and email your scans", "od": ["5.2.3", "5.1.1"], "prompt": "Compress the Scans folder and email Scans.zip to hr@learnkey.com.", "steps": [{"screen": "Desktop › Scans (right-click)", "q": "Choose…", "opts": ["Send to", "Rename", "Delete", "Pin to Start"], "a": 0, "hint": "Send to."}, {"screen": "Send to", "q": "Pick…", "opts": ["Compressed (zipped) folder", "Desktop (create shortcut)", "Mail recipient"], "a": 0, "hint": "Compressed (zipped) folder."}, {"screen": "Mail", "q": "Start a…", "opts": ["New mail", "Reply", "Delete"], "a": 0, "hint": "New mail."}, {"type": "input", "screen": "New message › To", "q": "Recipient:", "label": "To", "a": "hr@learnkey.com", "hint": "Type hr@learnkey.com"}, {"screen": "New message", "q": "Click…", "opts": ["Attach (paperclip)", "Format text", "Discard"], "a": 0, "hint": "Attach."}, {"screen": "Choose file", "q": "Pick…", "opts": ["Scans.zip", "Scans (folder)", "Notes.txt"], "a": 0, "hint": "The .zip file."}], "gm": null,  to Send It", "od": ["5.1.1", "5.1.2"], "pairs": [["Email attachment", "Small file to one person"], ["Cloud share link", "Big file or live document"], ["Network share", "Coworkers on the office network"], ["USB flash drive", "No Internet, hand it over in person"], ["Zip file", "Many files bundled into one"], ["Shared folder", "Ongoing access to everything inside"]]}, {"type": "sort", "title": "Zip it first?", "od": ["5.2.2"], "bins": ["Zip it 🗜️", "No need"], "items": [["12 scanned pages to email", 0, "Bundle them into one attachment."], ["One small Word doc", 1, "Just attach it."], ["A whole project folder", 0, "Zip keeps the folder together."], ["A 2 GB video", 1, "Videos barely shrink. Use a cloud link."], ["30 class photos to upload as one file", 0, "One .zip is easier than 30 uploads."]]}], "quiz": [{"q": "Why zip a folder before emailing?", "c": ["Smaller size, many files as one attachment", "Adds a virus scan", "Makes it read-only", "Turns it into a PDF"], "a": 0, "why": "Compression shrinks and bundles.", "od": ["5.2.1", "5.2.2"], "gm": []}, {"q": "How do you compress a folder in Windows 10?", "c": ["Right-click › Send to › Compressed (zipped) folder", "Right-click › Rename", "Ctrl+P", "Settings › Apps"], "a": 0, "why": "Then Extract All to unzip.", "od": ["5.2.3"], "gm": []}, {"q": "A typical email attachment limit is about…", "c": ["20-25 MB", "2 TB", "1 KB", "Unlimited"], "a": 0, "why": "Bigger files → cloud link.", "od": ["5.1.2"], "gm": []}, {"q": "Which option works with NO Internet?", "c": ["USB flash drive", "Cloud link", "Email", "Google Docs"], "a": 0, "why": "A portable drive is physical.", "od": ["5.1.1", "5.1.2"], "gm": []}, {"q": "Biggest risk of an 'Anyone with the link' share?", "c": ["The link can be forwarded to strangers", "It deletes the file", "It zips the file", "It costs money"], "a": 0, "why": "Use Restricted for private files.", "od": ["5.1.3"], "gm": []}, {"q": "A shared folder (vs. a single link) gives people…", "c": ["Ongoing access to everything inside", "A one-time copy", "Admin rights", "Nothing"], "a": 0, "why": "Anything added later is shared too.", "od": ["5.1.5"], "gm": []}, {"q": "How do you reach a network share?", "c": ["Type \\\\server\\share in File Explorer", "Open Paint", "Settings › Display", "Press Win+L"], "a": 0, "why": "Or use a mapped drive like Z:.", "od": ["5.1.4"], "gm": []}, {"q": "Which file barely shrinks when zipped?", "c": ["An .mp4 video", "A folder of Word docs", "Text files", "Spreadsheets"], "a": 0, "why": "Media is already compressed.", "od": ["5.2.2"], "gm": []}, {"q": "Which security risk comes with USB drives?", "c": ["They're easy to lose and can carry malware", "They need Internet", "They auto-share publicly", "They can't hold files"], "a": 0, "why": "Don't plug in a USB stick you found!", "od": ["5.1.3"], "gm": []}, {"q": "Google Drive: right-click › Share › ___ to get a link.", "c": ["Copy link", "Make a copy", "Download", "Rename"], "a": 0, "why": "Copy link.", "od": ["5.1.5"], "gm": []}, {"q": "Gmail's attachment limit is…", "c": ["25 MB", "2 GB", "5 KB", "No limit"], "a": 0, "why": "Bigger files get a Google Drive link.", "od": ["5.1.2"], "gm": ["FS6"]}, {"q": "Best way to send a 90 MB video to a coworker?", "c": ["Network share or cloud link", "Email attachment", "Text message", "Print it"], "a": 0, "why": "Too big for email.", "od": ["5.1.2"], "gm": ["FS10", "FS5"]}, {"q": "Zipping a file also encrypts it. True?", "c": ["False: compression isn't encryption", "True"], "a": 0, "why": "Use real encryption or a password-protected method for security.", "od": ["5.2.1"], "gm": ["FS12"]}, {"q": "Before editing a document that's inside a .zip, you should…", "c": ["Extract it first", "Rename the zip", "Email it", "Delete the zip"], "a": 0, "why": "Extract All, then edit.", "od": ["5.2.3"], "gm": ["FS13"]}, {"q": "Which old Windows 10 feature shared folders with other PCs on a home network?", "c": ["Homegroup", "Task View", "Cortana", "Snap"], "a": 0, "why": "Removed in 2018. Today use Give access to › Specific people, or OneDrive.", "od": ["5.1.1"], "gm": ["FS3"]}, {"q": "A team wants the same files always up to date. Use…", "c": ["A shared Dropbox/OneDrive folder", "USB sticks passed around", "Fax", "CDs"], "a": 0, "why": "A shared cloud folder.", "od": ["5.1.1"], "gm": ["FS9"]}], "cards": [{"f": ".zip", "b": "A compressed archive file that packs one or more files into one smaller file.", "ex": "Zip a folder of 10 scanned pages to email them as one attachment."}, {"f": "Zip File", "b": "A compressed file (.zip) that bundles one or more files into a smaller package for easier sharing or storage. You 'extract' (unzip) it to use the files.", "ex": ""}, {"f": "Compression", "b": "Making files smaller/bundling them (zip). NOT the same as encryption.", "ex": "Zip 12 scans into one attachment."}, {"f": "Extract", "b": "Unpack the files inside a .zip.", "ex": "Right-click › Extract All."}, {"f": "Share link", "b": "A cloud link that lets others view or edit a file.", "ex": "OneDrive › Share › Copy link."}, {"f": "Network share", "b": "A folder on one computer or server that others on the network can open.", "ex": "\\\\SERVER\\Shared\\Forms"}, {"f": "Homegroup", "b": "Old Windows home-network sharing (removed in Win10 1803).", "ex": "Today: Give access to › Specific people or OneDrive."}, {"f": "Attachment limit", "b": "Max email attachment size (Gmail/Outlook ~20–25 MB).", "ex": "Bigger? Send a cloud link."}], "mission": ["Finish this level's Learn cards and score 80%+ on the Quest quiz here.", "GMetrix › Computing Fundamentals (Office 2016) › File Sharing › Training Mode. Use the hints and read every explanation. Retake until you hit 80%+.", "GMetrix › File Sharing › Testing Mode (timed, no help). Pass with 80%+ (stretch goal: 85%) before you move on.", "Missed some? Open the GMetrix Study Guide for this topic, redo the matching Quest sims and Power-Ups, then retest."]}, {"id": "cloud", "n": 6, "name": "Cloud Computing", "icon": "☁️", "gm": "Cloud Computing", "od": "6", "tagline": "Your stuff, anywhere: phone, library PC, laptop.", "lessons": [{"t": "What is 'the cloud'?", "b": "The cloud = <b>someone else's computers (servers)<\/b> that you use over the Internet. <b>Cloud storage<\/b> = your files live there (Google Drive, OneDrive, iCloud, Dropbox). <b>Cloud access<\/b> = using apps and services over the Internet from any device (Gmail, Google Docs, Netflix).", "od": ["6.1.1"], "ex": "Phone falls in the East River? Photos in iCloud or Google Photos survive.", "today": null}, {"t": "What you need", "b": "An <b>Internet connection<\/b>, an <b>account<\/b> (username + password, ideally with 2-step verification), a <b>device with a browser or the app<\/b>, and enough <b>storage space<\/b> in your plan.", "od": ["6.1.2", "6.2.2"], "ex": null, "today": null}, {"t": "Why cloud storage rocks", "b": "Automatic backup, access from anywhere, <b>sync<\/b> across devices, easy sharing, real-time <b>collaboration<\/b> (many people editing one doc, comments, version history), and it frees up space on your device. Mostly free to start; <b>more storage costs money<\/b> (Google: 15 GB free; OneDrive and iCloud: 5 GB free).", "od": ["6.2.1"], "ex": null, "today": null}, {"t": "Upload & download", "b": "<b>Upload<\/b> (device → cloud): drag files into the browser window, or New/Upload › File. <b>Download<\/b> (cloud → device): right-click › Download (it lands in Downloads).", "od": ["6.3.1", "6.3.2"], "ex": null, "today": null}, {"t": "Sync", "b": "Install the sync app (OneDrive is built into Windows; Google Drive for desktop). Files in the synced folder update on <b>every device<\/b> automatically. Phones: turn on photo backup in the Google Photos or iCloud settings.", "od": ["6.3.3"], "ex": "Start your resume at the library, finish it on your phone.", "today": null}, {"t": "Web apps vs. local apps + SaaS", "b": "<b>Web app<\/b>: runs in the browser, no install, always up to date, needs Internet (Google Docs). <b>Local app<\/b>: installed on the device, works offline (Word installed on a PC).<br><b>SaaS<\/b> (Software as a Service): you subscribe, and the company hosts, updates, and stores everything (Microsoft 365, Google Workspace, Zoom, Salesforce).", "od": ["6.4.1"], "ex": null, "today": null}, {"t": "Online office apps", "b": "<b>Google Docs, Sheets, and Slides<\/b> (Google Workspace) and <b>Office 365<\/b> (now called <b>Microsoft 365<\/b>: Word, Excel, and PowerPoint on the web). Perfect for collaboration.", "od": ["6.5.1"], "ex": null, "today": "Both now include AI helpers (Gemini, Copilot). Fun, but not on the GS5 exam."}, {"t": "Cloud storage providers", "b": "<b>Google Drive<\/b>, <b>Microsoft OneDrive<\/b>, <b>Apple iCloud<\/b>, <b>Dropbox<\/b>, plus Box and others.", "od": ["6.5.2"], "ex": null, "today": null}, {"t": "CRM apps", "b": "<b>Customer Relationship Management<\/b> apps are database-driven web apps that track customers, sales, and projects: <b>Salesforce<\/b>, <b>Oracle<\/b>, <b>Workfront<\/b> (now Adobe Workfront). Many NYC nonprofits track clients in Salesforce.", "od": ["6.5.3"], "ex": null, "today": null}, {"t": "LMS & discussion boards", "b": "An <b>LMS<\/b> (Learning Management System) <b>delivers courses, assigns work, and tracks progress<\/b>: Google Classroom, Canvas, Blackboard, Moodle.<br><b>Discussion boards<\/b> (forums) let people post a topic and reply in <b>threads<\/b>, any time. They're common inside an LMS and in community forums.", "od": ["6.5.4", "6.5.5"], "ex": "GMetrix itself is a web-based practice platform your instructor uses to track you.", "today": null}, {"t": "⚡ Power-Up 1: GMetrix focus", "b": "<ul><li><b>SaaS definition<\/b>: Software as a Service: software you use over the Internet; the provider hosts and updates it (usually a subscription).<\/li><li><b>Who makes which cloud<\/b>: OneDrive = Microsoft. iCloud = Apple. Google Drive = Google. Dropbox = Dropbox.<\/li><li><b>Cloud advantages<\/b>: Access anywhere, easy sharing and collaboration, automatic backup and sync.<\/li><li><b>How an LMS helps a school<\/b>: Delivers lessons and assignments online, collects work, and tracks grades and progress in one place.<\/li><\/ul>", "od": ["6.2.1", "6.4.1", "6.5.2", "6.5.4"], "ex": null, "today": null, "gm": ["CC1", "CC2", "CC3", "CC4"], "power": true}, {"t": "⚡ Power-Up 2: GMetrix focus", "b": "<ul><li><b>CRM examples<\/b>: Salesforce, Microsoft Dynamics 365, SAP, Pipedrive, Oracle: all customer-relationship (CRM) apps.<\/li><li><b>Local OneDrive folder syncs<\/b>: Saving a file into the OneDrive folder on your PC automatically syncs it to the cloud and your other devices.<\/li><li><b>Business collaboration in the cloud<\/b>: Co-editing an Excel workbook online at the same time; web-based ERP/business systems everyone can reach.<\/li><li><b>What 'the cloud' is<\/b>: A network of remote servers on the Internet that store data and run apps.<\/li><\/ul>", "od": ["6.1.1", "6.2.1", "6.3.3", "6.5.1", "6.5.3"], "ex": null, "today": null, "gm": ["CC5", "CC6", "CC7", "CC8"], "power": true}, {"t": "⚡ Power-Up 3: GMetrix focus", "b": "<ul><li><b>Create a 'Homework' folder in OneDrive<\/b>: File Explorer › OneDrive › right-click empty space › New › Folder › type Homework › Enter.<\/li><li><b>Everyday cloud examples<\/b>: Uploading a resume to LinkedIn, storing files in Google Drive, and streaming are all cloud services.<\/li><li><b>New folder via right-click<\/b>: Right-click an empty area › New › Folder (the context menu).<\/li><\/ul>", "od": ["3.6.4", "3.8.1", "6.1.1", "6.3.1"], "ex": null, "today": null, "gm": ["CC9", "CC10", "CC11"], "power": true}], "sims": [{"title": "Upload your resume to OneDrive", "od": ["6.3.1"], "prompt": "Upload Resume.docx from Documents to the Job Search folder in OneDrive.", "steps": [{"screen": "Browser", "q": "Go to…", "opts": ["onedrive.com", "bing.com", "weather.com"], "a": 0, "hint": "onedrive.com (sign in)."}, {"screen": "OneDrive", "q": "Open…", "opts": ["Job Search folder", "Recycle bin", "Photos"], "a": 0, "hint": "The target folder first."}, {"screen": "Job Search", "q": "Click…", "opts": ["Upload › Files", "New › Folder", "Share"], "a": 0, "hint": "Upload › Files."}, {"screen": "Open dialog (Documents)", "q": "Select…", "opts": ["Resume.docx", "Budget.xlsx", "Notes.txt"], "a": 0, "hint": "Resume.docx, then Open."}], "gm": null, "today": null}, {"title": "Share: one editor, one viewer", "od": ["6.2.1", "5.1.5"], "prompt": "Share Budget.xlsx so jsmith@learnkey.com can edit and mjones@learnkey.com can only view.", "steps": [{"screen": "Google Drive › Budget.xlsx (right-click)", "q": "Choose…", "opts": ["Share", "Download", "Rename"], "a": 0, "hint": "Share."}, {"type": "input", "screen": "Add people", "q": "First person:", "label": "Email", "a": "jsmith@learnkey.com", "hint": "jsmith@learnkey.com"}, {"screen": "Role for jsmith", "q": "Choose…", "opts": ["Viewer", "Commenter", "Editor"], "a": 2, "hint": "Edit = Editor. Then Send."}, {"type": "input", "screen": "Add people", "q": "Second person:", "label": "Email", "a": "mjones@learnkey.com", "hint": "mjones@learnkey.com"}, {"screen": "Role for mjones", "q": "Choose…", "opts": ["Viewer", "Commenter", "Editor"], "a": 0, "hint": "View only = Viewer. Then Send."}], "gm": null, "today": null}, {"title": "Back up your Desktop with OneDrive sync", "od": ["6.3.3"], "prompt": "Turn on OneDrive backup for the Desktop folder.", "steps": [{"screen": "Taskbar", "q": "Click…", "opts": ["OneDrive cloud icon", "Volume", "Clock"], "a": 0, "hint": "The OneDrive cloud icon."}, {"screen": "OneDrive", "q": "Open…", "opts": ["Help & Settings › Settings", "View online", "Pause syncing"], "a": 0, "hint": "Settings."}, {"screen": "Settings tabs", "q": "Choose…", "opts": ["Backup", "Account", "Network"], "a": 0, "hint": "Backup tab."}, {"screen": "Backup", "q": "Click…", "opts": ["Manage backup", "Upload only"], "a": 0, "hint": "Manage backup."}, {"screen": "Manage folder backup", "q": "Turn on Desktop, then…", "opts": ["Start backup", "Cancel"], "a": 0, "hint": "Start backup."}], "gm": null, "today": null}, {"title": "Make a 'Homework' folder in OneDrive", "prompt": "In File Explorer, create a folder named Homework in OneDrive.", "steps": [{"screen": "File Explorer › left pane", "q": "Click…", "opts": ["OneDrive", "This PC", "Network"], "a": 0, "hint": "OneDrive."}, {"screen": "OneDrive (right-click empty space)", "q": "Choose…", "opts": ["New", "View", "Paste"], "a": 0, "hint": "New."}, {"screen": "New ›", "q": "Choose…", "opts": ["Folder", "Shortcut", "Text Document"], "a": 0, "hint": "Folder."}, {"type": "input", "screen": "New folder", "q": "Name it:", "label": "Folder name", "a": "Homework", "hint": "Type Homework and press Enter."}], "od": ["6.3.1"], "gm": "CC9", "today": "Same in Windows 11 (New is at the top-left of the toolbar)."}], "games": [{"type": "match", "title": "What Kind of App?", "od": ["6.5.1", "6.5.2", "6.5.3", "6.5.4"], "pairs": [["Google Drive", "Online storage"], ["Dropbox", "Online storage (another one!)"], ["Salesforce", "Database-driven CRM"], ["Canvas / Google Classroom", "LMS"], ["Google Docs", "Online office app"], ["Microsoft 365", "SaaS office suite"], ["Course discussion board", "Threaded posts & replies"]]}, {"type": "sort", "title": "Web app or Local app?", "od": ["6.4.1"], "bins": ["Web app 🌐", "Local app 💻"], "items": [["Google Docs in Chrome", 0, "Runs in the browser."], ["Word installed from a DVD", 1, "Installed locally."], ["Gmail website", 0, "Browser-based."], ["Notepad", 1, "Built into Windows, runs offline."], ["Canvas LMS", 0, "Web-based."], ["VLC media player installed on your PC", 1, "Local install."]]}], "quiz": [{"q": "Keeping files on a company's remote servers is…", "c": ["Cloud storage", "Local storage", "Firmware", "Cache"], "a": 0, "why": "Google Drive, OneDrive, iCloud, Dropbox.", "od": ["6.1.1"], "gm": []}, {"q": "Which is required to use cloud storage?", "c": ["An Internet connection and an account", "A DVD drive", "A landline", "A VGA cable"], "a": 0, "why": "Plus a device or browser and enough space.", "od": ["6.1.2", "6.2.2"], "gm": []}, {"q": "A benefit of cloud storage:", "c": ["Access from any device", "Works with no Internet ever", "Makes RAM bigger", "Never needs a password"], "a": 0, "why": "Plus backup, sync, and sharing.", "od": ["6.2.1"], "gm": []}, {"q": "Cloud services are mostly free, but you often pay for…", "c": ["Additional storage", "Signing in", "Uploading one file", "Your password"], "a": 0, "why": "Free tiers have limits.", "od": ["6.2.1"], "gm": []}, {"q": "Moving a file from your PC to OneDrive is…", "c": ["Uploading", "Downloading", "Formatting", "Zipping"], "a": 0, "why": "Up to the cloud.", "od": ["6.3.1"], "gm": []}, {"q": "Keeping the same files updated on your phone and laptop is…", "c": ["Syncing", "Hibernating", "Caching", "Scanning"], "a": 0, "why": "Sync apps do this automatically.", "od": ["6.3.3"], "gm": []}, {"q": "Subscription software hosted by the provider is…", "c": ["SaaS", "Firmware", "A driver", "Malware"], "a": 0, "why": "Software as a Service.", "od": ["6.4.1"], "gm": []}, {"q": "Salesforce, Oracle, and Workfront are…", "c": ["Database-driven CRM apps", "Operating systems", "Antivirus", "File types"], "a": 0, "why": "Customer Relationship Management.", "od": ["6.5.3"], "gm": []}, {"q": "Administers, delivers, and tracks eLearning:", "c": ["LMS", "CRM", "VPN", "ISP"], "a": 0, "why": "Learning Management System.", "od": ["6.5.4"], "gm": []}, {"q": "A place where classmates post topics and reply in threads:", "c": ["Discussion board", "Firewall", "Spreadsheet", "Router"], "a": 0, "why": "Also called a forum.", "od": ["6.5.5"], "gm": []}, {"q": "Which is an online office app?", "c": ["Google Sheets", "Dropbox", "Device Manager", "BIOS"], "a": 0, "why": "Dropbox is storage.", "od": ["6.5.1", "6.5.2"], "gm": []}, {"q": "Moving a file from Google Drive to your laptop is…", "c": ["Downloading", "Uploading", "Syncing", "Formatting"], "a": 0, "why": "Down from the cloud.", "od": ["6.3.2"], "gm": []}, {"q": "iCloud is made by…", "c": ["Apple", "Microsoft", "Google", "Dropbox"], "a": 0, "why": "OneDrive = Microsoft.", "od": ["6.5.2"], "gm": ["CC2"]}, {"q": "Which is a CRM app?", "c": ["Microsoft Dynamics 365", "Notepad", "Windows Defender", "VLC"], "a": 0, "why": "Dynamics, SAP, Pipedrive, Salesforce = CRM.", "od": ["6.5.3"], "gm": ["CC5"]}, {"q": "You save a file into the OneDrive folder on your PC. What happens?", "c": ["It syncs to the cloud and your other devices", "It's deleted", "It's zipped", "Nothing"], "a": 0, "why": "The OneDrive folder syncs.", "od": ["6.3.3"], "gm": ["CC6"]}, {"q": "Which is a cloud-collaboration example?", "c": ["Three coworkers editing one Excel workbook online at once", "Printing a memo", "Burning a DVD", "Using a USB stick"], "a": 0, "why": "Real-time co-editing.", "od": ["6.2.1"], "gm": ["CC7"]}, {"q": "Uploading your resume to LinkedIn is an example of…", "c": ["Using a cloud service", "Local storage", "A firewall", "A driver"], "a": 0, "why": "It's stored on LinkedIn's servers.", "od": ["6.1.1"], "gm": ["CC10"]}], "cards": [{"f": "Cloud Access", "b": "Using apps, files, and services over the Internet from any device, instead of from one computer.", "ex": "Open your Google Doc at the library, then finish it on your phone."}, {"f": "Cloud Storage", "b": "Saving files on a company's remote servers (Google Drive, OneDrive, iCloud, Dropbox) instead of only on your own device.", "ex": "If your phone is lost, photos in cloud storage are still safe."}, {"f": "SaaS", "b": "Software as a Service. Software you use over the Internet, usually by subscription. The company hosts it, updates it, and stores the data.", "ex": "Microsoft 365, Google Workspace, Salesforce, Zoom."}, {"f": "LMS", "b": "Learning Management System. Software that delivers online courses, gives assignments and tests, and tracks student progress.", "ex": "Google Classroom, Canvas, Blackboard, Moodle."}, {"f": "Web App", "b": "An app that runs inside a web browser, with nothing to install. Needs an Internet connection (mostly).", "ex": "Gmail, Google Docs, Outlook on the web."}, {"f": "Local App", "b": "An app installed on your device. It runs from your device, often works offline, and uses your device's storage.", "ex": "Microsoft Word installed on a PC."}, {"f": "Server", "b": "A computer or program that accepts requests from other computers (clients) on a network and provides services or data back to them.", "ex": "When you open a website, a web server sends you the page."}, {"f": "Cache", "b": "Copies of web page parts (images, scripts) your browser saves so pages load faster next time.", "ex": "Clearing the cache can fix a page that won't load right."}, {"f": "Browser History", "b": "The list of websites you have visited in a web browser.", "ex": "Clear it after using a library computer."}, {"f": "OneDrive", "b": "Microsoft's cloud storage, built into Windows.", "ex": "Save homework there; open it at the library."}, {"f": "iCloud", "b": "Apple's cloud storage and backup.", "ex": "iPhone photos sync to iCloud."}, {"f": "Sync", "b": "Keep the same files up to date on all devices.", "ex": "Edit on phone, see changes on PC."}, {"f": "CRM", "b": "Customer Relationship Management software.", "ex": "Salesforce, Dynamics 365."}, {"f": "ERP", "b": "Enterprise Resource Planning: runs company-wide operations.", "ex": "SAP."}, {"f": "Discussion board", "b": "An online forum in an LMS for class posts and replies.", "ex": "Canvas/Blackboard Discussions."}], "mission": ["Finish this level's Learn cards and score 80%+ on the Quest quiz here.", "GMetrix › Computing Fundamentals (Office 2016) › Cloud Computing › Training Mode. Use the hints and read every explanation. Retake until you hit 80%+.", "GMetrix › Cloud Computing › Testing Mode (timed, no help). Pass with 80%+ (stretch goal: 85%) before you move on.", "Missed some? Open the GMetrix Study Guide for this topic, redo the matching Quest sims and Power-Ups, then retest."]}, {"id": "security", "n": 7, "name": "Security", "icon": "🛡️", "gm": "Security", "od": "7", "tagline": "Scammers want your info. Let's make you scam-proof.", "lessons": [{"t": "Usernames & passwords", "b": "Don't make your username your full name plus birth year. <b>Strong password:<\/b> 12+ characters, upper + lower + numbers + symbols, no real words or personal info, and <b>different for every account<\/b>. A <b>passphrase<\/b> has all of that but is easy to remember: <i>Bronx!Bagel4Breakfast<\/i>.", "od": ["7.1.1", "7.1.2"], "ex": "Reusing one password everywhere = one leak unlocks everything.", "today": null}, {"t": "Where to keep passwords", "b": "<b>Secure:<\/b> a <b>password manager<\/b> (encrypted, one master password). Apple Passwords, Google Password Manager, Bitwarden. <b>Unsecure:<\/b> a sticky note on the monitor, a 'passwords.txt' file, a note in your phone, emailing it to yourself, sharing it.", "od": ["7.1.3"], "ex": null, "today": null}, {"t": "Account settings", "b": "Change your password, picture, and sign-in options: <b>Settings › Accounts<\/b> (Your info, Sign-in options). Admins set <b>account type/permissions<\/b>: Family & other users › Change account type. Online accounts: add a recovery phone/email and turn on <b>2-step verification<\/b>.", "od": ["7.1.4"], "ex": null, "today": "Passkeys (signing in with your phone's face or fingerprint) are replacing passwords on many sites."}, {"t": "Lock it or log off", "b": "Walking away? <b>Lock<\/b> it with <b>Windows key + L<\/b> (or Ctrl+Alt+Del › Lock). Done on a shared PC? <b>Sign out<\/b> (Start › your account icon › Sign out). That way nobody can use your open accounts or read your stuff.", "od": ["7.1.5", "7.1.6"], "ex": null, "today": null}, {"t": "Meet the threats", "b": "<b>Virus<\/b>: malicious code attached to a file. It spreads when the file runs and can erase, corrupt, or steal data. <b>Trojan<\/b>: pretends to be a useful program. <b>Malware<\/b>: the umbrella term (also ransomware, spyware, worms). <b>Ransomware<\/b> locks your files for payment.", "od": ["7.2.1", "7.2.2"], "ex": null, "today": null}, {"t": "Social engineering & phishing", "b": "Tricking the <b>person<\/b>, not the computer. <b>Phishing<\/b> (email), <b>smishing<\/b> (text), <b>vishing<\/b> (calls). Red flags: urgency ('within 24 hours!'), wrong sender address, a link that doesn't match, asking for an SSN, gift cards, or a 'verification code.' Effects: stolen accounts, money, identity theft.", "od": ["7.2.1", "7.2.2"], "ex": "Fake E-ZPass/toll texts and fake 'Con Ed shutoff' calls hit New Yorkers constantly.", "today": null}, {"t": "Surveillance software", "b": "Software that records activity: <b>keyloggers<\/b>, <b>spyware/stalkerware<\/b>, <b>employer monitoring<\/b>, <b>parental controls<\/b>. Threat: it steals passwords and messages and invades privacy. Assume <b>work and school devices are monitored<\/b>, so keep personal business off them.", "od": ["7.3.1", "7.3.2"], "ex": null, "today": null}, {"t": "Wired vs. wireless security", "b": "<b>Wired<\/b> connections are harder to snoop on (someone needs physical access). <b>Wireless<\/b> signals travel through the air, so use <b>WPA2/WPA3<\/b> with a password. <b>Open/public Wi-Fi<\/b> may be unencrypted or a fake 'evil twin.' Secure connection signs: a password-protected network, <b>https<\/b> and a 🔒 in the browser, or a VPN.", "od": ["7.4.1", "7.4.3"], "ex": null, "today": null}, {"t": "Public computer routine", "b": "Library or job-center PC: use <b>private/incognito<\/b> browsing, <b>don't save passwords<\/b>, then <b>log out of every account<\/b> and <b>clear browsing history, cookies, cache (temp files), saved passwords, and form/autofill data<\/b> (Ctrl+Shift+Delete). Finally, <b>sign out of Windows<\/b>.", "od": ["7.4.2", "7.4.4", "7.4.5", "7.4.6"], "ex": "The next person at that NYPL computer shouldn't land in your Gmail.", "today": null}, {"t": "Antivirus", "b": "Antivirus finds, blocks, and removes malware. Examples: <b>Microsoft Defender<\/b> (built into Windows Security), Norton, McAfee, Bitdefender, Avast. Keep <b>real-time protection on<\/b>, let <b>definitions update automatically<\/b>, and run quick or full scans. Use only one real-time antivirus.", "od": ["7.5.1", "7.5.2", "7.5.3"], "ex": null, "today": "The workbook's 'Windows Defender' app is now called 'Windows Security.'"}, {"t": "Firewalls", "b": "A firewall <b>filters network traffic in and out based on rules<\/b>. <b>Hardware firewall<\/b>: built into a router, protects the whole network. <b>Software firewall<\/b>: on the device (Windows Defender Firewall). Options: allow or block apps, rules for private vs. public networks, and notifications. Block an app and it can't communicate; turn the firewall off and you're exposed.", "od": ["7.6.1", "7.6.2", "7.6.3", "7.6.4"], "ex": null, "today": null}, {"t": "Turn the firewall on/off", "b": "<b>Control Panel › System and Security › Windows Defender Firewall › Turn Windows Defender Firewall on or off<\/b> → choose On/Off for Private and Public → OK. (Or Windows Security › Firewall & network protection.) Keep it <b>on<\/b> unless IT tells you otherwise.", "od": ["7.6.5"], "ex": null, "today": null}, {"t": "Shop online safely", "b": "Look for <b>https://<\/b> and the 🔒 (it means encrypted, NOT that the seller is honest). Check the URL spelling, read reviews and return policies, pay by credit card or a trusted service, and never pay strangers with gift cards, Zelle, or crypto. If it's <b>too good to be true<\/b>, it probably is.", "od": ["7.7.1", "7.7.2"], "ex": null, "today": null}, {"t": "VPNs", "b": "A <b>Virtual Private Network<\/b> makes an <b>encrypted tunnel<\/b> between your device and a VPN server. Purpose: protect your data on public Wi-Fi, and let remote workers securely reach the office network.", "od": ["7.8.1", "7.8.2"], "ex": null, "today": null}, {"t": "⚡ Power-Up 1: GMetrix focus", "b": "<ul><li><b>Strongest password<\/b>: Long, mixed characters, not personal.<\/li><li><b>Unlock a local user account<\/b>: Computer Management › Local Users and Groups › Users › user › Properties › uncheck 'Account is locked out' › OK.<\/li><li><b>Trojan<\/b>: Malware disguised as legit software.<\/li><li><b>Cookie<\/b>: A small file a site stores in your browser to remember you.<\/li><\/ul>", "od": ["3.5.2", "7.1.2", "7.1.4", "7.2.1", "7.4.5"], "ex": null, "today": null, "gm": ["SE1", "SE2", "SE3", "SE4"], "power": true}, {"t": "⚡ Power-Up 2: GMetrix focus", "b": "<ul><li><b>Log out on shared PCs<\/b>: Sign out of social media and email on shared or public computers.<\/li><li><b>HTTPS for purchases<\/b>: Only enter card info on https:// sites.<\/li><li><b>What a VPN needs<\/b>: A VPN client, an Internet connection, and a VPN server; it creates an encrypted tunnel.<\/li><li><b>Switch user without logging off<\/b>: Start › click your account picture › choose the other user (or Ctrl+Alt+Del › Switch user).<\/li><\/ul>", "od": ["7.1.5", "7.4.6", "7.7.2", "7.8.1", "7.8.2"], "ex": null, "today": null, "gm": ["SE5", "SE6", "SE7", "SE8"], "power": true}, {"t": "⚡ Power-Up 3: GMetrix focus", "b": "<ul><li><b>Rootkit, worm, virus<\/b>: Rootkit hides deep and gives attackers control. Worm spreads by itself over networks. Virus attaches to files.<\/li><li><b>Spyware<\/b>: Secretly collects your info and activity.<\/li><li><b>Securing home Wi-Fi<\/b>: A password stops neighbors from using (slowing) your bandwidth and snooping.<\/li><li><b>Antivirus updates<\/b>: Update often, ideally automatically.<\/li><\/ul>", "od": ["7.2.1", "7.3.1", "7.4.1", "7.5.3"], "ex": null, "today": null, "gm": ["SE9", "SE10", "SE11", "SE12"], "power": true}, {"t": "⚡ Power-Up 4: GMetrix focus", "b": "<ul><li><b>Wi-Fi security types<\/b>: WPA2 is far more secure than WEP, WPA, or TKIP (WPA3 is newest).<\/li><li><b>Phishing site signs<\/b>: Misspelled URL, no https, urgent demands, poor grammar, asks for passwords or card numbers.<\/li><li><b>Public Wi-Fi rule<\/b>: Avoid banking and purchases on public Wi-Fi (or use a VPN).<\/li><li><b>Password manager<\/b>: Stores strong unique passwords securely.<\/li><\/ul>", "od": ["7.1.3", "7.2.1", "7.4.1", "7.4.3"], "ex": null, "today": null, "gm": ["SE13", "SE14", "SE15", "SE16"], "power": true}, {"t": "⚡ Power-Up 5: GMetrix focus", "b": "<ul><li><b>Change password and add a hint<\/b>: Settings › Accounts › Sign-in options › Password › Change › current › new + hint › Finish.<\/li><li><b>Windows 10 firewall facts<\/b>: Built in, on by default, separate settings for domain/private/public networks.<\/li><li><b>Secure home network benefits<\/b>: Protects devices and data and keeps bandwidth for you.<\/li><li><b>Safe shopping site signs<\/b>: https + padlock, correct URL, reviews, clear return policy, contact info.<\/li><\/ul>", "od": ["7.1.4", "7.4.1", "7.6.1", "7.6.3", "7.7.1"], "ex": null, "today": null, "gm": ["SE17", "SE18", "SE19", "SE20"], "power": true}, {"t": "⚡ Power-Up 6: GMetrix focus", "b": "<ul><li><b>Switch-user location<\/b>: Start menu › account icon.<\/li><li><b>Turn off the private-network firewall<\/b>: Windows Security › Firewall & network protection › Private network › toggle Firewall Off › Yes.<\/li><\/ul>", "od": ["7.1.5", "7.6.5"], "ex": null, "today": null, "gm": ["SE21", "SE22"], "power": true}], "sims": [{"title": "Run a quick virus scan", "od": ["7.5.3", "7.5.1"], "prompt": "Perform a quick scan with Windows Security.", "steps": [{"screen": "Settings", "q": "Category?", "opts": ["Update & Security", "Privacy", "Apps"], "a": 0, "hint": "Update & Security."}, {"screen": "Update & Security", "q": "Left pane?", "opts": ["Windows Security", "Backup", "Activation"], "a": 0, "hint": "Windows Security."}, {"screen": "Windows Security", "q": "Open…", "opts": ["Virus & threat protection", "Device performance", "Family options"], "a": 0, "hint": "Virus & threat protection."}, {"screen": "Virus & threat protection", "q": "Click…", "opts": ["Quick scan", "Manage settings", "Ransomware protection"], "a": 0, "hint": "Quick scan."}], "gm": null, "today": null}, {"title": "Allow an app on private networks only", "od": ["7.6.3", "7.6.4"], "prompt": "Allow LearnKey Chat through Windows Defender Firewall on private networks only.", "steps": [{"screen": "Control Panel › System and Security", "q": "Open…", "opts": ["Windows Defender Firewall", "Security and Maintenance", "Power Options"], "a": 0, "hint": "Windows Defender Firewall."}, {"screen": "Windows Defender Firewall", "q": "Left pane?", "opts": ["Allow an app or feature through Windows Defender Firewall", "Turn on/off", "Advanced settings"], "a": 0, "hint": "Allow an app or feature."}, {"screen": "Allowed apps", "q": "First click…", "opts": ["Change settings", "OK"], "a": 0, "hint": "Change settings unlocks the list (admin)."}, {"screen": "LearnKey Chat row", "q": "Which boxes?", "opts": ["Private only", "Public only", "Both Private and Public", "Neither"], "a": 0, "hint": "The task says private only."}, {"screen": "Allowed apps", "q": "Finish…", "opts": ["OK", "Cancel"], "a": 0, "hint": "OK."}], "gm": null, "today": null}, {"title": "Turn the firewall back on", "od": ["7.6.5"], "prompt": "Turn on Windows Defender Firewall for both private and public networks.", "steps": [{"screen": "Windows Defender Firewall", "q": "Left pane?", "opts": ["Turn Windows Defender Firewall on or off", "Allow an app", "Restore defaults"], "a": 0, "hint": "Turn … on or off."}, {"screen": "Private network settings", "q": "Choose…", "opts": ["Turn on Windows Defender Firewall", "Turn off (not recommended)"], "a": 0, "hint": "Turn on."}, {"screen": "Public network settings", "q": "Choose…", "opts": ["Turn on Windows Defender Firewall", "Turn off (not recommended)"], "a": 0, "hint": "Turn on, then OK."}], "gm": null, "today": null}, {"title": "Wipe your tracks on a library PC", "od": ["7.4.5", "7.4.4"], "prompt": "In Chrome, delete browsing history, cookies, cached files, saved passwords, and autofill form data for All time.", "steps": [{"screen": "Chrome", "q": "Press…", "opts": ["Ctrl+Shift+Delete", "Ctrl+P", "F5"], "a": 0, "hint": "Opens Delete browsing data."}, {"screen": "Delete browsing data", "q": "Time range?", "opts": ["Last hour", "Last 7 days", "All time"], "a": 2, "hint": "All time."}, {"screen": "Delete browsing data", "q": "Switch to which tab for passwords and form data?", "opts": ["Advanced", "Basic"], "a": 0, "hint": "Advanced shows Passwords and Autofill form data."}, {"screen": "Advanced", "q": "Check…", "opts": ["History, cookies, cached files, passwords, autofill", "Only history", "Nothing"], "a": 0, "hint": "Check them all."}, {"screen": "Delete browsing data", "q": "Click…", "opts": ["Delete data", "Cancel"], "a": 0, "hint": "Done. Now sign out of Windows too."}], "gm": null, "today": null}, {"title": "Unlock a local user account", "prompt": "Unlock the local account Student1.", "steps": [{"screen": "Start (right-click)", "q": "Choose…", "opts": ["Computer Management", "Device Manager", "Settings"], "a": 0, "hint": "Computer Management."}, {"screen": "System Tools", "q": "Expand…", "opts": ["Local Users and Groups", "Task Scheduler", "Event Viewer"], "a": 0, "hint": "Local Users and Groups."}, {"screen": "Local Users and Groups", "q": "Open…", "opts": ["Users", "Groups"], "a": 0, "hint": "Users."}, {"screen": "Student1 (right-click)", "q": "Choose…", "opts": ["Properties", "Delete", "Set Password"], "a": 0, "hint": "Properties."}, {"screen": "General tab", "q": "Uncheck…", "opts": ["Account is locked out", "User must change password at next logon"], "a": 0, "hint": "Account is locked out › OK."}], "od": ["7.1.4", "3.5.2"], "gm": "SE2", "today": "Windows Home editions don't include Local Users and Groups (Pro/Education do)."}, {"title": "Switch user without signing out", "prompt": "Switch to the user Guest without signing out.", "steps": [{"screen": "Start menu", "q": "Click…", "opts": ["Your account picture/icon", "Power", "Settings"], "a": 0, "hint": "Account icon."}, {"screen": "Account menu", "q": "Choose…", "opts": ["Guest", "Sign out", "Lock"], "a": 0, "hint": "Pick the other user's name, not Sign out."}], "od": ["7.1.5"], "gm": "SE8", "today": "Or Ctrl+Alt+Del › Switch user."}, {"title": "Change password + hint", "prompt": "Change your password to C0mput!ng2026 with the hint 'class year'.", "steps": [{"screen": "Settings", "q": "Category?", "opts": ["Accounts", "Privacy", "System"], "a": 0, "hint": "Accounts."}, {"screen": "Accounts", "q": "Left pane?", "opts": ["Sign-in options", "Your info", "Email & accounts"], "a": 0, "hint": "Sign-in options."}, {"screen": "Password", "q": "Click…", "opts": ["Change", "Remove"], "a": 0, "hint": "Change › enter current password › Next."}, {"type": "input", "screen": "New password", "q": "Type the new password:", "label": "New password", "a": "C0mput!ng2026", "hint": "Zero, not O."}, {"type": "input", "screen": "Password hint", "q": "Hint:", "label": "Password hint", "a": "class year", "hint": "Type class year."}, {"screen": "Change your password", "q": "Finish…", "opts": ["Next, then Finish", "Cancel"], "a": 0, "hint": "Next › Finish."}], "od": ["7.1.4"], "gm": "SE17", "today": "Same path in Windows 11."}, {"title": "Turn off the private-network firewall", "prompt": "Turn off Microsoft Defender Firewall for private networks.", "steps": [{"screen": "Windows Security", "q": "Open…", "opts": ["Firewall & network protection", "App & browser control", "Device security"], "a": 0, "hint": "Firewall & network protection."}, {"screen": "Firewall & network protection", "q": "Click…", "opts": ["Private network", "Public network", "Domain network"], "a": 0, "hint": "Private network."}, {"screen": "Private network › Microsoft Defender Firewall", "q": "Set to…", "opts": ["Off", "On"], "a": 0, "hint": "Off."}, {"screen": "User Account Control", "q": "Allow?", "opts": ["Yes", "No"], "a": 0, "hint": "Yes. (In real life, turn it back on!)"}], "od": ["7.6.5"], "gm": "SE22", "today": "Windows 11: same in the Windows Security app."}], "games": [{"type": "scam", "title": "Spot the Scam!", "od": ["7.2.1", "7.2.2", "7.7.1"], "bins": ["🚩 Scam", "✅ Legit"], "items": [["TEXT from +1 (929) 555-0182: 'NYC TOLL NOTICE: Unpaid balance $6.85. Pay within 24 hrs to avoid $50 penalty: ezpass-nyc-tolls.com'", 0, "Urgency + a fake look-alike link. E-ZPass doesn't text random payment links. Go to the official site yourself."], ["EMAIL from no-reply@accounts.google.com: 'New sign-in on Windows. If this was you, no action is needed.' (no link clicked, you check in your Google account settings)", 1, "Legit sender, no demand, and you verified it yourself in your account."], ["CALL: 'This is Microsoft Support. Your PC has a virus. Install this app so we can fix it remotely.'", 0, "Microsoft doesn't cold-call. Remote-access requests = classic vishing."], ["DM: 'Congrats! You won a $500 Visa gift card. Just pay $4.99 shipping with your card.'", 0, "You can't win a contest you didn't enter. Fee-to-claim = scam."], ["JOB OFFER by text: 'Remote assistant, $45/hr, no interview! We'll mail you a check, buy gift cards, send us the codes.'", 0, "Fake-check + gift-card scam. Real jobs interview you and never ask for gift cards."], ["Your bank's app (opened yourself) shows a notification asking you to review a charge", 1, "You opened the official app yourself. That's the safe way to check."], ["EMAIL: 'Your package is on hold. Confirm your address: usps-redelivery-help.co'", 0, "Fake domain (.co, extra words). USPS uses usps.com."], ["Shopping site: AirPods Pro for $19, http:// (no padlock), site made last week", 0, "Too good to be true, and no https."]]}, {"type": "match", "title": "Threat Lineup", "od": ["7.2.1", "7.3.1", "7.5.1", "7.6.1", "7.8.1"], "pairs": [["Virus", "Spreads when an infected file runs"], ["Trojan horse", "Disguised as a useful program"], ["Ransomware", "Locks files and demands payment"], ["Phishing", "Fake messages that steal info"], ["Keylogger", "Surveillance that records typing"], ["Firewall", "Filters network traffic by rules"], ["Antivirus", "Finds and removes malware"], ["VPN", "Encrypted tunnel over a network"]]}], "quiz": [{"q": "Strongest password?", "c": ["password123", "Jmal2009", "Bronx!Bagel4Breakfast", "qwerty"], "a": 2, "why": "Long + mixed + not personal.", "od": ["7.1.2"], "gm": []}, {"q": "Most secure way to store many passwords?", "c": ["A password manager", "A sticky note on the monitor", "passwords.txt on the desktop", "Email them to yourself"], "a": 0, "why": "Encrypted, behind one master password.", "od": ["7.1.3"], "gm": []}, {"q": "Shortcut to lock a Windows PC:", "c": ["Windows key + L", "Ctrl+C", "Alt+F4", "Windows key + D"], "a": 0, "why": "Lock before walking away.", "od": ["7.1.6", "7.1.5"], "gm": []}, {"q": "A program that looks useful but secretly carries malware:", "c": ["Trojan horse", "Firewall", "Driver", "Cookie"], "a": 0, "why": "Like the wooden horse.", "od": ["7.2.1"], "gm": []}, {"q": "A text demanding you pay a toll through a link within 24 hours is…", "c": ["Social engineering (smishing)", "A firewall alert", "A driver update", "Cloud sync"], "a": 0, "why": "Urgency + a link = red flags.", "od": ["7.2.1", "7.2.2"], "gm": []}, {"q": "Software that secretly records keystrokes:", "c": ["Keylogger (surveillance software)", "Router", "LMS", "Codec"], "a": 0, "why": "A type of spyware.", "od": ["7.3.1", "7.3.2"], "gm": []}, {"q": "Why is open café Wi-Fi riskier than a password-protected network?", "c": ["Traffic may be unencrypted, or it's a fake hotspot", "It's slower only", "It blocks https", "It uses more battery"], "a": 0, "why": "Use https or a VPN, and turn off discovery.", "od": ["7.4.1", "7.4.3"], "gm": []}, {"q": "Leaving a library computer, you should log out and clear history, cache, cookies, and…", "c": ["Saved passwords and form data", "Wallpaper", "Fonts", "Printer queue"], "a": 0, "why": "Then sign out of Windows.", "od": ["7.4.2", "7.4.5", "7.4.6"], "gm": []}, {"q": "Why update antivirus definitions?", "c": ["To recognize new threats", "To free RAM", "To change themes", "To speed up printing"], "a": 0, "why": "New malware appears daily.", "od": ["7.5.3"], "gm": []}, {"q": "A firewall built into your router is a…", "c": ["Hardware firewall", "Software firewall", "Antivirus", "VPN"], "a": 0, "why": "Software firewalls run on the device.", "od": ["7.6.2"], "gm": []}, {"q": "If you block an app in the firewall…", "c": ["It can't communicate over the network", "It gets deleted", "It runs faster", "It's backed up"], "a": 0, "why": "Firewall rules control traffic.", "od": ["7.6.4"], "gm": []}, {"q": "Which shows a secure website connection?", "c": ["https:// and a padlock", "http://", "Lots of pop-ups", "A .exe download"], "a": 0, "why": "Encrypted, though not proof the seller is honest.", "od": ["7.7.2"], "gm": []}, {"q": "A VPN is used to…", "c": ["Create an encrypted connection over a network", "Brighten the screen", "Install drivers", "Zip files"], "a": 0, "why": "Great on public Wi-Fi and for remote work.", "od": ["7.8.1", "7.8.2"], "gm": []}, {"q": "Why is 'Jmal1990' a weak username/password combo?", "c": ["It uses personal info that's easy to guess", "It's too long", "It has no letters", "It's encrypted"], "a": 0, "why": "Names and birth years are guessable.", "od": ["7.1.1"], "gm": []}, {"q": "Which is an antivirus program?", "c": ["Microsoft Defender", "Microsoft Paint", "Notepad", "Outlook"], "a": 0, "why": "Defender is built into Windows Security.", "od": ["7.5.2"], "gm": []}, {"q": "Malware that hides deep in the system to give an attacker control is a…", "c": ["Rootkit", "Cookie", "Firewall", "Driver"], "a": 0, "why": "Worms self-spread; viruses attach to files.", "od": ["7.2.1"], "gm": ["SE9"]}, {"q": "Malware that spreads across networks by itself is a…", "c": ["Worm", "Trojan", "Cookie", "Patch"], "a": 0, "why": "No user action needed.", "od": ["7.2.1"], "gm": <script>
(function(){
"use strict";
const D=JSON.parse(document.getElementById('data').textContent);
const KEY='ic3quest_v1';
const RANKS=[[0,'Newbie'],[100,'Button Pusher'],[300,'Settings Explorer'],[600,'Tech Helper'],[1000,'Help Desk Hero'],[1500,'IC3 Legend']];
const BADGES=[].concat(D.levels.map(L=>({id:'lvl_'+L.id,icon:L.icon,name:L.name+' Champ',how:'80%+ on the '+L.name+' quiz'})),[
 {id:'boss',icon:'🐉',name:'Boss Slayer',how:'80%+ in the Boss Battle'},{id:'scam',icon:'🕵️',name:'Scam Buster',how:'Finish Spot the Scam with 7+ right'},
 {id:'sim',icon:'🖱️',name:'Sim Pro',how:'Finish 15 sims'},{id:'cards',icon:'🃏',name:'Card Shark',how:'Flip 40 flashcards'},
 {id:'mission',icon:'🎯',name:'Mission Starter',how:'Check off your first GMetrix mission step'},{id:'streak',icon:'🔥',name:'3-Day Streak',how:'Study 3 days in a row'}]);
let S=load();
function blank(){return {name:'',xp:0,seen:{},quiz:{},qok:{},games:{},sims:{},mission:{},badges:[],flips:0,days:[],boss:0}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return Object.assign(blank(),s)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function $(s,r){return (r||document).querySelector(s)}
function h(html){const d=document.createElement('div');d.innerHTML=html;return d}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
function addXP(n,why){S.xp+=n;save();hdr();toast('+'+n+' XP '+(why||''))}
function once(bucket,key,n,why){S[bucket]=S[bucket]||{};const k=key;if(!S[bucket][k]){S[bucket][k]=1;addXP(n,why);return true}return false}
function badge(id){if(!S.badges.includes(id)){S.badges.push(id);save();const b=BADGES.find(x=>x.id===id);setTimeout(()=>toast('🏅 Badge: '+(b?b.name:id)),1900)}}
function rank(){let r=RANKS[0],nx=null;for(let i=0;i<RANKS.length;i++){if(S.xp>=RANKS[i][0]){r=RANKS[i];nx=RANKS[i+1]||null}}return [r,nx]}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function streak(){const t=today();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-60);save()}
 let n=0,d=new Date();for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(S.days.includes(k)){n++;d.setDate(d.getDate()-1)}else break}
 if(n>=3)badge('streak');return n}
function hdr(){const [r,nx]=rank();$('#xp').textContent=S.xp;$('#rank').textContent='🏆 '+r[1];
 const lo=r[0],hi=nx?nx[0]:r[0]+500;$('#xpfill').style.width=Math.min(100,100*(S.xp-lo)/(hi-lo))+'%';
 $('#who').textContent='👤 '+(S.name||'Student')}
function lvlProg(L){const seen=(S.seen[L.id]||[]).length,sims=Object.keys(S.sims).filter(k=>k.startsWith(L.id+':')).length,
 games=Object.keys(S.games).filter(k=>k.startsWith(L.id+':')).length,m=(S.mission[L.id]||[]).filter(Boolean).length,q=(S.quiz[L.id]||0)>=80?1:0;
 const tot=L.lessons.length+L.sims.length+L.games.length+L.mission.length+1;return Math.round(100*(seen+sims+games+m+q)/tot)}
function nextLevel(){for(const L of D.levels){if((S.quiz[L.id]||0)<80||!((S.mission[L.id]||[])[2]))return L.id}return 'boss'}
// ---------- views
function go(v,arg){window.scrollTo(0,0);streak();if(v==='map')mapView();else if(v==='level')levelView(arg.id,arg.tab||'learn');else if(v==='boss')bossView();else if(v==='badges')badgeView()}
function mapView(){const app=$('#app');app.innerHTML='';const nx=nextLevel();
 if(!S.name){app.appendChild(h(`<div class="card"><h2>👋 Welcome to the Quest!</h2><p>Digital Literacy Class. Seven levels, one boss, and you'll be ready for IC3 Computing Fundamentals. What should we call you?</p>
 <div class="row"><input id="nm" aria-label="Your first name" placeholder="First name" style="font:inherit;padding:.5em;border-radius:10px;border:0;max-width:240px"><button class="primary" id="nmgo">Let's go</button></div></div>`));
 $('#nmgo').onclick=()=>{const v=$('#nm').value.trim();if(v){S.name=v.slice(0,30);save();hdr();mapView()}}}
 const intro=h(`<div class="card"><div class="row"><div class="sp"><h2 style="margin:.2rem 0">🗺️ Level Map${S.name?' · Hi, '+esc(S.name)+'!':''}</h2>
 <div class="muted">Each level = one GMetrix topic test. Learn here, then do Training Mode, then Testing Mode at 80%+. Levels are never locked. ⭐ marks your recommended next stop.</div></div>
 <button id="bdg">🏅 Badges (${S.badges.length}/${BADGES.length})</button><button class="ghost" id="rst">Reset</button></div></div>`);app.appendChild(intro);
 const g=document.createElement('div');g.className='grid';
 D.levels.forEach(L=>{const p=lvlProg(L),b=S.quiz[L.id];const el=h(`<div class="lvl" role="button" tabindex="0" data-id="${L.id}">${nx===L.id?'<span class="next">⭐ NEXT</span>':''}
 <div class="ic">${L.icon}</div><small>LEVEL ${L.n}</small><h3>${esc(L.name)}</h3><small>${esc(L.tagline)}</small>
 <div class="prog"><i style="width:${p}%"></i></div><small>${p}% · best quiz ${b==null?'–':b+'%'} ${S.badges.includes('lvl_'+L.id)?'🏅':''}</small></div>`).firstChild;
 el.onclick=()=>go('level',{id:L.id});el.onkeydown=e=>{if(e.key==='Enter')el.click()};g.appendChild(el)});
 const B=h(`<div class="lvl boss" role="button" tabindex="0">${nx==='boss'?'<span class="next">⭐ NEXT</span>':''}<div class="ic">${D.boss.icon}</div><small>FINAL</small><h3>${esc(D.boss.name)}</h3><small>GMetrix Practice Exams + Quest Boss Battle</small>
 <div class="prog"><i style="width:${S.boss||0}%"></i></div><small>best boss ${S.boss?S.boss+'%':'–'} ${S.badges.includes('boss')?'🏅':''}</small></div>`).firstChild;
 B.onclick=()=>go('boss');B.onkeydown=e=>{if(e.key==='Enter')B.click()};g.appendChild(B);app.appendChild(g);
 app.appendChild(h(`<div class="card muted" style="margin-top:1rem;font-size:.85rem">📌 <b>Today's version:</b> IC3 GS5 was built around Windows 10 and Office 2016. GMetrix still uses those screens, so this Quest teaches them first and adds “Today's version” notes for Windows 11 and Microsoft 365. Progress saves in this browser only (no account, works offline).</div>`));
 $('#bdg').onclick=()=>go('badges');$('#rst').onclick=()=>{if(confirm('Erase ALL your Quest progress on this device?')){S=blank();save();hdr();mapView()}}}
function levelView(id,tab){const L=D.levels.find(x=>x.id===id);const app=$('#app');
 const tabs=[['learn','📖 Learn'],['cards','🃏 Cards'],['sims','🖱️ Sims'],['games','🎮 Games'],['quiz','❓ Quiz'],['mission','🎯 GMetrix Mission']];
 app.innerHTML=`<div class="row"><button class="ghost" id="back">← Map</button><h2 class="sp" style="margin:0">${L.icon} Level ${L.n}: ${esc(L.name)}</h2></div>
 <div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" data-t="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('')}</div><div id="pane"></div>`;
 $('#back').onclick=()=>go('map');app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>levelView(id,b.dataset.t));
 const P=$('#pane');({learn:learn,cards:flash,sims:simList,games:gameList,quiz:quiz,mission:mission})[tab](L,P)}
function learn(L,P,i){i=i||0;const ls=L.lessons[i];S.seen[L.id]=S.seen[L.id]||[];if(!S.seen[L.id].includes(i)){S.seen[L.id].push(i);addXP(5,'lesson')}
 P.innerHTML=`<div class="card lesson"><div class="muted">Card ${i+1} of ${L.lessons.length}</div><h3>${esc(ls.t)}</h3><div>${ls.b}</div>
 ${ls.ex?`<div class="ex">🗽 <b>Real life:</b> ${esc(ls.ex)}</div>`:''}${ls.today?`<div class="today">📌 <b>Today's version:</b> ${esc(ls.today)}</div>`:''}
 <div class="od">Official objective${(ls.od||[]).length>1?'s':''}: ${(ls.od||[]).join(', ')}</div></div>
 <div class="row"><button id="pv" ${i===0?'disabled':''}>← Back</button><span class="sp"></span><button class="primary" id="nx">${i<L.lessons.length-1?'Next →':'Take the quiz →'}</button></div>`;
 $('#pv').onclick=()=>learn(L,P,i-1);$('#nx').onclick=()=>{if(i<L.lessons.length-1)learn(L,P,i+1);else levelView(L.id,'quiz')}}
function flash(L,P){let deck=L.cards.slice(),i=0;
 function draw(){const c=deck[i];P.innerHTML=`<div class="muted" style="text-align:center">Card ${i+1} of ${deck.length}. Tap to flip.</div>
 <div class="flip" id="fc" role="button" tabindex="0" aria-label="Flashcard"><div class="in"><div class="face front">${esc(c.f)}</div><div class="face back"><div>${esc(c.b)}</div>${c.ex?`<em>e.g. ${esc(c.ex)}</em>`:''}</div></div></div>
 <div class="row" style="justify-content:center;margin-top:1rem"><button id="p">←</button><button id="sh">🔀 Shuffle</button><button id="n" class="primary">→</button></div>`;
 const fc=$('#fc');fc.onclick=()=>{fc.classList.toggle('on');S.flips++;save();if(S.flips>=40)badge('cards')};fc.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();fc.click()}};
 $('#p').onclick=()=>{i=(i-1+deck.length)%deck.length;draw()};$('#n').onclick=()=>{i=(i+1)%deck.length;draw()};$('#sh').onclick=()=>{deck=shuffle(deck);i=0;draw()}}draw()}
function simList(L,P){P.innerHTML='<div class="muted" style="margin-bottom:.6rem">Practice clicks like a GMetrix simulation. Wrong clicks show a hint. Each sim also has a written walkthrough.</div>';const g=document.createElement('div');g.className='grid';
