<script>window.JC_GAMES={"types":{"match":"Match","sort":"Sort","tf":"True or false","order":"Put in order","scam":"Spot the scam"},"chapters":[{"n":1,"title":"Operating Systems","icon":"🪟"},{"n":2,"title":"Hardware","icon":"🖥️"},{"n":3,"title":"Networks and Mobile Devices","icon":"📶"},{"n":4,"title":"File Management","icon":"📁"},{"n":5,"title":"Software","icon":"💿"},{"n":6,"title":"Cloud Computing","icon":"☁️"},{"n":7,"title":"Security and Maintenance","icon":"🔒"}],"games":[{"id":"c1_match","ch":1,"type":"match","icon":"🧩","title":"OS Word Match","par":60,"intro":"Tap a word, then tap its meaning.","pairs":[["Operating system","Main program that runs the device"],["Administrator","Account that can change settings for everyone"],["Standard user","Account that changes only its own settings"],["Hibernate","Saves your work to the drive, then turns off"],["Sleep","Low-power pause; wakes up fast"],["Taskbar","Bar at the bottom with your apps"],["Task View","Shows all open windows"],["Open source","Code that anyone can see and change"],["Update","A fix or new feature from the maker"]]},{"id":"c1_sort","ch":1,"type":"sort","icon":"🗂️","title":"Global or Just Me?","par":60,"intro":"Does this setting change the computer for everyone, or only for you?","cats":["🌍 Everyone (global)","🙋 Just me (my profile)"],"items":[["Screen resolution",0,"Resolution is the same for every user on the PC."],["Desktop background",1,"Your wallpaper is part of your profile."],["Date and time",0,"The clock is the same for everyone."],["Theme color",1,"Colors are a personal choice."],["Power plan",0,"Power settings affect the whole computer."],["Start menu pins",1,"Each person pins their own apps."],["Installing a printer",0,"A new printer is for everyone and needs an admin."],["Lock screen picture",1,"Each profile has its own lock screen picture."],["Creating a new user account",0,"Only an administrator can add accounts."],["Mouse pointer size",1,"Pointer size is a personal setting."]]},{"id":"c2_sort","ch":2,"type":"sort","icon":"🖥️","title":"Build-a-PC Sort","par":70,"intro":"Is this part for input, output, or storage?","cats":["⌨️ Input","🖨️ Output","💾 Storage"],"items":[["Keyboard",0,"You type in with it."],["Monitor",1,"It shows you pictures and text."],["SSD",2,"It keeps files when the power is off."],["Microphone",0,"It takes your voice in."],["Printer",1,"It puts your work on paper."],["USB flash drive",2,"A small drive that keeps files."],["Webcam",0,"It takes video in."],["Speakers",1,"They play sound out."],["Hard drive",2,"Spinning disk that keeps files."],["Scanner",0,"It turns paper into a picture file."],["Projector",1,"It shows the screen on a wall."],["Memory card",2,"Small card for camera photos."]]},{"id":"c2_order","ch":2,"type":"order","icon":"📏","title":"Bytes Line-Up","par":30,"intro":"Tap the units from smallest to biggest.","steps":["bit","byte","kilobyte (KB)","megabyte (MB)","gigabyte (GB)","terabyte (TB)"],"done":"Each step is about 1,000 times bigger. A song is a few MB; a movie is a few GB."},{"id":"c3_match","ch":3,"type":"match","icon":"📶","title":"Network Match","par":60,"intro":"Tap a network word, then tap its meaning.","pairs":[["Router","Shares internet with every device at home"],["Modem","Connects your home to the internet company"],["ISP","Company you pay for internet"],["LAN","Network in one home or building"],["WAN","Network over a big area, like the internet"],["IP address","Number that names a device on a network"],["Bandwidth","How much data moves each second"],["Hotspot","Phone sharing its data as Wi-Fi"],["VoIP","Phone calls over the internet"]]},{"id":"c3_tf","ch":3,"type":"tf","icon":"⚡","title":"Network Speed Round","par":50,"intro":"True or false? Answer fast for a time bonus.","items":[["Download speed is usually faster than upload speed.",true,"Most people receive more data than they send."],["A wired Ethernet connection is usually steadier than Wi-Fi.",true,"Cables are not bothered by walls or distance."],["WEP is the best Wi-Fi security today.",false,"WEP is old and weak. Use WPA2 or WPA3."],["192.168.1.5 is an IPv4 address.",true,"IPv4 is four numbers with dots."],["Cable internet is shared with neighbors.",true,"It can slow down at busy times."],["A corded landline phone stops working in a power outage.",false,"The phone line powers a corded phone."],["Two devices on one network can use the same IP address.",false,"Each device needs its own address."],["Mbps measures internet speed.",true,"Megabits per second."],["5 GHz Wi-Fi reaches farther than 2.4 GHz.",false,"2.4 GHz reaches farther; 5 GHz is faster but shorter."],["Roaming can cost extra on a cell plan.",true,"You use another carrier's network."]]},{"id":"c4_sort","ch":4,"type":"sort","icon":"📁","title":"File Type Sort","par":70,"intro":"What kind of file is it? Look at the letters after the dot.","cats":["📄 Document","🖼️ Picture","🎵 Sound or video","📦 Program or zip"],"items":[["Resume.docx",0,"A Word document."],["Beach.jpg",1,"A photo."],["Song.mp3",2,"A music file."],["Setup.exe",3,"A program. Be careful opening it."],["Budget.xlsx",0,"An Excel spreadsheet."],["Logo.png",1,"A picture file."],["Party.mp4",2,"A video file."],["Photos.zip",3,"Many files packed into one."],["Form.pdf",0,"A document that looks the same everywhere."],["Slides.pptx",0,"A PowerPoint slide show."],["Voice.wav",2,"A sound recording."],["Notes.txt",0,"Plain text."]]},{"id":"c4_order","ch":4,"type":"order","icon":"🗜️","title":"Zip It and Send It","par":40,"intro":"Put the steps in order to send 5 photos as one zip file.","steps":["Open File Explorer","Select the 5 photos (Ctrl + click)","Right-click and choose Send to","Choose Compressed (zipped) folder","Name the zip file","Attach the zip file to your email"],"done":"Zipping packs many files into one file, so it is easier to send."},{"id":"c5_tf","ch":5,"type":"tf","icon":"💿","title":"Software Speed Round","par":50,"intro":"True or false? Answer fast for a time bonus.","items":[["Check the system requirements before you install a program.",true,"Make sure your device can run it."],["Deleting a desktop shortcut uninstalls the program.",false,"It only removes the icon. Uninstall in Settings > Apps."],["Try Repair before you reinstall a program that crashes.",true,"Repair is faster and keeps your settings."],["A standard user can install programs for everyone.",false,"That needs an administrator."],["The safest place to get apps is the official app store.",true,"Store apps are checked."],["An SMS message can include a video.",false,"That is MMS. SMS is short text only."],["A subscription means you pay every month or year.",true,"Like Microsoft 365."],["Chat apps like WhatsApp need Wi-Fi or mobile data.",true,"They use the internet."],["A Windows app will install on an iPhone.",false,"Apps are made for one platform."],["UAC asks if an app can make changes to your device.",true,"Say yes only if you trust the app."]]},{"id":"c5_order","ch":5,"type":"order","icon":"📥","title":"Install It Right","par":40,"intro":"Put the steps in order to install a new program safely.","steps":["Check the system requirements","Download from the official site or store","Open the installer","Say Yes to User Account Control","Accept the license agreement (EULA)","Finish, then check for updates"],"done":"Safe installs start with the requirements and an official download."},{"id":"c6_match","ch":6,"type":"match","icon":"☁️","title":"Cloud Match","par":60,"intro":"Tap a cloud word, then tap its meaning.","pairs":[["OneDrive","Microsoft cloud storage"],["iCloud","Apple cloud storage"],["Google Drive","Google cloud storage"],["Upload","Send a file from your device to the cloud"],["Download","Copy a file from the cloud to your device"],["Sync","Keep files the same on every device"],["LMS","Website for online classes and grades"],["CRM","Shared list of customers for a business"],["Can view","People can read but not change"]]},{"id":"c6_sort","ch":6,"type":"sort","icon":"⚖️","title":"Cloud: Good or Watch Out?","par":60,"intro":"Is this a benefit of the cloud, or something to watch out for?","cats":["👍 Benefit","⚠️ Watch out"],"items":[["Open your files on any device",0,"Sign in anywhere."],["You need internet to reach your files",1,"No internet, no online files."],["Files are safe if your laptop breaks",0,"The cloud keeps a copy."],["Free space is limited",1,"More space costs money."],["Easy to share with your team",0,"Send a link."],["You trust a company with your files",1,"Read the privacy rules and use a strong password."],["Edit a document together at the same time",0,"Web apps let many people edit."],["Deleting a synced file deletes it everywhere",1,"Be careful what you delete."],["No need to install apps",0,"Web apps run in a browser."],["Slow internet makes work slow",1,"Big files take time."]]},{"id":"c7_scam","ch":7,"type":"scam","icon":"🎣","title":"Spot the Scam","par":80,"intro":"Read each message. Is it a scam or legit?","items":[["88442 (text message)","Account alert","Your bank account is LOCKED. Click bit.ly/unl0ck in 1 hour or lose your money.",true,"Urgent threat and a strange short link. Call your bank yourself."],["Ms. Rivera (usual school email)","Class tonight","Reminder: class is at 6 PM on Zoom. Same link as always.",false,"Known sender, no request for money or passwords."],["prizes@win-free-phone.top","You WON!","Congratulations! You won a new iPhone. Pay $2 shipping with your card today.",true,"Prize you never entered and a request for card details."],["Unknown number","Package","Your package is waiting. Update your address: pkg-deliv3ry.co",true,"Unknown sender and a fake-looking web address."],["Your pharmacy app","Refill ready","Your refill is ready for pickup at your usual store.",false,"Inside the real app, no link, no request."],["\"Boss\" from a gmail address","Quick favor","I am in a meeting. Buy 5 gift cards now and send me the codes. Do not call.",true,"Gift cards, rush, and \"do not call\" are big red flags."],["The real website (you just asked)","Password reset","Here is the password reset link you requested a minute ago.",false,"You started it, and it comes from the real site."],["Caller: \"Microsoft Support\"","Phone call","Your computer has a virus. Let me control it to fix it.",true,"Microsoft does not call you. Hang up."]]},{"id":"c7_match","ch":7,"type":"match","icon":"🛡️","title":"Malware Match","par":60,"intro":"Tap a threat or tool, then tap what it does.","pairs":[["Virus","Spreads when you open an infected file"],["Worm","Spreads across networks by itself"],["Trojan","Looks useful but opens a back door"],["Spyware","Secretly watches what you do"],["Ransomware","Locks your files and asks for money"],["Adware","Fills your screen with pop-up ads"],["Firewall","Blocks unwanted network traffic"],["Antivirus","Finds and removes malware"],["VPN","Private, encrypted tunnel on public Wi-Fi"]]}]};</script>
<script>(function(){var D=window.JC_GAMES,G=D.games,$=function(s){return document.querySelector(s)},app=$('#app'),QK='ic3quest_v1',T=null,S=null;

 try{localStorage.setItem(QK,JSON.stringify(s))}catch(e){}if(window.JCSync)JCSync.changed('quest');return old}

 window.__games.view='list'}
function hud(){var t=Math.floor((Date.now()-S.t0)/1000);$('#tm').textContent='⏱ '+t+'s';$('#pt').textContent='⭐ '+S.pts;$('#pg').textContent=S.done+' / '+S.total;$('#pb i').style.width=(100*S.done/S.total)+'%'}

 S={g:g,t0:Date.now(),pts:0,done:0,ok:0,total:0,miss:{}};
