<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7fb;color:#14202e;line-height:1.45}

.st{display:inline-block;font-size:.82rem;color:#5a6a7d}.st.on{background:#dcf3e5;color:#11643a;font-weight:700;border-radius:999px;padding:.1em .6em}

@media(max-width:600px){#upd{flex-basis:100%;order:3;margin-left:0}td .on-txt{min-width:140px;max-width:180px}header h1{font-size:1.05rem}main{padding:0 .6rem}.card{padding:.9rem}th,td{padding:.45rem .45rem;font-size:.82rem}}
.tabs[hidden],#keyv[hidden],#app[hidden],#tmv[hidden]{display:none}.tabs{flex-wrap:wrap}.tml{list-style:none;margin:.3rem 0 0;padding:0}.tml li{padding:.45rem 0;border-top:1px solid #e9eef3;display:flex;gap:.6rem;align-items:baseline}.tml li:first-child{border-top:0}.tmg{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1rem}@media(max-width:600px){.tmg{grid-template-columns:1fr}}.tml .k{flex:0 0 6.5em;font-size:.78rem;font-weight:700;color:#0b5c61;text-transform:uppercase;letter-spacing:.03em}.tml a{color:#0f5f66;font-weight:600}.tml .no{color:#7a8796}.tabs{max-width:1200px;margin:1rem auto 0;padding:0 1rem;display:flex;gap:.5rem}.tabs button[aria-selected=true]{background:#1d3557;border-color:#1d3557;color:#fff}
.kf{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end}.kf>div{flex:1 1 180px}.kf input,.kf select{max-width:none}
.ki{border-top:1px solid #e9eef3;padding:.7rem 0;break-inside:avoid}.ki .m{font-size:.78rem;color:#5a6a7d}.ki .q{font-weight:600;margin:.2rem 0}
.ki ol{margin:.2rem 0 .2rem 1.3rem;padding:0;font-size:.9rem}.ki li.ok{font-weight:700;color:#11643a}.ki .a{background:#e3f5ea;border-radius:8px;padding:.35rem .6rem;font-size:.9rem;margin:.25rem 0}.ki .a div::before{content:"\2713  ";color:#11643a}
.ki .w{font-size:.86rem;color:#334}.tagx{display:inline-block;border-radius:999px;padding:0 .5em;font-weight:700;font-size:.72rem;margin-right:.3em}.tagx.quest{background:#e8e4ff;color:#3b2a8a}.tagx.lab{background:#d9f0f1;color:#0b5c61}
@media print{header,.tabs,.kf,#kp,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;padding:0}main{margin:0;max-width:none}body.keymode #app,body.keymode #tmv{display:none!important}body:not(.keymode) #keyv{display:none!important}.ki{font-size:10pt}}
</style></head><body>
<header><div><h1>📊 Teacher Dashboard</h1><small>Jmal C's Digital Literacy Class</small></div><span class="sp"></span><span id="who" class="small"></span><a href="./" class="small">Class page</a></header>
<nav class="tabs" id="tabs" hidden role="tablist"><button role="tab" id="t1" aria-selected="true">Class</button><button role="tab" id="t2" aria-selected="false">🔑 Answer Key</button><button role="tab" id="t3" aria-selected="false">📚 Ch 1-7 Teaching Materials</button></nav>
<main id="keyv" hidden></main>
<main id="tmv" hidden></main>
<main id="app"><div class="card"><p class="muted">Loading...</p></div></main>
<script>
(function(){"use strict";
var M=window.JC_META||{ranks:[[0,'Newbie']],levels:[],badges:[],tests:[],domains:{}};
var $=function(s,r){return (r||document).querySelector(s)};
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var app=$('#app'),ROWS=[],SORT={k:'status',d:1},OPEN={},DOMAVG={},CLASS='',LOADED=0,LOADING=false,REFRESH_ERR=false;
var ACTIVE_MS=120000,REFRESH_MS=window.JC_REFRESH_MS||30000;
function ago(ms){var m=Math.floor(ms/6e4);if(m<1)return 'just now';if(m<60)return m+' min ago';var h=Math.floor(m/60);if(h<24)return h+(h===1?' hour ago':' hours ago');var d=Math.floor(h/24);return d+(d===1?' day ago':' days ago')}
function age(r){return r.seen?Math.max(0,Date.now()-new Date(r.seen)):null}
function isActive(r){var a=age(r);return a!=null&&a<ACTIVE_MS}
function statusText(r){var a=age(r);return a==null?'Not active yet':a<ACTIVE_MS?'Active now':'Last seen '+ago(a)}
function card(h){app.innerHTML='<div class="card">'+h+'</div>'}
function pct(v){if(v==null||isNaN(v))return '<span class="na">–</span>';var c=v>=80?'hi':v>=60?'mid':'lo';return '<span class="pct '+c+'">'+Math.round(v)+'%</span>'}
function when(d){if(!d)return '–';var t=new Date(d),days=Math.floor((Date.now()-t)/864e5);return days<=0?'Today':days===1?'Yesterday':days<7?days+' days ago':t.toLocaleDateString()}
function rankOf(xp){var r=M.ranks[0];M.ranks.forEach(function(x){if(xp>=x[0])r=x});return r[1]}
function avg(a){return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null}
if(!JCSync.enabled){card('<h2>Cloud accounts are not turned on yet</h2><p>Student sign-in and this dashboard start working after the Supabase setup. Follow the steps in <b>supabase/SETUP.md</b>, then paste your Project URL and anon key into <b>config.js</b>.</p><p class="muted small">Until then, students can still use both apps. Their progress saves on their own device.</p>');return}
function signInView(msg){
 $('#who').textContent='';
 card('<h2>Teacher sign in</h2><p class="muted small">Use the account you made in the apps, after it has been switched to a teacher account (SETUP.md step 9).</p><form id="f"><label for="em">Email</label><input id="em" type="email" autocomplete="email"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="row" style="margin-top:1rem"><button class="pri" id="go">Sign in</button></div>'+(msg?'<div class="err">'+esc(msg)+'</div>':'')+'</form>');
 $('#f').onsubmit=function(e){e.preventDefault();var b=$('#go');b.disabled=true;b.textContent='Signing in...';JCSync.signIn($('#em').value,$('#pw').value).then(function(r){if(!r||!r.ok)signInView((r&&r.error)||'Sign in failed.');else route()})};
 $('#em').focus()}
function route(){
 var u=JCSync.user(),p=JCSync.profile();
 if(!JCSync.client()){card('<h2>Can\'t reach the cloud right now</h2><p>Check your internet connection, then reload this page.</p><button class="pri" onclick="location.reload()">Reload</button>');return}
 if(!u)return signInView();
 $('#who').innerHTML=esc((p&&p.display_name)||u.email)+' · <button id="so" style="padding:.2em .6em;font-size:.8rem">Sign out</button>';$('#so').onclick=function(){JCSync.signOut()};
 if(!p||p.role!=='teacher'){card('<h2>This is not a teacher account yet</h2><p>You are signed in as <b>'+esc(u.email)+'</b>. To see your class, run the "make me a teacher" line from <b>SETUP.md</b> (step 9) in the Supabase SQL editor, then reload this page.</p><button class="pri" onclick="location.reload()">Reload</button>');return}
 tabs();
 if(!p.class_code){card('<h2>Your account has no class code</h2><p>Add one in the Supabase Table Editor (profiles table, class_code column), using the same code your students type when they sign up.</p>');return}
 CLASS=p.class_code;load()}
// Supabase returns at most 1000 rows per request, so read every table page by page until a page comes back empty.
function every(mk){var out=[],P=1000;function step(i){if(i>=100*P)return Promise.resolve({data:out,error:null});return mk().range(i,i+P-1).then(function(r){if(r.error)return r;var d=r.data||[];if(!d.length)return {data:out,error:null};out=out.concat(d);return step(i+d.length)})}return step(0)}
function load(silent){
 if(LOADING)return;LOADING=true;
 if(!silent||!LOADED)card('<p class="muted">Loading class '+esc(CLASS)+'...</p>');
 var c=JCSync.client(),me=JCSync.user().id;
 Promise.all([every(function(){return c.from('profiles').select('id,display_name,class_code,role,created_at').order('id')}),every(function(){return c.from('progress').select('user_id,app,xp,best_scores,data,updated_at').order('user_id').order('app')}),every(function(){return c.from('attempts').select('id,user_id,test_id,mode,score,total,by_domain,taken_at').order('taken_at',{ascending:true}).order('id')})]).then(function(r){
  for(var i=0;i<3;i++)if(r[i].error)throw r[i].error;
  build(r[0].data.filter(function(x){return x.id!==me&&x.class_code===CLASS}),r[1].data||[],r[2].data||[]);LOADED=Date.now();REFRESH_ERR=false;LOADING=false;render()}).catch(function(e){LOADING=false;if(silent&&LOADED){REFRESH_ERR=true;updNote();return}card('<h2>Could not load your class</h2><p class="muted">'+esc(e&&e.message||e)+'</p><button class="pri" id="rt">Try again</button>');$('#rt').onclick=function(){load()}})}
function updNote(){var n=$('#upd');if(!n)return;n.textContent=REFRESH_ERR?"Couldn't refresh. Trying again soon.":'Updated '+ago(Date.now()-LOADED);n.classList.toggle('bad',REFRESH_ERR)}
setInterval(function(){if(LOADED&&document.visibilityState==='visible')load(true)},REFRESH_MS);
setInterval(updNote,10000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&LOADED&&Date.now()-LOADED>REFRESH_MS)load(true)});
var TESTS=M.tests.filter(function(t){return t.kind==='topic'||t.kind==='exam'});
function build(profiles,progress,attempts){
 var by={};profiles.forEach(function(p){by[p.id]={id:p.id,name:p.display_name||'(no name)',joined:p.created_at,last:p.created_at,seen:null,now:null,quest:null,lab:null,fin:[]}});
 progress.forEach(function(g){var s=by[g.user_id];if(!s)return;if(g.app==='quest')s.quest=g;else if(g.app==='practice')s.lab=g;if(g.updated_at>s.last)s.last=g.updated_at;if(!s.seen||g.updated_at>s.seen)s.seen=g.updated_at;var nw=g.data&&g.data.now;if(nw&&nw.where&&(!s.now||String(nw.at)>String(s.now.at)))s.now=nw});
 attempts.forEach(function(a){var s=by[a.user_id];if(!s)return;if(a.taken_at>s.last)s.last=a.taken_at;if(!s.seen||a.taken_at>s.seen)s.seen=a.taken_at;if(a.test_id==='final')s.fin.push(a)});
 var cls={};
 ROWS=Object.keys(by).map(function(id){var s=by[id],qd=(s.quest&&s.quest.data)||{},best=(s.lab&&s.lab.best_scores)||{};
  var xp=s.quest?(+s.quest.xp||0):0,quiz=qd.quiz||{};
  var lv=M.levels.filter(function(L){return (quiz[L.id]||0)>=80}).length;
  var tt=TESTS.map(function(t){return best[t.id+':test']});var done=tt.filter(function(v){return v!=null});
  var fs=s.fin.map(function(a){return a.total?100*a.score/a.total:0});
  var dom={};s.fin.forEach(function(a){Object.keys(a.by_domain||{}).forEach(function(k){var v=a.by_domain[k];var d=dom[k]=dom[k]||{c:0,n:0};d.c+=+v.c||0;d.n+=+v.n||0;var cd=cls[k]=cls[k]||{c:0,n:0};cd.c+=+v.c||0;cd.n+=+v.n||0})});
  var on=s.now?(s.now.app==='quest'?'Quest':'Practice Lab')+': '+s.now.where:'';
  var ch=chProg(qd,(s.lab&&s.lab.data)||{},best);
  return {id:id,name:s.name,last:s.last,seen:s.seen,on:on,xp:xp,rank:rankOf(xp),badges:(qd.badges||[]).length,badgeList:qd.badges||[],levels:lv,boss:s.quest?(+qd.boss||0):null,quiz:quiz,
   passed:done.filter(function(v){return v>=80}).length,sread:CHS.filter(function(c){return (qd.sread||[]).indexOf(c.n)>=0}).length,labAvg:avg(done),tests:best,finN:s.fin.length,finBest:fs.length?Math.max.apply(null,fs):null,finAvg:avg(fs),finLast:fs.length?fs[fs.length-1]:null,dom:dom,ch:ch,started:!!(s.quest||s.lab)}});
 DOMAVG=cls}
// Progress by textbook chapter (Ch 1-7), from data the apps already save: Chapter Quiz best scores,
// Practice Lab answer stats per question (mapped to chapters by objective), and Quest lessons opened.
var CHS=M.chapters||[],CHI=M.chItems||{},CHL=M.chLessons||{};
function chProg(qd,ld,best){var st=ld.stats||{},seen=qd.seen||{},sr=qd.sread||[],out={};
 CHS.forEach(function(c){var a={c:0,n:0};Object.keys(st).forEach(function(id){var x=st[id];if((CHI[id]||[]).indexOf(c.n)>=0){a.c+=+x.c||0;a.n+=+x.n||0}});
  var L=CHL[String(c.n)]||[],rd=L.filter(function(p){return (seen[p[0]]||[]).indexOf(p[1])>=0}).length;
  var q=best['ch'+c.n+':test'],qt=best['ch'+c.n+':train'];out[c.n]={sum:sr.indexOf(c.n)>=0,quiz:q==null?null:q,train:qt==null?null:qt,acc:a.n?100*a.c/a.n:null,ans:a.n,read:L.length?100*rd/L.length:null,rd:rd,tot:L.length}});
 return out}
function chTable(rows){return '<table><tr><th>Chapter</th><th>Summary read</th><th>Ch Quiz best (Testing)</th><th>Lab accuracy</th><th>Quest lessons read</th></tr>'+CHS.map(function(c){var v=rows(c.n);return '<tr><td>'+esc(c.icon+' Ch '+c.n+': '+c.title)+'</td><td>'+(v.sumPct!=null?pct(v.sumPct)+' <span class="na small">of students</span>':(v.sum?'✅ Yes':'<span class="na">Not yet</span>'))+'</td><td>'+pct(v.quiz)+'</td><td>'+pct(v.acc)+(v.ans?' <span class="na small">('+v.ans+' answers)</span>':'')+'</td><td>'+pct(v.read)+(v.tot!=null&&v.rd!=null?' <span class="na small">('+v.rd+'/'+v.tot+')</span>':'')+'</td></tr>'}).join('')+'</table>'}
function chClass(n){var q=[],a=[],r=[],sm=[];ROWS.forEach(function(x){var v=x.ch&&x.ch[n];if(!v)return;if(x.started)sm.push(v.sum?100:0);if(v.quiz!=null)q.push(v.quiz);if(v.acc!=null)a.push(v.acc);if(x.started&&v.read!=null)r.push(v.read)});return {sumPct:sm.length?avg(sm):null,quiz:avg(q),acc:avg(a),read:avg(r),ans:0,rd:null,tot:null,nq:q.length}}
var COLS=[['name','Student'],['status','Status'],['on','Currently on'],['xp','Quest XP'],['rank','Rank'],['levels','Levels passed'],['badges','Badges'],['boss','Boss best'],['passed','Tests 80%+'],['sread','Summaries read'],['labAvg','Avg best test'],['finN','Final tries'],['finBest','Final best'],['finAvg','Final avg']];
function cell(r,k){switch(k){case 'name':return '<span class="dot'+(isActive(r)?' on':'')+'" aria-hidden="true"></span><b>'+esc(r.name)+'</b>'+(r.started?'':' <span class="na small">not started</span>');case 'last':return esc(when(r.last));
 case 'status':return '<span class="st'+(isActive(r)?' on':'')+'">'+esc(statusText(r))+'</span>';case 'on':return r.on?'<span class="on-txt">'+esc(r.on)+'</span>':'<span class="na">–</span>';case 'xp':return r.xp;case 'rank':return esc(r.rank);
 case 'levels':return r.levels+' / '+M.levels.length;case 'badges':return r.badges+' / '+M.badges.length;case 'boss':return pct(r.boss);case 'passed':return r.passed+' / '+TESTS.length;case 'sread':return r.sread+' / '+CHS.length;case 'labAvg':return pct(r.labAvg);case 'finN':return r.finN;case 'finBest':return pct(r.finBest);case 'finAvg':return pct(r.finAvg)}}
function sorted(){var k=SORT.k,d=SORT.d;return ROWS.slice().sort(function(a,b){if(k==='status'){var p=age(a),q=age(b);p=p==null?1e15:p;q=q==null?1e15:q;return d*(p-q)||a.name.localeCompare(b.name)}var x=a[k],y=b[k];if(x==null)x=-1;if(y==null)y=-1;if(typeof x==='string'||typeof y==='string'){return d*String(x).localeCompare(String(y))}return d*(x-y)})}
function detail(r){
 var tests=TESTS.map(function(t){var v=r.tests[t.id+':test'],n=r.tests[t.id+':train'];return '<tr><td>'+esc(t.name)+' <span class="na small">'+esc(t.short)+'</span></td><td>'+pct(v)+'</td><td>'+pct(n)+'</td></tr>'}).join('');
 var doms=Object.keys(M.domains).map(function(k){var d=r.dom[k];return '<tr><td>'+esc(k+'. '+M.domains[k])+'</td><td>'+(d&&d.n?pct(100*d.c/d.n)+' <span class="na small">('+d.c+'/'+d.n+')</span>':pct(null))+'</td></tr>'}).join('');
 var lv=M.levels.map(function(L){return '<tr><td>'+esc(L.icon+' '+L.name)+'</td><td>'+pct(r.quiz[L.id])+'</td></tr>'}).join('');
 var bd=M.badges.filter(function(b){return r.badgeList.indexOf(b.id)>=0}).map(function(b){return '<span>'+esc(b.icon+' '+b.name)+'</span>'}).join('')||'<span class="na">None yet</span>';
 return '<tr class="det"><td colspan="'+COLS.length+'"><div class="dgrid"><div><h4>Quest level quizzes (best)</h4><table>'+lv+'</table><h4 style="margin-top:.8rem">Badges</h4><div class="chips">'+bd+'</div></div><div><h4>Final Exam Review by domain</h4><table>'+doms+'</table></div><div><h4>Practice Lab best scores</h4><table><tr><th>Test</th><th>Testing</th><th>Training</th></tr>'+tests+'</table></div><div style="grid-column:1/-1"><h4>By textbook chapter (Ch 1-7)</h4><div class="tw">'+chTable(function(n){return r.ch[n]})+'</div></div></div></td></tr>'}
function render(){
 var tw=$('.tw'),sx=tw?tw.scrollLeft:0,now=ROWS.filter(isActive).length;
 var n=ROWS.length,act=ROWS.filter(function(r){return r.last&&(Date.now()-new Date(r.last))<7*864e5&&r.started}).length;
